<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{TITLE}">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="{UP}icons/icon-180.png">
<link rel="icon" href="{UP}icons/icon-192.png">
<title>{TITLE}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F7F1E8; --bg2:#F8F4EE; --card:#FFFCF7; --ink:#2A1A12; --ink2:#4A3326; --muted:#6B5A4D; --faint:#75614F; --hint:#B3A393;
  --sa:#C4550F; --saT:#A8470C; --tint:#FBE7D6; --pill:#EDE2D3; --line:#F1E8DC; --rule:#DDD1C3; --dark:#2A1A12; --peach:#F08A4B; --peachT:#F6B48A;
  --serif:'Instrument Serif', 'Iowan Old Style', Georgia, serif; --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gut:clamp(16px, 5.2vw, 24px); --h1:clamp(36px, 10.6vw, 46px); --h2:clamp(23px, 6.6vw, 27px);
  --navH:76px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input:focus,textarea:focus{outline:none}
:focus-visible{outline:2px solid var(--sa);outline-offset:2px}
textarea::placeholder,input::placeholder{color:var(--hint);font-style:italic}
a{color:inherit}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:480px;margin:0 auto;padding-inline:var(--gut);padding-block:22px calc(var(--navH) + 34px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px;min-height:100vh}
.wrap.nonav{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.serif{font-family:var(--serif)}
.it{font-style:italic}
.h1{font-family:var(--serif);font-size:var(--h1);line-height:1;letter-spacing:-.015em}
.h2{font-family:var(--serif);font-size:var(--h2);line-height:1.1}
.sub{font-size:15px;line-height:1.5;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--saT)}
.small{font-size:13px;color:var(--faint)}
.pill{height:30px;padding:0 14px;border-radius:15px;background:var(--pill);color:#6B4A33;display:inline-flex;align-items:center;font-size:13px;font-weight:600;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.card{border-radius:24px;background:var(--card);padding:18px}
.darkcard{border-radius:26px;background:var(--dark);color:#F7F1E8;padding:22px 20px}
.btn{height:56px;border:none;border-radius:16px;background:var(--sa);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--pill);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--saT);height:44px;font-size:15px}
.btn.sm{height:44px;font-size:15px;border-radius:14px;width:auto;padding:0 18px}
.link{border:none;background:none;padding:0;color:var(--saT);font-weight:600;font-size:14px}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:22px;border:none;background:var(--pill);color:var(--ink);display:flex;align-items:center;justify-content:center}
.chip{min-height:38px;padding:8px 14px;border-radius:19px;border:none;background:var(--pill);color:var(--ink);font-size:14px;font-weight:600;transition:background .2s,color .2s}
.chip.on{background:var(--sa);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.field{width:100%;border:none;background:transparent;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:20px;height:44px;padding:0}
.ruled{width:100%;border:none;padding:0;margin:0;border-radius:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);font-family:var(--serif);font-style:italic;font-size:20px;line-height:34px;resize:none;color:var(--ink)}
.divrow{border-bottom:1px solid var(--line)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes pop{0%{transform:scale(.3);opacity:.2}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@keyframes petal{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),160px) rotate(var(--r));opacity:0}}
@keyframes burst{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes ripple{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,252,247,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--pill);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.nav button{height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.nav button.on{color:var(--saT);font-weight:700}
.nav .lotus{justify-self:center;width:58px;height:58px;border-radius:29px;background:var(--sa);color:#fff;font-size:0}

/* darshan */
.murtiBox{height:clamp(300px,46vh,400px);overflow:hidden;margin-inline:calc(var(--gut) * -1);margin-top:-22px;position:relative}
.murtiBox img{width:100%;height:100%;object-fit:cover;object-position:center 26%;display:block;animation:breathe 10s ease-in-out infinite}
.quote{font-family:var(--serif);font-style:italic;line-height:1.3;color:#3A2C22;text-wrap:pretty}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.by{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--saT)}

/* today */
.task{width:100%;display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 16px;border:none;border-radius:20px;background:var(--card);text-align:left;font-size:16px;font-weight:500;transition:background .25s}
.task .tick{width:28px;height:28px;flex-shrink:0;border-radius:14px;border:2px solid #DCCBB8;display:flex;align-items:center;justify-content:center;transition:all .25s}
.task.done .tick{background:var(--sa);border-color:var(--sa)}
.task.done .tt{color:var(--faint);text-decoration:line-through;text-decoration-color:#CDBBA8}
.task.sabha{background:var(--tint)}
.xbtn{margin-left:auto;width:32px;height:32px;border-radius:16px;border:none;background:transparent;color:var(--hint);display:flex;align-items:center;justify-content:center}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--pill)}
.seg button{height:40px;border:none;border-radius:12px;background:transparent;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--ink)}
.addrow{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 16px;border-radius:20px;border:1.5px dashed #DCCBB8}
.addrow input{flex:1;min-width:0;border:none;background:transparent;font-size:16px;height:44px}
.petals{position:relative;height:0}
.petals i{position:absolute;top:0;width:10px;height:14px;border-radius:10px 0 10px 0;background:var(--peach);animation:petal 1.6s ease-out forwards}

/* checkin */
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quad button{aspect-ratio:1/1.05;max-width:100%;border:none;border-radius:26px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;padding:16px;text-align:left;transition:transform .2s}
.quad button:active{transform:scale(.97)}
.quad .e{font-family:var(--serif);font-style:italic;font-size:17px;opacity:.85}
.quad .l{font-family:var(--serif);font-size:clamp(24px,7vw,30px);line-height:1}
.orb{width:120px;height:120px;border-radius:60px;align-self:center;animation:pop .6s both}

/* calm */
.calmTop{background:#1E1410;color:#F7F1E8;border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.breath{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center}
.breath .c{position:absolute;inset:0;border-radius:50%;background:#C4550F;transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out}
.breath .rp{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(246,180,138,.5);opacity:0}
.breath .rp.go{animation:ripple 2.2s ease-out}
.breath .w{position:relative;font-family:var(--serif);font-size:24px;line-height:1.1;max-width:150px}
.player{display:flex;flex-direction:column;gap:12px}
.player img{width:64px;height:64px;border-radius:16px;object-fit:cover;object-position:center 20%}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--sa),var(--sa)) 0/var(--p,0%) 100% no-repeat,var(--pill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:11px;background:var(--sa);margin-top:-8px;border:3px solid #fff;box-shadow:0 1px 3px rgba(42,26,18,.25)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--pill)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--sa)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:9px;background:var(--sa);border:3px solid #fff}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel>*{scroll-snap-align:start;flex-shrink:0}

/* feed */
.feed{position:fixed;inset:0;z-index:40;background:#140C08;color:#fff}
.feed .sc{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed .sc::-webkit-scrollbar{display:none}
.feed .it{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.feed .it img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.feed .tap{position:absolute;inset:0;border:none;background:transparent;padding:0}
.feed .q{position:absolute;left:0;right:0;bottom:0;padding:120px 24px calc(40px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,12,8,0),rgba(20,12,8,.86) 42%);pointer-events:none;transition:opacity .35s}
.feed .q p{margin:0 64px 10px 0;font-family:var(--serif);font-style:italic;font-size:clamp(21px,6.2vw,26px);line-height:1.25;text-wrap:pretty}
.feed .hidden .q{opacity:0}
.glass{width:46px;height:46px;border-radius:23px;border:none;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;justify-content:center}
.feed .top{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.feed .top>*{pointer-events:auto}
.feed .side{position:absolute;z-index:3;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.feed .heart.on{background:var(--sa)}
.burst{position:absolute;inset:0;border-radius:50%;border:3px solid var(--peach);animation:burst .6s ease-out forwards;pointer-events:none}

/* grow */
.arch{width:min(62vw,240px);border-radius:120px 120px 22px 22px;overflow:hidden;background:var(--card);border:none;padding:0;text-align:left;display:flex;flex-direction:column}
.arch img{width:100%;aspect-ratio:3/3.3;object-fit:cover;object-position:center 22%;display:block}
.arch .b{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:112px;border:none;border-radius:22px;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;gap:12px}
.tile .n{font-family:var(--serif);font-size:21px;line-height:1.1}

/* stepper screens (teaching, guide, weekly) */
.stage{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:18px;padding-inline:var(--gut);padding-block:18px calc(22px + env(safe-area-inset-bottom,0px))}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots span{height:6px;width:6px;border-radius:3px;background:#DCCBB8;transition:width .3s,background .3s}
.dots span.on{width:22px;background:var(--sa)}
.dots span.past{background:var(--sa)}
.grow1{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.navbtns{display:flex;gap:10px}
.navbtns .back{width:56px;height:56px;flex-shrink:0;border:none;border-radius:16px;background:var(--pill);display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,12,8,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .p{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px var(--gut) calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:fade .3s both}
.toast{position:fixed;left:50%;bottom:calc(var(--navH) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--dark);color:#F7F1E8;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);animation:fade .3s both}
.acc{border-radius:22px;background:#F1E8DC;padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:background .2s}
.acc.open{background:var(--card)}
.acc>button:first-child{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0;border:none;background:none;text-align:left;font-family:var(--serif);font-size:21px;line-height:1.15}
.chev{width:32px;height:32px;flex-shrink:0;border-radius:16px;background:var(--pill);display:flex;align-items:center;justify-content:center;transition:transform .3s}
.acc.open .chev{transform:rotate(180deg)}
.checkrow{width:100%;display:flex;align-items:center;gap:14px;padding:14px 0;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:15px}
.checkrow:last-child{border-bottom:none}
.box{width:24px;height:24px;flex-shrink:0;border-radius:8px;border:2px solid #DCCBB8;display:flex;align-items:center;justify-content:center}
.box.on{background:var(--sa);border-color:var(--sa)}
.opt{min-height:56px;width:100%;border:none;border-radius:16px;background:var(--card);text-align:left;padding:12px 18px;font-size:16px;font-weight:500;transition:background .2s,color .2s}
.opt.on{background:var(--sa);color:#fff}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:12px 0;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.tapdots{display:flex;gap:12px;flex-wrap:wrap}
.tapdots button{width:54px;height:54px;border-radius:27px;border:2px dashed #9FB7A9;background:transparent;transition:all .25s}
.tapdots button.on{background:#2E7556;border:2px solid #2E7556}
.xbtn{margin-left:auto;width:36px;height:36px;border-radius:18px;border:none;background:transparent;color:var(--hint);display:flex;align-items:center;justify-content:center}
.fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.fx i{position:absolute;width:10px;height:14px;border-radius:10px 0 10px 0}
.burst-p{margin:-7px 0 0 -5px;animation:fly .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(1);opacity:0}}
.rain-p{top:-20px;animation-name:fall;animation-timing-function:linear;animation-fill-mode:both}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(var(--sx),108vh) rotate(var(--r));opacity:.85}}
.task.just{animation:rowglow .9s ease}
@keyframes rowglow{0%{background:var(--tint)}100%{background:var(--card)}}
.task.just .tick{animation:tickpop .5s cubic-bezier(.2,.8,.2,1.4)}
@keyframes tickpop{0%{transform:scale(.5)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
.task.just .tick path{stroke-dasharray:26;stroke-dashoffset:26;animation:draw .35s .12s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.orb{animation:orbin .7s cubic-bezier(.2,.8,.2,1.2) both,breathe 5s 1s ease-in-out infinite}
@keyframes orbin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.savepill{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:75;height:28px;padding:0 12px;border-radius:14px;display:flex;align-items:center;font-size:12px;font-weight:700;background:var(--dark);color:#F7F1E8;animation:pillin .25s both}
@keyframes pillin{from{opacity:0}to{opacity:1}}
.savepill.retry{background:#8E2F24}.savepill.local{background:#6B4A33}.savepill.saved{background:#2E7556}

/* ---- Prapti additions ---- */
:root{--card2:#FFF7EE;--pillText:#6B4A33;--quote:#3A2C22;--tickLine:#DCCBB8;--navBg:rgba(255,252,247,.96)}
.pill{color:var(--pillText)} .quote{color:var(--quote)} .task .tick,.addrow{border-color:var(--tickLine)} .nav{background:var(--navBg)}
input,textarea,select{color:var(--ink)}
.inp{height:50px;border:1px solid var(--rule);border-radius:14px;padding:0 14px;font-size:17px;background:var(--card2);width:100%}
.timein{height:42px;border:none;border-radius:12px;background:var(--pill);padding:0 12px;font-size:17px;font-weight:600;min-width:110px;text-align:center}
.libx{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:12px;border:none;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:0}
.libx svg{width:12px;height:12px}
.firsttag{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--saT);pointer-events:none}
.notecard{background:var(--tint);gap:10px;display:flex;flex-direction:column;position:relative;padding:20px 18px 18px}
.heartbtn{align-self:flex-end;width:52px;height:52px;border-radius:26px;border:none;background:var(--sa);color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.sleeprow{min-height:60px;border-bottom:1px solid var(--line)} .sleeprow:last-child{border-bottom:none}
.rested{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rested button{border:none;border-radius:16px;background:var(--card);padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.rested button.on{background:#2F4468;color:#fff}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px}
details summary{cursor:pointer;list-style:none} details summary::-webkit-details-marker{display:none} details summary::after{content:' +';color:var(--saT)} details[open] summary::after{content:' −'}
.malawrap{min-height:100vh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.malaring{position:relative;width:310px;height:310px;margin:52px 0 10px;max-width:100%}
.malac{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.malan{font-size:96px;line-height:1}
.malaicon{width:44px;height:44px;border-radius:22px;border:3px dotted var(--sa);flex-shrink:0}
.nightwrap{background:#0F0A08;color:#D9CBBB} .nightwrap .h1{color:#E9DCCB}
body:has(.nightwrap){background:#0F0A08}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rt{width:100%;border-collapse:collapse;font-size:14px} .rt th,.rt td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)} .rt th{color:var(--faint);font-weight:600}
@media print{.nav,.noprint,.toast,#fx{display:none!important} body,html{background:#fff!important} .wrap{padding:0!important} .card{break-inside:avoid;border:1px solid #eee}}

/* ---- Dark theme ---- */
:root[data-theme="dark"]{color-scheme:dark;--bg:#17100C;--bg2:#17100C;--card:#241A14;--card2:#2B1F18;--ink:#F3E9DD;--ink2:#E2D4C4;--muted:#BCAB9B;--faint:#9E8D7E;--hint:#7C6D61;--saT:#F08A4B;--tint:#3A2416;--pill:#33271F;--line:#2F241D;--rule:#3E3128;--dark:#2E211A;--pillText:#E9CDB3;--quote:#EADFD3;--tickLine:#5A4A3E;--navBg:rgba(23,16,12,.94)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17100C;--bg2:#17100C;--card:#241A14;--card2:#2B1F18;--ink:#F3E9DD;--ink2:#E2D4C4;--muted:#BCAB9B;--faint:#9E8D7E;--hint:#7C6D61;--saT:#F08A4B;--tint:#3A2416;--pill:#33271F;--line:#2F241D;--rule:#3E3128;--dark:#2E211A;--pillText:#E9CDB3;--quote:#EADFD3;--tickLine:#5A4A3E;--navBg:rgba(23,16,12,.94)}}
:root[data-theme="dark"] .guidepage{background:var(--bg)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .guidepage{background:var(--bg)!important}}

/* ================= Prapti v2 design language ================= */
/* screens always fit: dynamic viewport height, primary buttons stay reachable */
.wrap,.stage{min-height:100vh;min-height:100dvh}
.malawrap{min-height:100vh;min-height:100dvh}
.guidepage{min-height:100vh!important;min-height:100dvh!important}
.sheet .p{max-height:88vh;max-height:88dvh}
.cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;gap:8px}
.cta::before{content:'';position:absolute;left:calc(var(--gut) * -1);right:calc(var(--gut) * -1);top:-28px;bottom:calc(-12px - env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--ctabg,var(--bg)) 34px);z-index:-1;pointer-events:none}
.navbtns{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6}

/* re-renders never replay entrance animations (stops the double-fade twitch) */
#app.still .fade,#app.still .pop,#app.still .orb,#app.still .rise,#app.still .wkdot{animation:none!important}

/* no slanted text */
.it,.quote,.ruled,.quad .e,.feed .q p,textarea::placeholder,input::placeholder{font-style:normal!important}

/* press feel */
.card[data-a],.darkcard[data-a],.tile,.opt,.chip,.task,.setrow,.mood4 button,.arch{transition:transform .16s ease,background .25s,color .25s}
.card[data-a]:active,.darkcard[data-a]:active,.tile:active,.opt:active,.task:active,.mood4 button:active,.arch:active{transform:scale(.98)}
.chip:active{transform:scale(.95)}
.sheet{animation:shade .25s ease both}
.sheet .p{animation:sheetUp .42s cubic-bezier(.2,.9,.25,1.04) both}
@keyframes shade{from{background:rgba(20,12,8,0)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.rise2{animation-delay:.06s}.rise3{animation-delay:.12s}.rise4{animation-delay:.18s}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}}

/* sky header */
:root{--s1:#F9C9A2;--s2:#FBDDC4;--sun:rgba(255,240,214,.95);--haze:rgba(244,168,140,.45);--skyInk:#6B4A33}
.sky.t-day{--s1:#F6D6A8;--s2:#FAE6CB;--sun:rgba(255,246,222,.95);--haze:rgba(240,190,120,.4)}
.sky.t-eve{--s1:#E9A58E;--s2:#F3CDB7;--sun:rgba(255,214,190,.9);--haze:rgba(200,120,150,.35)}
.sky.t-night{--s1:#CFC3DD;--s2:#E6DDE8;--sun:rgba(255,248,236,.8);--haze:rgba(140,130,190,.35)}
.sky{position:relative;margin-inline:calc(var(--gut) * -1);margin-top:calc(-22px - env(safe-area-inset-top,0px));padding:calc(22px + env(safe-area-inset-top,0px)) var(--gut) 18px;display:flex;flex-direction:column;gap:14px;isolation:isolate}
.skybg{position:absolute;left:0;right:0;top:0;bottom:-70px;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 45%,var(--bg) 100%);-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 55%,transparent 100%)}
.sky>*{position:relative;z-index:1}
.skybg .sun,.skybg .haze,.skybg .glow3{position:absolute;z-index:0;border-radius:50%;pointer-events:none}
.skybg .sun{width:300px;height:300px;top:-120px;right:-90px;background:radial-gradient(circle,var(--sun) 0%,rgba(255,226,190,.4) 40%,rgba(255,226,190,0) 70%);animation:drift 18s ease-in-out infinite alternate}
.skybg .haze{width:260px;height:180px;top:50px;left:-100px;background:radial-gradient(circle,var(--haze),rgba(0,0,0,0) 70%);animation:drift2 22s ease-in-out infinite alternate}
.sky.t-eve .skybg .sun{right:auto;left:-80px;top:-70px}
/* third light patch plus a slow colour shift */
.skybg .glow3{width:240px;height:200px;bottom:-60px;right:10%;background:radial-gradient(circle,var(--glow3,rgba(242,160,170,.35)),rgba(0,0,0,0) 70%);animation:drift3 30s ease-in-out infinite alternate}
.skybg::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,0) 20%,rgba(255,236,214,.35) 50%,rgba(255,255,255,0) 80%);background-size:250% 100%;animation:skyshift 26s ease-in-out infinite alternate}
@keyframes drift3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-30px) scale(1.15)}100%{transform:translate(-20px,-60px) scale(.95)}}
@keyframes skyshift{from{background-position:0% 0}to{background-position:100% 0}}
@keyframes drift{to{transform:translate(-40px,26px) scale(1.08)}}
@keyframes drift2{to{transform:translate(50px,-14px) scale(1.12)}}
.sky .pill{background:rgba(255,252,247,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hello{font-family:var(--serif);font-size:clamp(34px,10vw,42px);line-height:1.02;letter-spacing:-.01em}
.skysub{font-size:15px;font-weight:500;color:var(--skyInk)}
.skyrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}

/* lotus progress */
.lotusP{width:110px;height:96px;flex-shrink:0;overflow:visible}
.lotusP .lp{transform-box:view-box;transform-origin:60px 92px;animation:sway 8s ease-in-out infinite}
.lotusP.full .lp{animation-name:swayBig}
.lotusP.full{animation:glow 3.6s ease-in-out infinite}
.lotusP .on.new{animation:petalOn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes swayBig{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 14px rgba(240,138,75,.5))}}
@keyframes petalOn{from{opacity:0}}
.lotusRing{position:fixed;border-radius:50%;border:2px solid rgba(240,138,75,.6);pointer-events:none;z-index:80;transform:translate(-50%,-50%);animation:ringOut 1.3s ease-out forwards}
@keyframes ringOut{from{width:20px;height:20px;opacity:1}to{width:360px;height:360px;opacity:0}}

/* icon tiles */
.itile{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.itile.sm{width:40px;height:40px;border-radius:13px}
.itile svg{width:24px;height:24px}.itile.sm svg{width:20px;height:20px}

/* check-in on Today */
.mood4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mood4 button{height:56px;border:none;border-radius:16px;display:flex;align-items:flex-end;padding:8px 10px;font-size:13px;font-weight:700;color:#fff;text-align:left}
.moodline{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 16px;border:none;width:100%;text-align:left}
.moodline .dot{width:14px;height:14px;border-radius:7px;flex-shrink:0}

/* celebration card */
.cele{border-radius:26px;padding:22px 20px;background:linear-gradient(135deg,#D8651C 0%,#C4550F 45%,#A23B4F 130%);color:#FFF6EC;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.cele .eyebrow{color:#FFE2C8}
.cele h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,9vw,36px);line-height:1}
.cele.enter{animation:celeIn .7s cubic-bezier(.2,.9,.25,1.05) both}
.cele.enter::after{content:'';position:absolute;top:0;bottom:0;width:60%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:sheen 1.4s .3s ease forwards}
@keyframes celeIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes sheen{to{left:120%}}
.softfall{position:absolute;top:-20px;width:12px;height:18px;border-radius:12px 12px 12px 0;animation:softfall linear forwards}
@keyframes softfall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--sx),105vh) rotate(var(--r));opacity:.3}}

/* task ripple */
.task{position:relative;overflow:hidden}
.task .rip{position:absolute;left:30px;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(240,138,75,.22);transform:scale(0);pointer-events:none}
.task.just.done .rip{animation:rip .7s ease-out}
@keyframes rip{0%{transform:scale(0);opacity:1}100%{transform:scale(60);opacity:0}}

/* darshan v2 */
.dsh{padding-top:0!important;gap:0!important}
.dsh .hero{position:relative;height:clamp(250px,50dvh,470px);margin-inline:calc(var(--gut) * -1);margin-top:calc(0px - env(safe-area-inset-top,0px));overflow:hidden;background:#2A1A12}
.dsh .hero img{width:100%;height:100%;object-fit:cover;object-position:center 14%;display:block;animation:kenburns 24s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.1) translateY(-1.5%)}}
.dsh .hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(20,12,8,.28))}
.dsh .herotop{position:absolute;z-index:2;top:calc(14px + env(safe-area-inset-top,0px));left:var(--gut);right:var(--gut);display:flex;justify-content:space-between;align-items:center}
.glasspill{height:32px;padding:0 14px;border-radius:16px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:#fff;background:rgba(30,18,12,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.glassbtn{width:42px;height:42px;border-radius:21px;border:none;color:#fff;background:rgba(30,18,12,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
.dsh .panel{position:relative;z-index:3;margin-top:-30px;margin-inline:calc(var(--gut) * -1);padding:26px var(--gut) 0;background:var(--bg);border-radius:30px 30px 0 0;display:flex;flex-direction:column;gap:18px;flex:1}
.dsh .greet{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--saT)}
.dsh .qmark{font-family:var(--serif);font-size:64px;line-height:.5;color:var(--peach);height:26px;display:block}
.praptibox{background:var(--card);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}

/* mala v2 */
.malawrap{position:relative;overflow:hidden;isolation:isolate}
.malabg{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.malabg i{position:absolute;border-radius:50%;filter:blur(44px);opacity:0;transition:opacity 1.2s;will-change:transform,opacity}
.malawrap.playing .malabg i{opacity:.35}
.chant{margin-top:18px;display:flex;align-items:center;gap:14px;border:1px solid var(--rule);background:var(--card);border-radius:40px;padding:8px 22px 8px 8px;color:var(--ink);text-align:left}
.chant .pb{width:52px;height:52px;border-radius:26px;background:var(--sa);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.malawrap.playing .chant .pb{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,138,75,.45)}100%{box-shadow:0 0 0 18px rgba(240,138,75,0)}}
.malaring{margin-top:34px}

/* toggles */
.tg{width:51px;height:31px;border-radius:16px;background:var(--sa);position:relative;flex-shrink:0;border:none;padding:0;transition:background .25s}
.tg::after{content:'';position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .25s}
.tg.off{background:var(--rule)}.tg.off::after{left:2px}
.setrow.ic{justify-content:flex-start;gap:14px}

/* recap */
.stat{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.05}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* week dots on Me fill in one by one */
.wkdot{animation:pop .45s cubic-bezier(.2,.8,.2,1.3) both}

/* dark theme for the new pieces */
:root[data-theme="dark"] .sky{--s1:#4A2A1C;--s2:#2E1D15;--sun:rgba(240,138,75,.35);--haze:rgba(162,59,79,.28);--skyInk:#E9CDB3}
:root[data-theme="dark"] .sky.t-night{--s1:#2A2338;--s2:#1E1720;--sun:rgba(200,190,240,.18)}
:root[data-theme="dark"] .sky .pill{background:rgba(36,26,20,.6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sky{--s1:#4A2A1C;--s2:#2E1D15;--sun:rgba(240,138,75,.35);--haze:rgba(162,59,79,.28);--skyInk:#E9CDB3}
:root:not([data-theme="light"]) .sky.t-night{--s1:#2A2338;--s2:#1E1720;--sun:rgba(200,190,240,.18)}
:root:not([data-theme="light"]) .sky .pill{background:rgba(36,26,20,.6)}}
@media (prefers-reduced-motion: reduce){.lotusP .lp,.skybg .sun,.skybg .haze,.skybg .glow3,.skybg::before,.dsh .hero img{animation:none!important}}
/* Today's darshan chip */
.dchip{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 4px;border-radius:20px;border:none;background:rgba(255,252,247,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;font-weight:700;color:var(--saT);box-shadow:0 4px 14px rgba(120,60,20,.10);transition:transform .15s}
.dchip:active{transform:scale(.95)}
.dchip img{width:32px;height:32px;border-radius:16px;object-fit:cover;object-position:center 22%;display:block}
.dchip svg{width:16px;height:16px}
:root[data-theme="dark"] .dchip{background:rgba(36,26,20,.7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dchip{background:rgba(36,26,20,.7)}}

/* ===== v2.1 ===== */
#app.pagein{animation:pagein .3s ease both}
@keyframes pagein{from{opacity:0}}
/* what she types is sans; the questions stay serif */
.ruled{font-family:var(--sans)!important;font-size:17px!important;color:var(--ink)}
.field{font-family:var(--sans)!important;font-size:17px!important;font-weight:500}
textarea::placeholder,input::placeholder{font-family:var(--sans);color:var(--hint)}
/* check-in and sleep tiles */
.duorow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo{position:relative;display:flex;align-items:center;gap:12px;border:none;background:var(--card);border-radius:22px;padding:14px;text-align:left;color:var(--ink);min-height:74px;transition:transform .16s}
.duo:active{transform:scale(.97)}
.duoic{width:40px;height:40px;border-radius:20px;background:var(--pill);color:var(--saT);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.duo.due .duoic{background:var(--tint)}
.duoic{position:relative}
.duedot{position:absolute;top:0;right:0;border:2px solid var(--card);box-sizing:content-box;width:8px;height:8px;border-radius:4px;background:var(--sa);animation:breathe 2.4s ease-in-out infinite}
/* celebration: one serif line */
.cele{padding:24px 22px;align-items:flex-start}
.cele{padding:18px 20px}
.cele h3{font-size:21px;line-height:1.2}
.cele{padding:16px 20px;border-radius:20px}
/* darshan poster */
.dsh .hero{height:clamp(360px,64dvh,620px)}
.dsh .hero::after{height:70%;background:linear-gradient(to bottom,rgba(20,12,8,0),rgba(20,12,8,.55) 45%,rgba(20,12,8,.86))}
.heroq{position:absolute;z-index:2;left:var(--gut);right:var(--gut);bottom:52px;color:#FFF6EC;display:flex;flex-direction:column;gap:12px}
.heroq .quote{color:#FFF6EC;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.heroq .by{color:var(--peachT)}
.clamp4{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.dsh .panel{gap:16px}
/* journal as a book */
.book{position:relative;border:none;text-align:left;width:100%;min-height:150px;border-radius:8px 22px 22px 8px;padding:26px 24px 24px 40px;color:#F3E3C8;display:flex;align-items:flex-end;overflow:visible;
  background:radial-gradient(130% 100% at 25% 15%,#6E3F25 0%,#4C2917 55%,#3A1D10 100%);
  box-shadow:inset 14px 0 0 rgba(0,0,0,.22),inset 16px 0 0 rgba(255,255,255,.05),0 14px 28px rgba(60,25,8,.22);
  transform-origin:left center;transition:transform .16s}
.book:active{transform:scale(.985)}
.book::before{content:'';position:absolute;left:22px;top:12px;bottom:12px;border-left:1.5px dashed rgba(243,227,200,.28)}

.book .band{position:absolute;right:30px;top:0;bottom:0;width:8px;background:linear-gradient(90deg,#24110A,#3A1C10 50%,#24110A);box-shadow:1px 0 2px rgba(0,0,0,.3)}
.book .ribbon{position:absolute;left:62%;bottom:-16px;width:12px;height:26px;background:var(--sa);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.booktitle{font-family:var(--serif);font-size:clamp(30px,8.6vw,36px);line-height:1;color:#E3C28E;text-shadow:0 1px 0 rgba(0,0,0,.45),0 -1px 0 rgba(255,236,200,.12)}
.booksub{font-size:13px;color:#CDB590;letter-spacing:.02em}
.book.opening{animation:bookopen .42s cubic-bezier(.5,0,.7,.4) forwards}
@keyframes bookopen{to{transform:perspective(1000px) rotateY(-80deg);opacity:.2}}
.paperpage{--card:#FFFDF8;background:#FBF6EC repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(140,100,60,.07) 33px,rgba(140,100,60,.07) 34px)}
body:has(.paperpage){background:#FBF6EC}
:root[data-theme="dark"] .paperpage{background:#1F1712 repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(255,240,220,.04) 33px,rgba(255,240,220,.04) 34px)}
:root[data-theme="dark"] body:has(.paperpage){background:#1F1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .paperpage{background:#1F1712 repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(255,240,220,.04) 33px,rgba(255,240,220,.04) 34px)}:root:not([data-theme="light"]) body:has(.paperpage){background:#1F1712}}
/* mala banner in Calm space */
.malabanner{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;border:none;text-align:left;width:100%;border-radius:28px;padding:22px 18px 22px 22px;min-height:170px;color:#F7F1E8;background:radial-gradient(90% 120% at 90% 50%,#4A2716 0%,#241510 60%,#1A110D 100%);transition:transform .16s}
.malabanner:active{transform:scale(.98)}
.malabanner::before{content:'';position:absolute;width:220px;height:220px;right:-40px;top:-30px;border-radius:50%;background:radial-gradient(circle,rgba(196,85,15,.45),rgba(196,85,15,0) 70%);animation:drift2 14s ease-in-out infinite alternate}
.miniring{position:relative;width:128px;height:128px;flex-shrink:0;z-index:1}
.miniring>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#F7F1E8}
.minichant{margin-top:6px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:16px;background:var(--sa);font-size:13px;font-weight:700}
.minichant svg{width:14px;height:14px}
.malabg i{transition:none}
.sky>.skybg{position:absolute;z-index:0}

/* continuous motion across re-renders */
.skybg .sun,.skybg .haze,.skybg .glow3,.skybg::before,.malabanner::before,.dsh .hero img,.duedot,.lotusP.full,.sky .sun{animation-delay:var(--t,0s)}
#app.still .rise,#app.still .fade,#app.still .pop,#app.still .wkdot,#app.still .orb{animation:none!important}

/* ===== Sign in ===== */
.login{position:relative;min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 28px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:40px;isolation:isolate}
.loginbg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.loginbg i{position:absolute;border-radius:50%;filter:blur(60px)}
.loginbg i:nth-child(1){width:80vmax;height:80vmax;left:-30vmax;top:-30vmax;background:radial-gradient(circle,rgba(240,138,75,.55),rgba(240,138,75,0) 65%);animation:lg1 14s ease-in-out infinite alternate}
.loginbg i:nth-child(2){width:70vmax;height:70vmax;right:-30vmax;bottom:-25vmax;background:radial-gradient(circle,rgba(246,180,138,.6),rgba(246,180,138,0) 65%);animation:lg2 17s ease-in-out infinite alternate}
.loginbg i:nth-child(3){width:50vmax;height:50vmax;left:10vmax;top:30vmax;background:radial-gradient(circle,rgba(255,236,214,.9),rgba(255,236,214,0) 65%);animation:lg3 20s ease-in-out infinite alternate}
.loginbg i:nth-child(4){display:none}
@keyframes lg1{to{transform:translate(22vmax,26vmax) scale(1.12)}}
@keyframes lg2{to{transform:translate(-24vmax,-20vmax) scale(.92)}}
@keyframes lg3{to{transform:translate(-14vmax,-22vmax) scale(1.15)}}
:root[data-theme="dark"] .loginbg i:nth-child(1){background:radial-gradient(circle,rgba(196,85,15,.45),rgba(196,85,15,0) 65%)}:root[data-theme="dark"] .loginbg i:nth-child(2){background:radial-gradient(circle,rgba(150,70,20,.4),rgba(150,70,20,0) 65%)}:root[data-theme="dark"] .loginbg i:nth-child(3){background:radial-gradient(circle,rgba(240,138,75,.14),rgba(240,138,75,0) 65%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .loginbg i:nth-child(1){background:radial-gradient(circle,rgba(196,85,15,.45),rgba(196,85,15,0) 65%)}:root:not([data-theme="light"]) .loginbg i:nth-child(2){background:radial-gradient(circle,rgba(150,70,20,.4),rgba(150,70,20,0) 65%)}:root:not([data-theme="light"]) .loginbg i:nth-child(3){background:radial-gradient(circle,rgba(240,138,75,.14),rgba(240,138,75,0) 65%)}}
.themeSw{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:20px;display:flex;gap:2px;padding:3px;border-radius:20px;background:rgba(255,252,247,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fadein .8s 1.2s both}
.themeSw button{width:36px;height:34px;border:none;border-radius:17px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:background .25s,color .25s}
.themeSw button.on{background:var(--card);color:var(--saT);box-shadow:0 2px 8px rgba(60,30,10,.12)}
:root[data-theme="dark"] .themeSw{background:rgba(36,26,20,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .themeSw{background:rgba(36,26,20,.5)}}
.lgMark{display:flex;flex-direction:column;align-items:center;gap:18px}
.lgIcon{width:92px;height:92px;border-radius:28px;background:linear-gradient(160deg,#DB6A1E,#B84A0B);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 44px rgba(184,74,11,.32),inset 0 1px 0 rgba(255,255,255,.25);animation:iconIn 1s cubic-bezier(.2,.9,.25,1.1) both}
.lgIcon svg{width:72px;height:63px;margin-top:-6px;overflow:visible}
.lgWord svg{width:100%;height:auto;display:block}
.fanp{transform-box:view-box;transform-origin:60px 92px;animation:fanopen .9s cubic-bezier(.2,.8,.2,1.1) both}
@keyframes fanopen{from{transform:rotate(var(--a));opacity:.4}}
@keyframes iconIn{from{opacity:0;transform:scale(.7) translateY(12px)}}
.lgWord{width:min(170px,46vw);color:var(--ink);line-height:0;animation:wordIn 1.1s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes wordIn{from{opacity:0;transform:translateY(10px);letter-spacing:.06em}}
@keyframes fadein{from{opacity:0}}
.lgForm{display:flex;flex-direction:column;gap:22px;animation:rise .8s .9s cubic-bezier(.2,.8,.2,1) both}
.lgHint{text-align:center;color:var(--muted);font-size:15px}
.fl{position:relative;display:block;padding-top:16px}
.fl input{width:100%;border:none;background:transparent;border-bottom:1px solid var(--rule);border-radius:0;height:44px;padding:0;font-size:18px;color:var(--ink);transition:border-color .3s}
.fl span{position:absolute;left:0;top:28px;font-size:17px;color:var(--faint);pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.fl input:focus+span,.fl input:not(:placeholder-shown)+span{top:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--saT)}
.fl::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--sa);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.fl:focus-within::after{transform:scaleX(1)}
.fl input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px var(--bg) inset;-webkit-text-fill-color:var(--ink)}
.lgErr{min-height:20px;margin:-8px 0 -6px;font-size:14px;color:#B8400E;text-align:center}
.lgErr.ok{color:var(--muted)}
.lgBtn{position:relative;align-self:center;width:100%;height:58px;border:none;border-radius:29px;color:#fff;font-size:17px;font-weight:600;background:var(--sa);box-shadow:0 10px 24px rgba(196,85,15,.22);overflow:hidden;transition:width .45s cubic-bezier(.3,.8,.3,1),border-radius .45s,transform .15s,box-shadow .3s}
.lgBtn::after{display:none}
@keyframes sheen2{0%,60%{left:-60%}100%{left:130%}}
@keyframes btnsheen{50%{background-position:100% 0}}
.lgBtn:active{transform:scale(.97)}
.lgBtn .t{transition:opacity .2s}
.lgBtn .spin{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;opacity:0;transition:opacity .2s}
.lgBtn.busy{width:58px}
.lgBtn.busy .t{opacity:0}
.lgBtn.busy .spin{opacity:1;animation:spin .8s linear infinite}
.lgBtn.busy::after{display:none}
.lgBtn.done .spin{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.lgBtn.shake{animation:shake .45s ease}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.lgForgot{align-self:center;border:none;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:6px 10px}
/* flood transition */
.flood{position:fixed;z-index:95;border-radius:50%;transform:scale(.02);opacity:1;pointer-events:none;transition:transform .5s cubic-bezier(.5,0,.3,1),opacity .5s ease}
.flood.grow{transform:scale(1)}
.flood.out{opacity:0}
.nav .lotus.bloom svg{animation:bloom .5s cubic-bezier(.2,.8,.2,1.3)}
@keyframes bloom{50%{transform:scale(1.35) rotate(-8deg)}}
/* her photo */
.avatar{position:relative;width:68px;height:68px;border-radius:34px;border:3px solid rgba(255,252,247,.9);padding:0;flex-shrink:0;background:var(--tint);color:var(--saT);box-shadow:0 8px 20px rgba(120,60,20,.18);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.avatar:active{transform:scale(.95)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar .serif{font-size:30px}
.avplus{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:12px;background:var(--sa);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.avplus svg{width:12px;height:12px}
.avatar:has(img) .avplus{display:none}

.nav .lotus{background:linear-gradient(160deg,#DE6E22,#B84A0B);box-shadow:0 8px 20px rgba(184,74,11,.3)}
.nav .lotus svg{width:38px;height:33px;margin-top:-3px;overflow:visible}
.madeby{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px;text-align:center}
.mbicon{width:44px;height:44px;border-radius:13px;background:linear-gradient(160deg,#DE6E22,#B84A0B);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(184,74,11,.22)}
.mbicon svg{width:30px;height:26px;margin-top:-3px}
.mbword{width:84px;color:var(--ink);line-height:0}
.mbword svg{width:100%;height:auto;display:block}
/* darshan feed: controls stay visible on bright photos */
.glass{background:rgba(20,12,8,.38)!important;box-shadow:0 2px 10px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18)!important}
.feed .heart.on{background:var(--sa)!important}
.feed .it::before{content:'';position:absolute;left:0;right:0;top:0;height:140px;z-index:2;background:linear-gradient(rgba(20,12,8,.45),rgba(20,12,8,0));pointer-events:none}
.glassbtn{background:rgba(20,12,8,.38);box-shadow:0 2px 10px rgba(0,0,0,.25)}
/* journal paper in night mode: dark paper cards, not light ones */
:root[data-theme="dark"] .paperpage{--card:#2A2019}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .paperpage{--card:#2A2019}}
:root[data-theme="dark"] .acc{background:var(--card2)}:root[data-theme="dark"] .acc.open{background:var(--card)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .acc{background:var(--card2)}:root:not([data-theme="light"]) .acc.open{background:var(--card)}}
:root[data-theme="dark"] .guidepage .eyebrow,:root[data-theme="dark"] .guidepage .by,:root[data-theme="dark"] .guidepage .small[style*="color"]{color:var(--peachT)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .guidepage .eyebrow,:root:not([data-theme="light"]) .guidepage .by,:root:not([data-theme="light"]) .guidepage .small[style*="color"]{color:var(--peachT)!important}}

/* ===== v3: Me analytics ===== */
.fgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.fcell{aspect-ratio:1/1;border:none;border-radius:12px;background:var(--line);color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.fcell:active{transform:scale(.92)}
.fcell.today{box-shadow:0 0 0 2px var(--sa) inset}
.fcell[disabled]{background:transparent;border:1.5px dashed var(--rule)}
.mixbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.mixbar span{height:100%}
.sbars{display:flex;align-items:flex-end;gap:6px;height:84px;width:100%}
.sbars i{display:block;width:100%;max-width:26px;border-radius:7px}
/* round-up card on Today */
.wrapcard{position:relative;overflow:hidden;border:none;width:100%;text-align:left;border-radius:26px;padding:20px;color:#FFF6EC;background:linear-gradient(135deg,#E07A2E,#C4550F 50%,#A23B4F);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 28px rgba(160,60,30,.22)}
.wrapcard::before{content:'';position:absolute;width:200px;height:200px;right:-50px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,200,.45),rgba(255,226,200,0) 70%);animation:drift2 12s ease-in-out infinite alternate}
.wrapplay{position:relative;z-index:1;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.weekchip{position:relative;flex-shrink:0;width:136px;min-height:118px;border:none;border-radius:20px;padding:14px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.weekchip b{font-size:32px;font-weight:400;line-height:1}.weekchip b small{font-size:14px;font-family:var(--sans)}
.newdot{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:4px;background:#FFE2C8}
/* ===== the weekly story ===== */
.wstory{position:fixed;inset:0;z-index:50;color:#FFF6EC;display:flex;flex-direction:column;overflow:hidden;transition:background .5s}
.wstory.wdark{color:#2A1A12}
.wbars-top{position:absolute;z-index:3;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;gap:4px}
.wbars-top i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.wdark .wbars-top i{background:rgba(42,26,18,.18)}
.wbars-top i.done::after,.wbars-top i.now::after{content:'';position:absolute;inset:0;background:currentColor}
.wbars-top i.now::after{animation:wfill .5s ease both}
@keyframes wfill{from{transform:scaleX(0);transform-origin:left}}
.wclose{position:absolute;z-index:4;top:calc(26px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:20px;border:none;background:rgba(0,0,0,.18);color:inherit;display:flex;align-items:center;justify-content:center}
.wtap{position:absolute;z-index:2;top:80px;bottom:0}.wtap.wl{left:0;width:32%}.wtap.wr{right:0;width:68%}
.wbody{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:90px 28px calc(60px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;width:100%;pointer-events:none}
.wbody button{pointer-events:auto;position:relative;z-index:3}
.wbody>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.wbody>*:nth-child(2){animation-delay:.12s}.wbody>*:nth-child(3){animation-delay:.24s}.wbody>*:nth-child(4){animation-delay:.36s}.wbody>*:nth-child(5){animation-delay:.48s}
.weye{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.wbig{font-family:var(--serif);font-weight:400;font-size:clamp(36px,11vw,50px);line-height:1.02;letter-spacing:-.01em}
.wnum{font-family:var(--serif);font-weight:400;font-size:clamp(84px,28vw,128px);line-height:.9;letter-spacing:-.02em}
.wnum small{font-family:var(--sans);font-size:18px;letter-spacing:0;opacity:.85}
.wsub{font-size:17px;line-height:1.5;opacity:.92}
.wmark{align-self:flex-start;color:rgba(255,246,236,.95);animation:wbloom 1.2s cubic-bezier(.2,.8,.2,1.2) both!important}
@keyframes wbloom{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
.wdots{display:flex;gap:10px}
.wdots i{width:30px;height:30px;border-radius:15px;border:2px solid rgba(255,255,255,.5)}
.wdots i.on{background:#FFF6EC;border-color:#FFF6EC;animation:pop .5s cubic-bezier(.2,.8,.2,1.3) both}
.wcmp{display:flex;flex-direction:column;gap:12px}
.wcmp div{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.wcmp i{display:block;height:14px;border-radius:7px;background:#FFF6EC;width:0;transition:width 1s .4s cubic-bezier(.2,.8,.2,1)}
.wstory.go .wcmp i{width:var(--w)}
.wmix{display:flex;height:64px;border-radius:18px;overflow:hidden;gap:3px}
.wmix span{flex:0;display:flex;align-items:flex-end;padding:8px;transition:flex 1s .3s cubic-bezier(.2,.8,.2,1);min-width:0}
.wstory.go .wmix span{flex:var(--f)}
.wmix em{font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.wbars{display:flex;align-items:flex-end;gap:10px;height:150px}
.wbars span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.wbars i{display:block;width:100%;border-radius:10px;background:#C9D4EA;height:var(--h);animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{height:0}}
.wbars em{font-style:normal;font-size:12px;opacity:.8}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wgrid div{background:rgba(255,255,255,.12);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.wgrid b{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1}
.wgrid span{font-size:13px;opacity:.9}
.wlifts{display:flex;flex-direction:column;gap:10px}
.wlifts div{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.14);border-radius:16px;padding:14px 16px;font-size:17px;animation:rise .6s both}
.wquote{font-family:var(--serif);font-size:clamp(28px,8.4vw,36px);line-height:1.2}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchips span{background:rgba(255,255,255,.18);border-radius:16px;padding:8px 14px;font-size:14px;font-weight:600}
.wbtn{align-self:flex-start;height:52px;padding:0 24px;border:none;border-radius:26px;background:#FFF6EC;color:#A23B4F;font-size:16px;font-weight:700;margin-top:8px}
.wtrend{background:rgba(0,0,0,.12);border-radius:18px;padding:12px}
/* self-compassion minute */
.kindpage{background:linear-gradient(180deg,#F7E1E6,#FBEFE6 60%,var(--bg));min-height:100vh;min-height:100dvh}
.kindglow{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(162,59,79,.35),rgba(162,59,79,0) 70%);animation:breathe 6s ease-in-out infinite}
:root[data-theme="dark"] .kindpage{background:linear-gradient(180deg,#3A1F28,var(--bg) 70%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kindpage{background:linear-gradient(180deg,#3A1F28,var(--bg) 70%)}}
.kindcard{background:linear-gradient(135deg,#F7E1E6,#FBEFE6)!important;color:#2A1A12}
.kindcard .small{color:#6B4A3D}
:root[data-theme="dark"] .kindcard{background:linear-gradient(135deg,#3A1F28,#2B1F18)!important;color:var(--ink)}
:root[data-theme="dark"] .kindcard .small{color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kindcard{background:linear-gradient(135deg,#3A1F28,#2B1F18)!important;color:var(--ink)}:root:not([data-theme="light"]) .kindcard .small{color:var(--muted)}}
/* ===== v1.1: library, history, dashboard ===== */
:root{--flagBg:#FBE3DA}
:root[data-theme="dark"]{--flagBg:#3F2019}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--flagBg:#3F2019}}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut)}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex-shrink:0;min-height:34px;padding:6px 14px}
.chip.on{background:var(--dark);color:#fff}
:root[data-theme="dark"] .chip.on{background:var(--saT);color:#1B120D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{background:var(--saT);color:#1B120D}}
.libbtn,.shelfrow{display:flex;align-items:center;gap:12px;width:100%;border:none;text-align:left;color:var(--ink)}
.libbtn{background:var(--card);border-radius:20px;padding:14px 18px}
.shelfrow{background:none;padding:14px 0;border-bottom:1px solid var(--line)}
.card .shelfrow:last-child{border-bottom:none}
.prog{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;max-width:180px}
.prog i{display:block;height:100%;background:var(--sa);border-radius:2px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;color:var(--faint)}
.search input{flex:1;border:none;background:none;height:48px;font:500 16px var(--sans);color:var(--ink);outline:none;min-width:0}
.search input::placeholder{color:var(--hint)}
.search:focus-within{box-shadow:0 0 0 2px var(--sa)}
.tlist{display:flex;flex-direction:column;background:var(--card);border-radius:22px;padding:2px 16px}
.trow{display:flex;align-items:center;gap:14px;width:100%;border:none;background:none;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.trow:last-child{border-bottom:none}
.trow img{width:52px;height:60px;border-radius:26px 26px 10px 10px;object-fit:cover;object-position:center 20%;flex-shrink:0;background:var(--pill)}
.tdone{width:24px;height:24px;border-radius:12px;background:var(--sa);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tquote{margin:6px 0 0;padding:4px 0 4px 16px;border-left:3px solid var(--sa);font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;color:var(--quote)}
.iconbtn.bm{color:var(--faint)} .iconbtn.bm.on{color:var(--sa)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .stat{padding:12px;background:var(--bg2)} .grid3 .stat b{font-size:28px}
.card .grid2 .stat{background:var(--bg2)}
.mnav{width:38px;height:38px} .mnav[disabled]{opacity:.25}
.newcard{display:flex;align-items:center;gap:12px;width:100%;border:none;text-align:left;color:var(--ink);background:linear-gradient(135deg,var(--tint),var(--card))}
.clog{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45;color:var(--ink2)}

.kbloom{position:absolute;left:50%;top:48%;width:420px;height:240px;margin:-120px 0 0 -210px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,196,120,.42),rgba(255,196,120,0));opacity:0;transform:scale(.6);transition:opacity 1.4s ease,transform 1.8s cubic-bezier(.2,.8,.2,1);pointer-events:none}

.kd .flame{transform-box:view-box;transform-origin:40px 53px;transform:scale(0);opacity:0}

.kd .glow{transform-box:view-box;transform-origin:40px 34px;opacity:0}

.kup{position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-left:2px solid rgba(196,85,15,.55);border-top:2px solid rgba(196,85,15,.55);transform:rotate(45deg);animation:kupa 1.8s ease-in-out infinite}

@keyframes kflick{0%{transform:scale(1,1) skewX(0)}35%{transform:scale(.96,1.05) skewX(2.5deg)}70%{transform:scale(1.03,.97) skewX(-2deg)}100%{transform:scale(.98,1.03) skewX(1deg)}}
@keyframes kglow{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.12);opacity:1}}
@keyframes kglow2{0%{transform:scale(1.2);opacity:.9}100%{transform:scale(1.6);opacity:1}}
.kring{position:absolute;left:50%;top:30px;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid rgba(255,180,90,.8);opacity:0;pointer-events:none}
.kd.just .kring{animation:kringa .9s ease-out}
@keyframes kringa{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.2);opacity:0}}
.kspark{position:absolute;left:50%;top:26px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#FFD27A;box-shadow:0 0 6px #FFB347;animation:kspark 1.1s ease-out both;pointer-events:none}
@keyframes kspark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

.kline{transition:opacity .9s,transform .9s}.kline.hide{opacity:0;transform:translateY(8px)}
.ktap{font-size:13px;opacity:.75}
@media (prefers-reduced-motion: reduce){.kd .fl,.kd.on .glow,.kup,.kscene.all .kd .glow{animation:none}}
.into{animation:intoBox .9s cubic-bezier(.5,0,.7,1) both}
