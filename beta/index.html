": ""}, {"t": "Forgiveness is a spiritual treasure.", "by": "Mahant Swami Maharaj", "src": "Dhanurmas message 2025–26 ('Brahmavidya')", "th": "humility", "scan": ""}, {"t": "Ghar sabha brings happiness, peace, rajipo and moksha: all four.", "by": "Mahant Swami Maharaj", "src": "Dhanurmas message 2025–26 ('Brahmavidya')", "th": "satsang", "scan": ""}, {"t": "Looking within is itself satsang.", "by": "Mahant Swami Maharaj", "src": "Dhanurmas message 2025–26 ('Brahmavidya')", "th": "atma", "scan": ""}, {"t": "To overcome faults: mahima.", "by": "Mahant Swami Maharaj", "src": "Dhanurmas message 2025–26 ('Brahmavidya')", "th": "humility", "scan": ""}, {"t": "Making one's nishtha firm is the greatest niyam.", "by": "Mahant Swami Maharaj", "src": "Dhanurmas message 2025–26 ('Brahmavidya')", "th": "faith", "scan": ""}, {"t": "Faith means to diligently abide by the words of God and his Holy Sadhu. If they say it is daytime, then it is and if they say it is nightfall, then it is. Even if one cannot believe this, still to diligently abide by their words is faith. To chant the name of Swaminarayan and recite Swamini Vato whilst walking or sitting in the bus is faith.", "by": "Yogiji Maharaj", "src": "Yogi Vani, p. 102", "th": "faith", "scan": ""}, {"t": "If one stays in the company of Pujya Shri Narayan Swami [Pramukh Swami] and Pujya Shri Mahant Swami – Shri Keshavjivandas, then one has stayed in the company of Maharaj himself.", "by": "Yogiji Maharaj", "src": "Yogi Vani, ch. 45 Glory of Mahant Swami, p. 341 (Mumbai, 1965)", "th": "presence", "scan": ""}, {"t": "Once Mahant Swami stamps your passport [for Akshardham], then nothing can obstruct your path all the way up to Prakruti-Purush. We have attained this special passport already.", "by": "Yogiji Maharaj", "src": "Yogi Vani, ch. 45 Glory of Mahant Swami, p. 341 (London, 1970)", "th": "prapti", "scan": ""}, {"t": "By doing the darshan of Mahant Swami, one experiences tranquillity. His virtues of saintliness and humility attract one and all.", "by": "Pramukh Swami Maharaj", "src": "Quoted in Yogi Vani, ch. 45 Glory of Mahant Swami, p. 341 (Mumbai, 1968)", "th": "presence", "scan": ""}, {"t": "One should think and contemplate on the words of the Satpurush. Now one should remember those flowing words of spiritual knowledge and imbibe them within one's heart.", "by": "Yogiji Maharaj", "src": "Yogi Vani, ch. 45 Glory of Mahant Swami, p. 339", "th": "satsang", "scan": ""}, {"t": "Shriji Maharaj provides for our food, clothing and honour. Maharaj himself has said, 'I will care for those who seek my refuge.'", "by": "Yogiji Maharaj", "src": "Yogi Vani, ch. 36 Happiness and Misery, p. 185", "th": "effort", "scan": ""}, {"t": "We believe that we have love for God, but God and his holy Sadhu have even more love for us.", "by": "Gunatitanand Swami", "src": "Swamini Vato (Grace – Compassion)", "th": "presence", "scan": ""}, {"t": "People do not forget even the little help given to them by others. So, if we have done or do something for God, how can he forget? God is not the type to forget. The grace of God is limitless and compassion everywhere has come from him.", "by": "Gunatitanand Swami", "src": "Swamini Vato (Grace – Compassion)", "th": "gratitude", "scan": ""}, {"t": "Previously, spiritual aspirants sought God and today God searches for the spiritual aspirants.", "by": "Gunatitanand Swami", "src": "Swamini Vato (Grace – Compassion)", "th": "prapti", "scan": ""}, {"t": "God does not look at the faults of the jivas. If a jiva prays to God and says, “I am at fault,” then God forgives him of his faults.", "by": "Gunatitanand Swami", "src": "Swamini Vato (Grace – Compassion)", "th": "humility", "scan": ""}, {"t": "We do not have a desire for God, but God has forced himself on us. Maharaj says, “When a ghost possesses, it does not leave, so why should God leave?”", "by": "Gunatitanand Swami", "src": "Swamini Vato (Grace – Compassion)", "th": "presence", "scan": ""}, {"t": "God is ever ready to protect his devotees. How? Just as eyelids protect the eyes, hands protect the neck, a mother protects her child and a king protects his subjects, God protects us.", "by": "Gunatitanand Swami", "src": "Swamini Vato 1.22", "th": "presence", "scan": ""}, {"t": "The Sadhu has come here from Akshardham. If such glory is understood continuously, one experiences great joy. But this Sadhu is not understood as he is.", "by": "Gunatitanand Swami", "src": "Swamini Vato 1.222", "th": "prapti", "scan": ""}, {"t": "This is an incredible opportunity and we have attained ultimate liberation. Today satsang is in the peak of its youth. We have received the central (soft and juicy) portion of the sugarcane. There is a lot of juice in it and is convenient to eat.", "by": "Gunatitanand Swami", "src": "Swamini Vato 1.163", "th": "prapti", "scan": ""}, {"t": "Pray to God, but do not believe oneself to be sinful and inferior. Since, by thinking like that, the jiva does not remain strong and its strength declines. And we have attained God, so why should we feel fallen? We should feel fulfilled.", "by": "Gunatitanand Swami", "src": "Swamini Vato 1.103", "th": "prapti", "scan": ""}, {"t": "Even by spending tens of millions of rupees, such a sadhu is unattainable. Even by giving tens of millions of rupees, such spiritual talks are unattainable. Even by giving tens of millions of rupees this human body cannot be attained. And we, too, have taken tens of millions of births. But never have we had such company of the God-realized Sadhu. Otherwise why would we have to take birth?", "by": "Gunatitanand Swami", "src": "Swamini Vato 1.19", "th": "prapti", "scan": ""}, {"t": "Do not crave for recognition and respect from others; crave rather for winning grace from Lord.", "by": "Mahant Swami Maharaj", "src": "Handwritten note by Mahant Swami Maharaj ('Million $ advise'), undated", "th": "effort", "scan": "../note-advice.jpg"}, {"t": "Man must be unmade and remade.", "by": "Mahant Swami Maharaj", "src": "Handwritten note by Mahant Swami Maharaj ('Million $ advise'), undated", "th": "humility", "scan": "../note-advice.jpg"}, {"t": "Who should I be? The answer is not about being someone different – it's about letting the REAL YOU out.", "by": "Mahant Swami Maharaj", "src": "Handwritten note by Mahant Swami Maharaj ('Million $ advise'), undated", "th": "atma", "scan": "../note-advice.jpg"}, {"t": "We belong to Swami Bapa. We should become HIS PRIDE.", "by": "Mahant Swami Maharaj", "src": "Handwritten letter by Mahant Swami Maharaj (signed Sadhu Keshavjivandas) to bal-muktos, Sarangpur, 8 October 2015", "th": "presence", "scan": "../letter-bee.jpg"}, {"t": "Pray and put your best efforts.", "by": "Mahant Swami Maharaj", "src": "Handwritten letter by Mahant Swami Maharaj (signed Sadhu Keshavjivandas) to bal-muktos, Sarangpur, 8 October 2015", "th": "effort", "scan": "../letter-bee.jpg"}], "calm": [70, 27, 1, 3, 4, 24, 69], "teachings": [{"title": "Prapti: the train to Delhi", "by": "Mahant Swami Maharaj", "th": "prapti", "parts": ["Mahant Swami Maharaj explains the idea of prapti by saying that it is as big as the Himalayas, while our worldly problems are like small heaps of mud. Our focus should always be on our prapti. Our worldly problems are petty, temporary and limited to this life. On the other hand, realizing prapti results in a permanent relief and liberation from the cycle of births and deaths.", "Mahant Swami Maharaj illustrates this further by saying that suppose you are successfully running a big factory in Ahmedabad. Then, due to a new official regulation your factory operations stall. The matter becomes more complicated, resulting into legal issues with some higher officials in New Delhi.", "Despite your best of efforts in meeting the officials in Delhi, the matter remains unresolved. You return home to Gujarat, desperate to resolve the ongoing heavy losses in capital, production and market share. Now, suddenly out of the blue, you get a call from the authorities in Delhi asking you to urgently meet them the next day at 11 a.m.", "To get there, no air or train reservation ticket is available. But, you manage to get into a train without any reservation for a bunk to sleep or a seat. Consequently, you reach Delhi the next morning, standing all the way. You are extremely tired and exhausted when you reach your meeting place at 11 a.m.", "At 11.15 a.m., your file is cleared by the concerned official, giving you permission to recommence your factory operations. Consequently, you are greatly relieved. In this situation, will you remember or feel the pain and struggle of your train journey?", "The answer is no, because a bigger problem has been solved for which you had been struggling and making efforts for quite some time.", "Then, Swamishri explains that souls have been struggling for countless births to obtain moksha. It is only in this life that we have come in the contact of the Satpurush and satsang to enable us to solve our long struggle to achieve permanent relief and happiness.", "If we keep this in mind, then the problems of this world are trifle, like the difficulties of the train journey to Delhi. This is how Swamishri explains in very simple terms the concept of spiritual prapti in this life and why we should rejoice and always remain joyous."], "take": "The biggest thing is already solved: I have met the Satpurush. Today's struggle is the train journey.", "reflect": "What is my 'train journey' right now?", "src": "Uniqueness of Mahant Swami Maharaj's Speech (Part 1)", "url": "https://www.baps.org/EnlighteningEssays/2024/Uniqueness-of--Mahant-Swami-Maharajs-Speech-(Part-1)-25351.aspx", "scan": "", "mins": 4, "letter": false, "reflects": ["What is my 'train journey' right now?", "If my prapti is the Himalayas, what is today's heap of mud?", "What is one discomfort I can put up with today, knowing where I'm going?", "When did a problem feel huge and then turn out small?", "What does it feel like to know my 'file' has already been cleared?", "Which worry could I set next to my prapti for a moment and compare?", "What would I tell a friend standing all night on their own train?", "What small thing today reminds me that I have met the Satpurush?", "What can I do today that the tired, standing me would be proud of?", "Where have Maharaj & Swami already carried me through something hard?"], "orig": true, "theme": "faith", "needs": ["hope", "strength"], "id": "prapti-the-train-to-delhi", "quote": "", "ch": ""}, {"title": "The bucket and the ocean", "by": "Pramukh Swami Maharaj", "th": "hard times", "parts": ["\"Even great avatars and devotees of the past have gone through pain,\" he explained. \"Even Dada Khachar, who gave everything to Bhagwan Swaminarayan and received his blessings numerous times that 'all will be well', went through failure after failure, downturn after downturn. But they never lost faith. They carried on.", "\"If you carry a bucket of water on your head, how much weight will you experience? It will feel heavy. But if you dive into the ocean and thousands of tons of water pass over your head, do you feel its weight? No. Similarly, do not carry such burden on your head. Leave it to God. Immerse yourself in his devotion. He is the all-doer. You will never feel burdened.\""], "take": "Carried alone, it's a heavy bucket. Given to Maharaj, it's the ocean.", "reflect": "What am I carrying on my head that I can hand over today?", "src": "A Chill Pill for Mental Wellness", "url": "https://www.baps.org/EnlighteningEssays/2025/A-Chill-Pill-for-Mental-Wellness-28009.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["What am I carrying on my head that I can hand over today?", "What would diving into the ocean look like for me this week?", "Which bucket has felt heaviest lately?", "Who is one person who helps me feel lighter?", "What is one thing I keep trying to hold on my own?", "When did I last feel held by something bigger than me?", "Dada Khachar kept going. What is one small way I can keep going today?", "What would change if I trusted that 'all will be well'?", "What could I put down for ten minutes today?", "What has faith carried me through before?"], "orig": true, "theme": "heavy", "needs": ["calm", "story"], "id": "the-bucket-and-the-ocean", "quote": "", "ch": ""}, {"title": "Body and soul", "by": "Mahant Swami Maharaj", "th": "atma", "parts": ["Explaining the concept of body and soul, Mahant Swami Maharaj gives the following analogy. Suppose that someone enacts the role of King Alexander the Great in a drama. To make the character realistic, the actor displays all the characteristics of King Alexander. However, he himself is fully aware that he is just playing a role of Alexander and that he is not the king.", "Similarly, Swamishri says that in reality we are atma. However, as human beings we have to discharge our duties as a father or mother, brother or sister, son or daughter. Like the actor staging the drama knows he isn't Alexander the Great, we must also be very clear that we are atma and different from the body and merely playing a role only.", "We must try to remember this in all stages of our life."], "take": "I am atma, playing a role. The role is not who I am.", "reflect": "Which role feels heavy today? Can I play it while remembering I am atma?", "src": "Uniqueness of Mahant Swami Maharaj's Speech (Part 1)", "url": "https://www.baps.org/EnlighteningEssays/2024/Uniqueness-of--Mahant-Swami-Maharajs-Speech-(Part-1)-25351.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["Which role feels heavy today? Can I play it while remembering I am atma?", "What role am I playing today that isn't the whole of me?", "If today's feeling is a costume, what's underneath it?", "Which part of my day could I act out calmly, like the actor who knows?", "What would the atma in me notice about today?", "Which label have I been wearing too tightly?", "What stays the same in me on good days and hard days?", "Who do I become when I remember I'm not just my thoughts?", "What is one role I'm grateful to be playing right now?", "How can I be kind to the actor, even when the scene is hard?"], "orig": true, "theme": "satsang", "needs": ["learn"], "id": "body-and-soul", "quote": "", "ch": ""}, {"title": "Purpose of human life", "by": "Mahant Swami Maharaj", "th": "purpose", "parts": ["Mahant Swami Maharaj explains that suppose you are a businessman and you are on a business trip to London for a week. During your stay in London, will you take your meals or not? Of course. But did you specifically go to London to take meals? The answer is no. Then, during your stay there for a week, will you sleep or not? Of course, you will. But did you go to London to sleep?", "No. Similarly, as a human we must fulfil our worldly duties and interests of earning a livelihood, family responsibilities, social commitments, recreation, etc. However, these aren't the main reasons for our human birth. The main purpose of attaining moksha for one's soul should never be forgotten."], "take": "Work, family and daily life matter, but they aren't why we are here.", "reflect": "What is one worldly worry today that I can hold a little more lightly?", "src": "Uniqueness of Mahant Swami Maharaj's Speech (Part 1)", "url": "https://www.baps.org/EnlighteningEssays/2024/Uniqueness-of--Mahant-Swami-Maharajs-Speech-(Part-1)-25351.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["What is one worldly worry today that I can hold a little more lightly?", "What did I really come to 'London' for?", "What is one duty today I can do well, without it becoming everything?", "What would a day lived for my real purpose look like?", "Which task has been taking more of my heart than it deserves?", "What is one thing I did today just for satsang?", "If this week were a business trip, what's the real business?", "What can I let be 'just a meal' today, not the whole trip?", "Where did I notice my purpose today, even briefly?", "What would I like my days to be about a year from now?"], "orig": true, "theme": "work", "needs": ["strength"], "id": "purpose-of-human-life", "quote": "", "ch": ""}, {"title": "On anger", "by": "Mahant Swami Maharaj", "th": "anger", "parts": ["Mahant Swami Maharaj explains that people often get angry on someone over small matters. There may be times, depending on the circumstances, when one has to tell someone off. Swamishri says the important thing is how much to tell, how to tell and when to tell. Then, he elaborates it with an example. To heat 100ml of water, would it make sense to burn 1 metric ton of coal?", "Similarly, there are times when too much anger is not warranted. Sometimes, one faces minor issues and so saying a little may suffice. But, at times we get extremely angry, which then spoils the matter further, including our health, peace of mind and spirituality. Thus, Swamishri teaches the need to control one's anger."], "take": "Match the response to the size of the matter: don't burn a ton of coal for 100ml of water.", "reflect": "Is this 100ml or a ton?", "src": "Uniqueness of Mahant Swami Maharaj's Speech (Part 1)", "url": "https://www.baps.org/EnlighteningEssays/2024/Uniqueness-of--Mahant-Swami-Maharajs-Speech-(Part-1)-25351.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["Is this 100ml or a ton?", "What set me off recently, and how much coal did I burn on it?", "What would it look like to say it gently, or later, or not at all?", "What usually sits underneath my irritation: tiredness, worry or hurt?", "Who could I be a little softer with today?", "What helps my temper cool before I speak?", "When did I handle something calmly that I'm proud of?", "What is one small thing I could let pass today?", "How do I want people to feel after I've spoken to them?", "What would Swami say to me after a hard moment?"], "orig": true, "theme": "living", "needs": ["learn"], "id": "on-anger", "quote": "", "ch": ""}, {"title": "On happiness", "by": "Mahant Swami Maharaj", "th": "happiness", "parts": ["Mahant Swami Maharaj explains the concept of happiness by posing a question: If you can sleep peacefully for eight hours on a bed worth ₹5,000, then for how many hours can you sleep on a bed costing ₹50,000? And what if the bed is worth ₹500,000, ₹5,000,000 or ₹50,000,000? Swamishri replies that happiness does not increase in proportion to having greater wealth or more expensive things. Wealth can provide convenience, but not inner peace, which is a totally different domain."], "take": "Comfort is not the same as peace.", "reflect": "What gave me peace today that cost nothing?", "src": "Uniqueness of Mahant Swami Maharaj's Speech (Part 1)", "url": "https://www.baps.org/EnlighteningEssays/2024/Uniqueness-of--Mahant-Swami-Maharajs-Speech-(Part-1)-25351.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["What gave me peace today that cost nothing?", "What is my ₹5,000 bed: something simple that's already enough?", "When did I last feel quietly content?", "What am I chasing that might not add to my peace?", "What small moment today could I slow down and enjoy?", "Who makes me feel at peace just by being around?", "What does inner peace feel like in my body?", "What is one thing I have that I would miss if it were gone?", "Where do I find peace that no shop could sell me?", "What gave me a moment of happiness this week?"], "orig": true, "theme": "heavy", "needs": ["calm", "hope"], "id": "on-happiness", "quote": "", "ch": ""}, {"title": "Body, mind and soul: the three partners", "by": "Mahant Swami Maharaj", "th": "atma", "parts": ["Mahant Swami Maharaj explains the difference between deha (body), man (mind) and atma (soul) in the following way. He says that in business, there is generally a working partner, managing partner and a financing partner. The financing partner is most critical for starting and running the business.", "Similarly, Swamishri compares that in life the body is a working partner, the mind is a managing partner and the atma is a financing partner – the most important player. However, in business the working partner often takes the maximum share of the profit, followed by the managing partner and the financing partner gets the least.", "Similarly, in life, people spend most of their time on their body and mind and very little for their atma. The essence of Mahant Swami Maharaj's analogy is that we should prioritize and focus our efforts and resources in elevating our atma to attain moksha."], "take": "The atma is the partner that matters most, and usually gets the least time.", "reflect": "What is one small thing I can give my atma today?", "src": "Uniqueness of Mahant Swami Maharaj's Speech (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2024/Uniqueness-of--Mahant-Swami-Maharajs-Speech-(Part-2)-25394.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["What is one small thing I can give my atma today?", "Which partner has been doing all the work lately: body, mind or atma?", "What does my body need from me today?", "What has my mind been managing that it could hand to the atma?", "What feeds the financing partner in me?", "What is one habit that looks after all three partners?", "When did my atma feel strongest this month?", "What would a good day for all three partners look like?", "Where have I been running on empty?", "What small act of satsang could top up my atma today?"], "orig": true, "theme": "satsang", "needs": ["learn"], "id": "body-mind-and-soul-the-three-partners", "quote": "", "ch": ""}, {"title": "Traffic jam or swabhav jam?", "by": "Mahant Swami Maharaj", "th": "humility", "parts": ["Mahant Swami Maharaj often speaks about a big traffic congestion which he had once encountered. All the vehicles had come to a standstill. On investigating, it was found that there was a problem between two vehicles on a narrow section of the road, where neither driver was willing to give way to each other.", "Mahant Swami Maharaj explains that it wasn't a traffic jam, but a swabhav (temperament) jam. If one of the drivers had reversed a little, the congestion would have eased totally. However, because of their egos, neither were willing to take a step back. Swamishri emphasizes that in life, too, we face such problems. In most cases they are a result of our swabhavs."], "take": "Reversing a little clears the road.", "reflect": "Where could I take one step back today?", "src": "Uniqueness of Mahant Swami Maharaj's Speech (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2024/Uniqueness-of--Mahant-Swami-Maharajs-Speech-(Part-2)-25394.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["Where could I take one step back today?", "Which 'swabhav jam' have I been stuck in?", "Who could I give way to, just this once?", "What would reversing a little cost me, really?", "When did someone give way for me, and how did it feel?", "Where am I insisting on being right?", "What would humility look like in one conversation today?", "Which disagreement could clear if I moved first?", "What is my swabhav doing when I feel stuck?", "How might things flow if I let one thing go?"], "orig": true, "theme": "living", "needs": ["learn"], "id": "traffic-jam-or-swabhav-jam", "quote": "", "ch": ""}, {"title": "The first rocket", "by": "Pramukh Swami Maharaj", "th": "effort", "parts": ["Abdul Kalam, in his book, Transcendence, describes to Pramukh Swami Maharaj, \"Swamiji, when I first launched a rocket it failed, and I became very depressed and disheartened. At the time I thought of becoming a sannyasi and giving up everything.\"", "Pramukh Swami Maharaj said, \"The Bhagavad Gita defines renunciation in a unique way, 'One must renounce not the performance of deeds, but renounce the desire for the fruits of those actions.'… Human effort and God's grace move this world. Even failure of the first rocket, which you faced, was for your good; it prodded you to make things better.\""], "take": "A setback isn't the end of the story. Effort is mine, grace is His.", "reflect": "What did my last setback teach me?", "src": "Result-Oriented Life and Stress (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2024/Result-Oriented-Life-and-Stress-(Part-2)-27049.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["What did my last setback teach me?", "What is my 'first rocket' right now?", "Where am I attached to the result more than the effort?", "What effort am I proud of, whatever happened after?", "What would I try again if I knew failing was allowed?", "Who could I talk to after a disappointment?", "What is one thing I can do today without judging the outcome?", "When did something that failed lead to something good?", "What would renouncing the result, not the work, look like today?", "What is my next small launch?"], "orig": true, "theme": "work", "needs": ["strength"], "id": "the-first-rocket", "quote": "", "ch": ""}, {"title": "The bumble-bee", "by": "Mahant Swami Maharaj", "th": "effort", "parts": ["Swami-Shreeji\nP.P. Pramukh Swami\nSwami Bapa's most blessed Bal-Muktos\nHeartiest Jai Shree Swaminarayan from Sadhu Keshavjivandas.\nAccording to science, a bumble-bee with its weight and small delicate wings should not fly. But it does. Why? Because it thinks it can. So, you also can do, whatever you desire. So, everybody say, I CAN, I WILL, I MUST (C W M). Many can but they don't will. We belong to Swami Bapa. We should become HIS PRIDE. And, therefore we MUST.", "Swami Bapa's blessings are there to excel in studies. Do the best. Everyone will have grand success in your final exams. Pray and put your best efforts.\nJai Swaminarayan."], "take": "The bumble-bee flies because it thinks it can. I belong to Swami Bapa.", "reflect": "What is one thing today I can say 'I can' to?", "src": "Handwritten letter by Mahant Swami Maharaj (signed Sadhu Keshavjivandas) to bal-muktos, Sarangpur, 8 October 2015", "url": "", "scan": "../letter-bee.jpg", "mins": 2, "letter": true, "reflects": ["What is one thing today I can say 'I can' to?", "Where have I been telling myself I can't?", "What is my 'I will' for this week?", "What would Swami's pride in me look like today?", "When did I surprise myself by doing something hard?", "What is one small 'I must' that would help me?", "What do my wings feel too small for right now?", "Who believes I can, even when I don't?", "What tiny step would prove to me that I can?", "What would I try if I thought like the bumble-bee?"], "orig": true, "theme": "work", "needs": ["strength"], "id": "the-bumble-bee", "quote": "", "ch": ""}, {"title": "I am atma, servant of Purushottam", "by": "Mahant Swami Maharaj", "th": "atma", "parts": ["Discoursing after puja, Swamishri said, “Maharaj manifested on earth to teach us that the body and atma are separate. So do not waste this life and opportunity. We have attained this birth and God’s manifest association. This is a great opportunity, so do not waste it. Believe ‘I am the atma, not the body’ and live accordingly. Strengthen this belief daily. We say ‘Aksharam aham, Purushottam dāsosmi,’ but we must live it day and night – 24 hours. Throughout the day, frequently repeat, ‘I am akshar, but am the servant of Purushottam’. This is the focus of our sadhana.”", "After his puja , Swamishri discoursed, “The body and atma are separate. By assuming yourself to be the body, you experience misery. Believe your true form to be atma and there will be no miseries. So, all the pain everybody experiences is due to body-consciousness. We have attained this satsang, the Satpurush and Bhagwan. But problems remain due to one’s body-centredness. If this is overcome, one will experience unbroken joy. Remaining attached to the body leads to great deficiencies.”", "After puja, Swamishri blessed, “Over countless births, the body and atma have become one. But they are distinct. Understanding this is the goal of satsang. It is not possible to physically separate the two, but it must be done through understanding. With such wisdom, one lives in the body, but knows the atma to be separate.”"], "take": "Much of the heaviness comes from believing I am only the body. I am atma, the servant of Purushottam.", "reflect": "When today feels heavy, what could I say to myself instead of “I am this feeling”?", "src": "BAPS Enlightening Essays: Atmavichar (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2023/Atmavichar-(Part-2)-24131.aspx", "scan": "", "mins": 3, "letter": false, "reflects": ["When today feels heavy, what could I say to myself instead of 'I am this feeling'?", "What does 'Aksharam aham' mean to me today?", "How could I live one hour today as atma, not body?", "What feeling have I mistaken for who I am?", "What is one way to strengthen this belief daily?", "When did I feel like a servant of Purushottam?", "What would I do differently today if I truly believed I am atma?", "Which thought today could I watch pass, rather than become?", "What opportunity have I been given that I don't want to waste?", "What small seva could I offer today?"], "orig": true, "theme": "satsang", "needs": ["learn"], "id": "i-am-atma-servant-of-purushottam", "quote": "", "ch": ""}, {"title": "When you have God, you have everything", "by": "Pramukh Swami Maharaj", "th": "prapti", "parts": ["In 1988, Pramukh Swami Maharaj was in Los Angeles. An American by the name of Carlos Vegas met Swamishri. He was depressed so he asked for Swamishri’s prayer and blessings. He said, “I have everything in life. I have a nice big house and a car. I have a wife and kids. I have money…”", "Swamishri stopped him, “Listen, I don’t have money. But I have God. When you have God, you have everything.”"], "take": "Whatever I lack right now, I have God. That is everything.", "reflect": "What do I already have today that no one can take away?", "src": "BAPS Enlightening Essays: Zigzagging (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2026/Zigzagging-(Part-2)-31872.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["What do I already have today that no one can take away?", "If I have God, what am I still searching for?", "What would change if I felt I had everything?", "When did I feel rich without anything new?", "What does 'having God' feel like on an ordinary day?", "Who in my life reminds me of what really matters?", "What is one thing I own that I could stop worrying about?", "How could I remind myself of this on a low day?", "What have I received through satsang that I'm grateful for?", "Where did I feel God close this week?"], "orig": true, "theme": "faith", "needs": ["hope", "strength"], "id": "when-you-have-god-you-have-everything", "quote": "", "ch": ""}, {"title": "The biggest prize", "by": "Pramukh Swami Maharaj", "th": "prapti", "parts": ["Once, Swamishri was in Birmingham. While on the way to his residence, someone said, “It is Dr Swami’s wish that you be awarded with the Nobel Peace Prize. The award-giving ceremony takes place in Stockholm, Sweden. This award should be given to you in the presence of sadhus and thousands of devotees.”", "Swamishri immediately responded, “For us, the biggest prize is having met Shastriji Maharaj and Yogiji Maharaj. Everything is included in them. They are the topmost of the top. (Nobel na pan Nobel chhe). That Maharaj and Swami are happy and Shastriji Maharaj and Yogiji Maharaj have blessed us is the greatest of all prizes.”", "Aksharjivandas Swami, one of the swamis who was on that vicharan tour, politely asked Swamishri, “Can you please write a few words of blessings in my notebook? It will be a memory that I can treasure.”", "Swamishri took the notebook and put it aside. Then, he said, “Listen, I have never felt like asking Shastriji Maharaj or Yogiji Maharaj for their blessings in writing. Nor have I ever longed for some relic of theirs, such as a rosary, a fingernail, a strand of hair, or a piece of cloth. I have never desired for such mementos. However, I have focused on one thing: to follow their commands no matter what. I have done that right from the beginning, ever since I came into Satsang. Today, I feel fulfilled having followed their every wish and every word. That has been the goal of my life. As a result, I constantly feel their rajipo. Shastriji Maharaj and Yogiji Maharaj are always with me.”"], "take": "Having met the guru is the greatest prize. Following his words keeps him with me.", "reflect": "Which one of Swami’s words can I follow today, in a small way?", "src": "BAPS Enlightening Essays: Zigzagging (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2026/Zigzagging-(Part-2)-31872.aspx", "scan": "", "mins": 3, "letter": false, "reflects": ["Which one of Swami's words can I follow today, in a small way?", "What is my biggest prize?", "When did meeting the Satpurush change something for me?", "What praise or recognition have I been waiting for?", "What would it feel like to already have the biggest prize?", "Which agna feels easiest to follow today?", "What memory of darshan do I treasure most?", "What would I tell someone about what I've received?", "What small way can I please Swami today?", "What matters more to me than any award?"], "orig": true, "theme": "faith", "needs": ["hope", "strength"], "id": "the-biggest-prize", "quote": "", "ch": ""}, {"title": "With you forever", "by": "BAPS essay · Satsang Diksha", "th": "hard times", "parts": ["At some points in our lives we go through some form of stress, and during those times it feels like we’re being hemmed in by it. It’s as if we can only be at peace if the source of stress vanishes. When one searches for any remedies to stress or anxiety, some of them may work, but they do not provide a long-term fix. For example, say your personal treatment for stress is spending time with friends and family. What if something changed in the dynamics of your friends or family; this meant you couldn’t spend as much time with them as you would like. We have all heard the popular saying, “Friends come and go, but family is with you forever.” This can be extended to include a third dimension: Friends may come and go; family may also come and go, but Shriji Maharaj and the Satpurush are with you forever.", "In the Satsang Diksha, Mahant Swami Maharaj writes, “Bhagwan je kare te sadāy sārā māte hoy. Temni ichchhā e ja māru prārabdha chhe. Teo ja mārā tārak chhe.” This translates to, “Whatever Bhagwan does is always beneficial. His wish alone is my prarabdha. He alone is my liberator.” Although success in our world is important, it should not override our aim to achieve moksha. Bhagwan will do what he wills. Our priority should be to attain moksha and when we physically depart from this earth our atmas enter Akshardham. With this thought, stress won’t enter our minds and through this mindset, our lives will become much happier.", "Rather than thinking that we have got this human body to get a good job and earn lots of money, we should think that we are primarily here to attain Akshardham and not materialistic things. You have probably read that line or something very similar a thousand times and are probably thinking to yourself, “I get it!” True, it is easier said than done, so why not start to think like this in small steps. Any time we get stressed or nervous or overwhelmed, we should think to ourselves, “I am atma and not the body.” The main purpose of our life is to follow niyams and attain moksha. Essentially, detach yourself from worldly activities and attach yourself to Bhagwan. Keep your worldly life modest and your satsang above all else. Strive to earn a successful living but whenever you feel life is too much, don’t become absorbed in that journey, but rather become absorbed in your efforts to attain Akshardham. By doing this and changing your mindset, stress will slowly disintegrate."], "take": "People and plans change. Shriji Maharaj and the Satpurush stay with me forever.", "reflect": "What is one thing I am worrying about that I could hand over today?", "src": "BAPS Enlightening Essays: Stress and Moksha", "url": "https://www.baps.org/EnlighteningEssays/2023/Stress-and-Moksha-23438.aspx", "scan": "", "mins": 4, "letter": false, "reflects": ["What is one thing I am worrying about that I could hand over today?", "What has helped my stress before, and what didn't last?", "What never changes, even when everything else does?", "Where do I look for peace when life feels hemmed in?", "Who is with me in this, even when I feel alone?", "What would it be like to trust I'm held forever?", "What stress have I been trying to fix alone?", "What gives me a peace that doesn't depend on circumstances?", "What could I say in prayer today, in my own words?", "When did I feel Maharaj & Swami with me in a hard moment?"], "orig": true, "theme": "heavy", "needs": ["calm", "hope"], "id": "with-you-forever", "quote": "", "ch": ""}, {"title": "Flexibility is the key to stability", "by": "Pramukh Swami Maharaj", "th": "effort", "parts": ["Once, Pramukh Swami Maharaj was in Bochasan, Gujarat. A young devotee had just bought a new set of Flexon eyeglasses. He explained, “Swamishri, these glasses cost 18,000 rupees. They are more durable and resistant than conventional metals, allowing them to be flexed, bent, or twisted and still they return to their original shape.” He then took off his glasses and bent the frame, but it did not break. Swamishri smiled and said, “If we are flexible in life, we can adjust to any situation. Accordingly, we become stable, and our value increases.” Flexibility is the key to stability. Problems, difficulties and hardships disappear when we are willing to become flexible.", "Following his 59th birthday celebration in 1979, Rajkot, Swamishri was visiting the homes of well-wishers and devotees in the city. Suddenly, his car ran out of fuel and came to a halt. The driver requested Swamishri to remain seated in the car while he looked for a petrol station. But Swamishri told him, “If we wait around, we’ll be late for the next town which is at least two hours’ drive from here.” He got out of the car in an instant and took a three-wheeler public rickshaw to continue with the rest of the home visits. It was nothing new for him to travel that way, because earlier in his life there were no special travel arrangements for him. Sometimes, he travelled in a bullock cart or in a wagon attached to a tractor. But his main mode of transport was either a State Transport bus or a third-class compartment on a local train. Even as the President of BAPS, no special provisions or privileges were ever afforded to him. Often, he slept on wooden benches or under a neem tree. Sometimes, he even slept on a heap of sand. He had no specific office or workplace; wherever he worked became his workplace. Amazingly, Swamishri never complained about anything or made a fuss. For him, serving humanity was of paramount importance, with or without special arrangements."], "take": "Bending with a situation is not breaking. It is how I stay steady.", "reflect": "Where could I bend a little today instead of pushing?", "src": "BAPS Enlightening Essays: Flexibility – The Key to Stability", "url": "https://www.baps.org/EnlighteningEssays/2025/Flexibility---The-Key-to-Stability-29820.aspx", "scan": "", "mins": 4, "letter": false, "reflects": ["Where could I bend a little today instead of pushing?", "What situation would go better if I were more flexible?", "Where have I been rigid because I'm scared?", "When did bending help me stay steady?", "Whose way of doing things could I accept today?", "What plan could I loosen without losing myself?", "What does 'returning to my shape' look like after a hard day?", "What is one thing I could say yes to that I'd usually resist?", "How could I be firm in values but soft in approach?", "Where do I break when I don't bend?"], "orig": true, "theme": "work", "needs": ["strength"], "id": "flexibility-is-the-key-to-stability", "quote": "", "ch": ""}, {"title": "No shoes, no feet", "by": "Pramukh Swami Maharaj", "th": "gratitude", "parts": ["Pramukh Swami Maharaj gave a wonderful illustration in his discourses about why we should never compare ourselves with others when it comes to material possessions. A poor boy was begging on the streets of a busy city. He dreamt of wearing a nice pair of shoes and thought to himself that one day he would have enough money to buy a pair. Once, as he was looking at everyone’s shoes, he saw a big car pull over on the other side of the road. The driver stepped down and got a wheelchair out from the back. Next, he opened the back seat door and helped a man on to the wheelchair. The boy’s eyes were fixed on the nicely dressed man seated in the wheelchair. But he noticed that the man had no feet. He only had legs that were cut off from the knee down. The little boy thought to himself, “I was sad because I had no shoes until I saw a man who had no feet.”", "It dawned upon the boy that happiness or sadness is not a matter of worldly possessions or good fortune. It is a matter of attitude. One can be fully satisfied and happy sleeping under a tree but miserable and stressed out in an air-conditioned room. It is all in the mind."], "take": "Comparing steals my peace. Contentment is an attitude I can practise.", "reflect": "Who have I been comparing myself to lately, and what do I have that I overlooked?", "src": "BAPS Enlightening Essays: Zigzagging (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2026/Zigzagging-(Part-2)-31872.aspx", "scan": "", "mins": 3, "letter": false, "reflects": ["Who have I been comparing myself to lately, and what do I have that I overlooked?", "What are my 'feet' today, the things I forget to be thankful for?", "What is one thing about me I'd never trade?", "When does comparing make me feel smaller?", "What would I notice if I looked at my own life like a visitor?", "Who has less than me and still finds joy?", "What three ordinary things am I grateful for today?", "What did I overlook this week that was quietly good?", "How could I stop one comparison today?", "What does 'enough' look like for me right now?"], "orig": true, "theme": "living", "needs": ["learn"], "id": "no-shoes-no-feet", "quote": "", "ch": ""}, {"title": "Questions for Pramukh Swami Maharaj", "by": "Pramukh Swami Maharaj", "th": "hard times", "parts": ["Q: What should we do when we face insurmountable miseries and difficulties in life?\nSwamishri: Associating with the Gunatit Sant will give you peace. He will help you to overcome them.", "Q. The Satpurush is omniscient (antaryami). So why is it necessary to confess one’s mistakes to him?\nSwamishri: The Satpurush is all-knowing, but Shastriji Maharaj and Yogiji Maharaj used to say, “Tell the antaryami seven times.” We know him as omniscient, but a barrier remains. By confessing, that barrier is removed and one experiences inner peace and joy.", "Q. When someone lapses in observing the five vartmans, what can we do to avoid taking abhav-avgun? Do satsangis have a responsibility in that?\nSwamishri: Do not harass one who lapses in observing the five vartmans. If one has a rapport with them then one can tell them, otherwise do not keep their company. Do not spread any talks about their misdeeds. Bhagwan will give them the appropriate fruits of their actions. We are not responsible for them. Everybody is liable to make mistakes.\nWe are here [in satsang] to become pure. If you focus on this, there will be no problems.", "Q: What is the future like for this world?\nPSM: It is in the hands of God. The future depends on our faith in God. There will always be ups and downs. But God showers compassion on humans and will continue to do so."], "take": "Ups and downs will come. The Gunatit Sant helps me through them, and opening my heart brings peace.", "reflect": "Is there something I have been holding inside that I could share with someone I trust?", "src": "BAPS Enlightening Essays: Question Time with Pramukh Swami Maharaj (Parts 1, 2 and 4)", "url": "https://www.baps.org/EnlighteningEssays/2025/Question-Time-with-Pramukh-Swami-Maharaj-(Part-1)-28841.aspx", "scan": "", "mins": 3, "letter": false, "reflects": ["Is there something I have been holding inside that I could share with someone I trust?", "What would I ask Swami if I could ask one question?", "What difficulty feels too big to face alone right now?", "Who is one person I could open up to this week?", "What would it feel like to say it out loud, even once?", "What have I been afraid to admit, even to myself?", "Where have I found peace in the company of the Sant?", "What small question about my life am I sitting with?", "What helps me feel safe to share?", "What could I write down today that I've been keeping in?"], "orig": true, "theme": "heavy", "needs": ["calm", "hope"], "id": "questions-for-pramukh-swami-maharaj", "quote": "", "ch": ""}, {"title": "With Bapa’s strength", "by": "Pramukh Swami Maharaj", "th": "hard times", "parts": ["Pramukh Swami Maharaj read and replied to over 700,000 letters, devoting an average of two hours a day to counsel and console through his pen. And this he accomplished in the midst of constant travelling, attending assemblies, meeting devotees, attending administrative meetings and all his other activities.", "In 1977, Swamishri wrote a letter from abroad during his hectic Satsang tour which sums up the situation nicely: “There is no end to our travelling and no end to the mail I have to deal with at all times in the car, when sitting or even in bed. Only then am I able to manage. But with (Yogi) Bapa’s strength, I am able to cope.”", "Once, C.M. Patel of London gave a friendly comment to Swamishri in Bhadra, “Bapa! You keep writing letters all day. These sadhus don’t let you stay free for even one minute!”\nSwamishri spoke, “This is our service to Maharaj.”", "Today, Mahant Swami Maharaj remains equipoised and absorbed in divinity in all his daily activities. He gives his fullest attention to whatever he does: morning puja, Thakorji’s darshan, meeting the devotees and attending to letters. Thus, by having his darshan one becomes destressed and experiences inner tranquility."], "take": "I don’t have to cope on my own strength. I can cope with Bapa’s strength.", "reflect": "What is one thing today I can do “with Bapa’s strength” rather than my own?", "src": "BAPS Enlightening Essays: Burnout: Causes, Consequences and Coping (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2018/Burnout-Causes-Consequences-and-Coping-(Part-2)-13575.aspx", "scan": "", "mins": 3, "letter": false, "reflects": ["What is one thing today I can do 'with Bapa's strength' rather than my own?", "Where have I been relying only on myself?", "What would I attempt if I felt his strength behind me?", "When did I get through more than I thought I could?", "Which task today could I begin with a prayer?", "What would Bapa write to me in a letter today?", "Where could I lean on someone else's strength this week?", "What small thing can I do tiredly, but faithfully?", "How does it feel to know he never stopped for himself?", "What is one burden I could share with Bapa today?"], "orig": true, "theme": "heavy", "needs": ["calm", "hope"], "id": "with-bapa-s-strength", "quote": "", "ch": ""}, {"title": "Not an iota of difference", "by": "Pramukh Swami Maharaj", "th": "presence", "parts": ["In 1988, devotees had taken Pramukh Swami Maharaj on a day trip to the Catalina Islands, off the coast of California. On the boat ride back, the swamis were singing godi and were enthralled by Swamishri’s swaying to the rhythm. C.M. Kaka, a senior devotee of London, noticed this and tapped Swamishri on the shoulder to enquire, “Swami, what are these swamis staring at?”", "Gently, Swamishri leaned over and replied, “They are experiencing the happiness of Akshardham from me.”\n“But Swami, I can’t experience it,” C.M. Kaka admitted.\nSwamishri unhesitatingly remarked, “C.M., in the murti that resides in Akshardham, and the murti seated before you now – there is not an iota of difference; they are the same.”", "Overjoyed by Swamishri’s unprompted revelation, C.M. Kaka, too, became engrossed in the divinity."], "take": "The darshan I have of the guru is darshan of God himself.", "reflect": "Which darshan of Swami do I want to hold on to today?", "src": "BAPS Enlightening Essays: Satpurush: The Bridge with God", "url": "https://www.baps.org/EnlighteningEssays/2022/Satpurush-The-Bridge-with-God-21617.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["Which darshan of Swami do I want to hold on to today?", "When did I feel the happiness of his presence?", "What does 'not an iota of difference' mean to me?", "Where could I look for him in my day today?", "Which murti or moment brings me closest?", "What would change if I felt him beside me all day?", "What memory of Swami makes me smile?", "How could I carry his presence into an ordinary task?", "Who else do I see him in?", "What would I want to show him from my day?"], "orig": true, "theme": "faith", "needs": ["hope", "strength"], "id": "not-an-iota-of-difference", "quote": "", "ch": ""}, {"title": "His wish prevails", "by": "Pramukh Swami Maharaj", "th": "faith", "parts": ["In 1974, Swamishri and his sadhus were given a grand farewell in Mumbai before they departed by flight to Nairobi. However, on landing at the airport in Nairobi they were ordered to return to Mumbai. The sadhus asked Swamishri, “Why has this happened?” He replied, “We have done no wrong. We do things to please Maharaj. So, his wish prevails.” It is clear from his answer how much at ease he was. A similar incident happened: the planning permission for a mandir in Harrow, London, was refused. The youths and devotees had tried very hard. The youths were confidently saying that they would get permission to construct the mandir, but they lost the case. Subsequently, everyone was disappointed. But that night Swamishri slept soundly. It was evident from this that he had no desire other than to please Maharaj and Swami. No pillow is as soft as a clear conscience. He had a pure heart."], "take": "When things don’t go to plan, I can still rest. I did my part; his wish prevails.", "reflect": "What didn’t go to plan recently that I can let rest in his hands?", "src": "BAPS Enlightening Essays: Peace at the Lotus Feet of Narayan (Part 2)", "url": "https://www.baps.org/EnlighteningEssays/2020/Peace-at-the-Lotus-Feet-of-Narayan-(Part-2)-19409.aspx", "scan": "", "mins": 2, "letter": false, "reflects": ["What didn't go to plan recently that I can let rest in his hands?", "What would 'his wish prevails' mean for my situation right now?", "Where am I fighting what has already happened?", "When did a disappointment turn out for the best?", "What can I still do well, even if the outcome isn't mine?", "What would it feel like to be at ease, like Swamishri at the airport?", "What plan could I hold more loosely this week?", "Where do I need patience rather than answers?", "What would I say to myself if things go differently tomorrow?", "What am I trying to control that I could offer to him?"], "orig": true, "theme": "faith", "needs": ["hope", "strength"], "id": "his-wish-prevails", "quote": "", "ch": ""}, {"title": "The boy who found his own classmates", "by": "Pramukh Swami Maharaj", "theme": "work", "needs": ["story", "strength"], "parts": ["As a boy in Chansad, Shantilal (the future Pramukh Swami Maharaj) hit a wall. The village school stopped at the fifth standard, and no higher class could start without enough pupils. A teacher in nearby Darapara agreed to begin a class if ten students enrolled, so Shantilal went from village to village looking for them. He found about a dozen. Even then, the teacher lost interest and the class never began.", "He spent that year at home, reading, going to the mandir and doing odd jobs, his wish to study as strong as ever. A school in Bochasan offered him a place, but only if he repeated two years he had already passed, so another year slipped by. At last he enrolled at the English school in Padra, six kilometres away. Two friends gave him lifts on their bicycles, and when he felt he was imposing, he simply walked.", "Nothing about this was dramatic. It was a quiet young person being turned down, waiting, trying another door, and accepting help where it was offered. The setbacks did not tell him who he was. They were simply the road he happened to be on, and he kept putting one foot in front of the other until a way opened."], "quote": "His desire to study remained intense. He would not accept defeat.", "src": "In the Joy of Others", "ch": "Ch. 1, \"Birth\", pp. 6-7", "url": "", "take": "Pick one door to knock on today, even a small one, and knock once.", "reflects": ["Which 'no' from the past year still stings the most?", "What did Shantilal do after each setback that you could borrow?", "Who has offered you a lift recently, in any sense of the word?", "Is there help you have been too embarrassed to accept?", "What is one small door you could try this week?", "How do you usually talk to yourself after a rejection?", "How could you fill a waiting period with small, useful things?", "When have you kept going longer than you expected to?", "What does 'not accepting defeat' look like on a low-energy day?", "Who could walk part of this road with you?"], "mins": 3, "id": "the-boy-who-found-his-own-classmates", "reflect": "Which 'no' from the past year still stings the most?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "And so things rolled on", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "hope"], "parts": ["As a teenager, Shantilal was so quiet that when people spoke to him he often only managed a murmur in reply. Serving senior sadhus one holiday, he could not work out how to draw water from a well with a canvas bucket, and Ghanshyam Swami despaired of him. Another time he was sent to buy grapes for a herbal remedy and came back with fresh green ones instead of the dried black ones needed, and was scolded.", "Balmukund Swami took him under his wing. Years later Pramukh Swami Maharaj remembered how that sadhu patiently showed him, again and again, how to wash dhotis (the plain cloth sadhus wear), scrub pots, cook and sing bhajans (devotional songs). Looking back on those awkward years, he never claimed to have been gifted. He said simply that his guru's blessings were with him, and so life carried on.", "Decades later, when a devotee in Canada praised his skill as a manager, he answered in almost the same way: it was all Shastriji Maharaj's grace and Yogiji Maharaj's inspiration, and so things rolled on. The boy who could not manage a bucket went on to guide thousands. Being slow to learn, or unsure of yourself, is not the end of the story."], "quote": "But Swami’s [Shastriji Maharaj’s] blessings were with me, and so things rolled on.", "src": "In the Joy of Others", "ch": "Ch. 1, \"Birth\", pp. 8-9; Ch. 6, \"Guru Bhakti\", p. 77", "url": "", "take": "When something new feels clumsy, whisper 'and so things roll on' and try once more.", "reflects": ["What are you learning at the moment that feels clumsy?", "Who has been a patient teacher to you, like Balmukund Swami?", "How do you feel when someone corrects you?", "What is something you once found hard that is easy now?", "Which of your quieter qualities might actually be strengths?", "Where could you ask someone to show you, rather than struggle alone?", "Whose support has carried you further than your own ability?", "How could you be as patient with yourself as Balmukund Swami was with Shantilal?", "What small mistake from this week can you smile gently about?", "What might 'letting things roll on' mean for you today?"], "mins": 2, "id": "and-so-things-rolled-on", "reflect": "What are you learning at the moment that feels clumsy?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "A fever and a promise", "by": "Shastriji Maharaj", "theme": "heavy", "needs": ["calm", "story"], "parts": ["Soon after leaving home to become a sadhu, Shantilal longed to see his guru, Shastriji Maharaj. Instead, the sadhu he was travelling with kept changing plans, and a journey of a few hours stretched into days. In Nadiad he came down with a fever. The others went out early each morning and came back late, so he lay alone on a makeshift bed for most of the day, weak and waiting.", "When he finally reached Ahmedabad, still feverish, he was put to bed in a corner. Shastriji Maharaj came straight to him and said warmly that he was glad he had arrived at last. Shantilal could only manage to say that he had been unwell for a few days. His guru stroked his head and told him to rest. That night he returned, softly chanting 'Swaminarayan' and assuring him all would be well.", "The fever broke that night. The next morning Shastriji Maharaj initiated him as a parshad, the first step towards becoming a sadhu. The lonely days in Nadiad had not been wasted. They ended beside someone who had been expecting him all along. When you feel alone and unwell, you are still being held, and still expected."], "quote": "You’ll be OK. There’ll be no problems.", "src": "In the Joy of Others", "ch": "Ch. 2, \"Diksha\", pp. 16-17", "url": "", "take": "Tonight, lie down and say 'Swaminarayan' slowly a few times, as if someone is sitting beside you.", "reflects": ["When did you last feel alone while unwell or low?", "Who has made you feel expected, the way Shastriji Maharaj did?", "What words would you most like to hear on a hard night?", "How do you steady yourself when plans keep changing?", "What helps you rest when your mind will not settle?", "Can you remember a difficult stretch that ended better than you feared?", "Who could you tell honestly how you are feeling this week?", "What is it like to imagine being told 'You'll be OK'?", "How might you reassure someone else this week?", "What are you waiting for with hope right now?"], "mins": 2, "id": "a-fever-and-a-promise", "reflect": "When did you last feel alone while unwell or low?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Saying what is on your heart", "by": "Shastriji Maharaj", "theme": "living", "needs": ["learn", "story"], "parts": ["Before he left home, Shantilal had been told he could study English. After his first initiation, Shastriji Maharaj suggested that Sanskrit would serve a sadhu better, since it would let him read the scriptures. Shantilal had already resolved to follow his guru's wishes. Even so, he told Shastriji Maharaj honestly that he had hoped to learn English. The book notes that this kind of open confession was something his guru welcomed.", "Shastriji Maharaj did not simply give an order. He waited, and asked Harijivan Swami, a sadhu Shantilal was close to, to talk it over with him. One night in Gondal the two sat outside and talked until after half past one in the morning. At last Shantilal said he would study as his guru wished. Harijivan Swami woke Shastriji Maharaj with the news, and he was so delighted that he hugged Shantilal at once.", "There is a quiet lesson here. Having hopes of your own is not disloyal, and saying them out loud is not a failing. A wise guide wants to know what is really in your heart. Good decisions are often reached slowly, in an unhurried conversation with someone who cares about you."], "quote": "It was a confession of sorts, and one that Shastriji Maharaj encouraged.", "src": "In the Joy of Others", "ch": "Ch. 2, \"Diksha\", pp. 17-19", "url": "", "take": "Tell one person you trust about a hope you have kept to yourself.", "reflects": ["Is there a hope you have not said out loud to anyone?", "Who encourages you to be honest about what you want?", "How do you feel when your plans and someone else's wishes pull different ways?", "What helps you talk something through rather than decide alone?", "When has a long conversation changed your mind for the better?", "What would you like to say to Maharaj in your prayers tonight?", "Why do you think Shastriji Maharaj chose not to simply command?", "What decision are you carrying that could use a second opinion?", "How could you listen to someone else's hopes this week?", "What would it feel like to be hugged after finally saying yes?"], "mins": 2, "id": "saying-what-is-on-your-heart", "reflect": "Is there a hope you have not said out loud to anyone?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The President washed the plates", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "learn"], "parts": ["In 1950 Shastriji Maharaj announced that the young sadhu Narayanswarupdas, still in his twenties, would become Pramukh (President) of BAPS. Some senior devotees worried he was too junior. Shastriji Maharaj replied that he had never regretted a decision, and that while they looked at the young man's body, he was looking at his soul. Narayanswarupdas himself felt others were better suited, and accepted only because he saw it was his guru's deepest wish.", "The ceremony was held in a small, crowded room in Ahmedabad. Seated on a cot beside Shastriji Maharaj and Yogiji Maharaj, he felt embarrassed by the honour. When asked to speak, his words came out haltingly; he was never known as a speaker. Afterwards a meal was served to everyone. He wandered out into the yard, found a heap of dirty plates and pots under a tap, and sat down to wash them.", "Pramukh Swami Maharaj never let a title change who he was. Being chosen did not make him feel above the smallest job, and feeling unready did not stop him saying yes. If you ever feel like an impostor in a new role, remember that the one who washed the plates was exactly the right person for it."], "quote": "The President sat down to wash them.", "src": "In the Joy of Others", "ch": "Ch. 3, \"Put My Mind at Peace\", pp. 27-34", "url": "", "take": "Do one small, unseen job today without mentioning it to anyone.", "reflects": ["When have you felt not ready for something you were asked to do?", "What do you think Shastriji Maharaj saw that others missed?", "Which small, unglamorous tasks do you quietly enjoy?", "How would you like to carry yourself in a new job?", "What helps you say yes when you feel unsure?", "Who sees your soul, not just your circumstances?", "How do you handle feeling embarrassed in front of others?", "What would staying humble after good news look like for you?", "Which part of this story surprised you most?", "What unseen seva (service) could you offer at home this week?"], "mins": 3, "id": "the-president-washed-the-plates", "reflect": "When have you felt not ready for something you were asked to do?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "You serve me, so I serve you", "by": "Pramukh Swami Maharaj", "theme": "bhakti", "needs": ["story"], "parts": ["Pragat Bhagat was one of Pramukh Swami Maharaj's personal attendants. One morning, although a cut on his finger had become badly infected, he still went to fetch a pail of hot water for Swamishri's bath (Swamishri is the respectful name devotees use for him). In his hurry, he left his own unwashed dhoti, the plain cloth worn by sadhus and attendants, lying in the bathroom.", "When he came back he was dismayed to find that Pramukh Swami Maharaj had washed and wrung out the dhoti for him. All Pragat Bhagat could do was ask why. The reply was simple and warm: since Pragat Bhagat served him in so many ways, he should serve Pragat Bhagat too. Many years later, the attendant still remembered that morning.", "In the same chapter, Swamishri is found quietly cleaning the sadhus' toilets after a festival while others rested, and he cheerfully told the sadhu who tried to stop him to go and fetch water instead. For him, seva (selfless service) never flowed only upwards to the guru. It flowed back down too, to whoever was tired, hurt or overlooked."], "quote": "You serve me in so many ways so I should also serve you", "src": "In the Joy of Others", "ch": "Ch. 3, \"Put My Mind at Peace\", p. 36; Ch. 9, \"Panch Vartman\", p. 169", "url": "", "take": "Do one kind thing today for someone who usually looks after you.", "reflects": ["Who looks after you without being asked?", "How could you serve them back this week?", "Is it easier for you to give care or to receive it?", "What small task could you take off someone's hands today?", "How do you think Pragat Bhagat felt when he saw the washed dhoti?", "When has someone surprised you with kindness?", "What does seva mean to you in daily life at home?", "Who in your family is often tired or overlooked?", "How can you notice what others need without being told?", "What would change if kindness flowed both ways in all your relationships?"], "mins": 2, "id": "you-serve-me-so-i-serve-you", "reflect": "Who looks after you without being asked?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Thanking the man who hated sadhus", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["story", "learn"], "parts": ["In the village of Sokhda, a devotee named Purushottamdas wanted to host Yogiji Maharaj. The village chief, Jashbhai, despised sadhus. After days of pleading he grudgingly lent his house, the best in the village, but said he would stay elsewhere, would not come for darshan (a respectful audience with a holy person), and expected tobacco stains to be scrubbed off his walls. Purushottamdas tried to explain that these sadhus used no tobacco at all.", "Yogiji Maharaj was unwell and sent Pramukh Swami Maharaj in his place. After two days, as he was about to leave, Swamishri asked whose house it was and wanted the owner called. Purushottamdas warned that Jashbhai hated sadhus and would only insult him by staying away. Swamishri gently pointed out that since they had stayed in the man's house, surely they owed him their thanks.", "Jashbhai arrived fuming, with a few friends. On seeing Swamishri he fell at his feet and begged him to stay two more days, and Swamishri unpacked. Jashbhai's life changed: he began daily puja (personal worship) and later served in the mandir for the rest of his life. It all began with a simple thank you to someone who had not been kind."], "quote": "Since we have stayed in his house, don’t we have to thank him?", "src": "In the Joy of Others", "ch": "Ch. 3, \"Put My Mind at Peace\", pp. 37-38", "url": "", "take": "Send a short thank-you message today to someone you would not normally thank.", "reflects": ["Who has helped you, even reluctantly, that you have not thanked?", "How do you usually respond to people who judge you unfairly?", "Why do you think Swamishri insisted on meeting Jashbhai?", "What might gratitude soften in a difficult relationship of yours?", "When has a small courtesy changed how someone saw you?", "What are three things you are grateful for today?", "Is there someone you have written off too quickly?", "How does it feel when someone thanks you unexpectedly?", "What sometimes stops you from saying thank you?", "Who could you thank after an interview or meeting this week?"], "mins": 2, "id": "thanking-the-man-who-hated-sadhus", "reflect": "Who has helped you, even reluctantly, that you have not thanked?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Please help me further", "by": "Pramukh Swami Maharaj", "theme": "work", "needs": ["story", "strength"], "parts": ["When Yogiji Maharaj passed away in 1971, the sadhus closest to him were heartbroken. In the quiet days that followed in Gondal, Pramukh Swami Maharaj sat with a few of them on the cement seat around a tree. The talk was brief and hushed. Then, unexpectedly, he said that Yogiji Maharaj had given them all the responsibility of serving Satsang, the spiritual fellowship, and asked them to keep helping him as they always had.", "He spoke to them as equals, calling them his godbrothers, fellow disciples of the same guru. The sadhus were taken aback. To them he was already their guru, and they told him so, asking him to care for them and forgive their weaknesses as Yogiji Maharaj had done. He made no claim to authority at all. He simply asked for help, and said they would have to work together.", "Mahant Swami later admitted that when Yogiji Maharaj left, he felt everything was over. Yet before he knew it, he found himself deeply bound to Pramukh Swami Maharaj. Asking for help did not make the new leader smaller; it drew people closer. Beginning something new, whether a role or a search, is lighter when you let others carry some of it with you."], "quote": "We will all have to get together and work.", "src": "In the Joy of Others", "ch": "Ch. 4, \"Yogiji Maharaj Has Not Left Us\", pp. 46-47", "url": "", "take": "Ask one person for one specific piece of help with your job search this week.", "reflects": ["What are you trying to carry alone at the moment?", "Who could you ask for help, and with what exactly?", "How do you feel about asking for help?", "What do you notice about the way Swamishri asked?", "When has someone asking for your help made you feel valued?", "Who are the fellow travellers in your life right now?", "What would working together look like for one of your goals?", "How could you let someone share your search without feeling a burden?", "When has a loss eventually led you somewhere good?", "What message could you send today to ask for support?"], "mins": 2, "id": "please-help-me-further", "reflect": "What are you trying to carry alone at the moment?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The water did not reach them", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "hope"], "parts": ["As a child in Chansad, Shantilal listened to the village priest describe the holy men of the Himalayas, and dreamed of living in Haridwar. Life took a different path, and he accepted it as God's wish. In 1987, aged 67, he finally walked the ghats (riverside steps) of Haridwar with a pilgrimage group of 450, feeling like that young aspirant again. He wanted every pilgrim to gain as much as possible.", "Standing in the Ganga, he bathed Harikrishna Maharaj, the small murti (sacred image) of God he always carried, then scooped water in his hands and sprinkled it over the group, making sure no one was missed. Some sadhus had crossed to the far bank for a better view, and shouted that they had been left out. Chuckling, he bent low and flung water towards them with all his strength.", "Of course the water never crossed the river, yet those sadhus almost danced with joy, because they had not been forgotten. Then he beckoned, about thirty swam over, and others jumped from a bridge while he laughed and patted each head that floated past. If you ever feel stuck on the far bank, remember that love crosses distances water cannot."], "quote": "The water did not of course reach them, but Swamishri’s love had.", "src": "In the Joy of Others", "ch": "Ch. 5, \"Care for Sadhus\", pp. 52-55", "url": "", "take": "If you feel left out today, send one message to someone who might feel the same.", "reflects": ["Where in your life do you feel like you are on the far bank?", "Who might be feeling left out that you could reach towards?", "What childhood dream of yours turned out differently?", "How does it feel to imagine being remembered across a distance?", "What moment of simple joy with others do you treasure?", "What does 'accepting it as God's wish' mean to you right now?", "When have you felt someone's love even when they could not be there?", "Who makes sure you are not missed out?", "What would you like to do with the dreams still waiting?", "How could you make someone feel remembered this week?"], "mins": 3, "id": "the-water-did-not-reach-them", "reflect": "Where in your life do you feel like you are on the far bank?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "You are tired, go to sleep", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["calm"], "parts": ["In the summer of 1988, Pramukh Swami Maharaj was touring America. The days were long and packed with devotees, meetings and decisions. One night in Atlanta he drifted off to sleep while his attendant sadhu gently massaged his legs. The attendant, just as worn out, nodded off too, his head coming to rest on Swamishri's feet.", "Later that night Swamishri turned over and saw what had happened. He did not wake the young sadhu sharply or call for anyone. He cupped the sadhu's head gently in his hands and lowered it onto the mattress. The movement woke him and he sat up in a fluster, but Swamishri only told him kindly that he was tired, and should go to sleep.", "There is no reproach in those words, only permission. The sadhu had not failed at his seva (service); he was simply a person who needed rest, and in this story rest was exactly what his guru wanted for him. On nights when sleep will not come, or when you feel you have not done enough, imagine those hands and that voice."], "quote": "You’re tired. Go to sleep.", "src": "In the Joy of Others", "ch": "Ch. 5, \"Care for Sadhus\", pp. 51-52", "url": "", "take": "Tonight, choose a gentle bedtime and let yourself stop, without judging what you did or did not finish.", "reflects": ["What would you do tonight if you gave yourself permission to rest?", "Where do you feel you have to keep going even when tired?", "Who tells you to rest, and do you listen?", "How do you speak to yourself when you are exhausted?", "What helps you wind down before sleep?", "Can you picture Swamishri's hands and words as you lie down tonight?", "What is one thing you could let go of today?", "How might you show this gentleness to someone else?", "What would a calm evening routine look like for you?", "When did you last feel truly rested?"], "mins": 2, "id": "you-are-tired-go-to-sleep", "reflect": "What would you do tonight if you gave yourself permission to rest?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "When you feel like a burden", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["hope", "story"], "parts": ["Chaturbhuj Swami had served the mandir at Atladra faithfully for over forty years, so careful that he could not bear to see a single penny wasted. In old age his kidneys failed and he needed regular dialysis in hospital. No longer able to serve as before, he felt useless to the Sanstha (the organisation). He told Pramukh Swami Maharaj that he was only a burden, and asked for the treatment to stop.", "Swamishri was deeply moved. He answered quietly that the dialysis must continue, and that if need be he would visit two more villages. He meant he would add to his own already exhausting travels to ask devotees for help with the costs. He told the doctors and sadhus to spare no effort in keeping the old sadhu comfortable and well, and the treatment went on.", "Chaturbhuj Swami measured his worth by what he could still do. Swamishri measured it differently: the man before him was precious simply as he was, and worth any extra effort. If the thought 'I am a burden' ever visits you, notice that it is a thought, not the truth, and let someone who loves you answer it."], "quote": "Continue the dialysis. I will tour two more villages if need be.", "src": "In the Joy of Others", "ch": "Ch. 5, \"Care for Sadhus\", pp. 55-56", "url": "", "take": "If you feel like a burden today, tell someone you trust, and let them answer.", "reflects": ["What do you believe gives a person worth?", "Who in your life would go the extra mile for you?", "When have you measured yourself only by what you can do?", "How do you treat others who are unwell or unable to work?", "Could you offer yourself that same kindness?", "Who could you tell honestly if you ever felt like a burden?", "What would someone who loves you say to that thought?", "How does it feel to receive care without earning it?", "Which part of this story stays with you?", "What is one way you are valued that has nothing to do with being productive?"], "mins": 2, "id": "when-you-feel-like-a-burden", "reflect": "What do you believe gives a person worth?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "No notes of failings", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["hope", "learn"], "parts": ["Pramukh Swami Maharaj could be firm with his sadhus when they drifted from their ideals. Yet the book is clear that, whatever their lapses, he was always ready to forgive and forget. Explaining a passage of the Vachanamrut (the recorded teachings of Bhagwan Swaminarayan) in Mumbai, he assured his listeners that God and his Sadhu keep no record of a person's failings; if they did, nobody would ever be liberated.", "A sadhu in Bochasan once asked him a searching question. Swamishri gave them such lofty teachings, yet they could not live up to them; did he never feel frustrated? His answer was full of patience. A soul is only a soul, he said, and what matters is that it has turned towards God. Shriji Maharaj himself was compassionate, and one day that soul will become brahmarup, godly in nature.", "He added that it is no small thing to have come into divine company at all. This is not a teaching that excuses carelessness, but it lifts a heavy weight. You are not being watched for mistakes. You are being walked with, slowly and patiently, towards the good, by someone who has already decided to keep no notes."], "quote": "God and his Sadhu keep no notes of a person’s failings.", "src": "In the Joy of Others", "ch": "Ch. 5, \"Care for Sadhus\", pp. 59-60", "url": "", "take": "When you replay a mistake today, say quietly 'no notes are being kept', and take one kind step.", "reflects": ["Which of your own mistakes do you keep notes on?", "How does it feel to hear that God keeps no such record?", "What would change if you believed you were being walked with, not watched?", "When have you forgiven someone without keeping score?", "Which ideal do you find hard to live up to right now?", "How could you be as patient with yourself as Swamishri was with the sadhus?", "What small sign shows you have turned towards God?", "Who in your life does not hold your past against you?", "What would you like to put down today?", "How would you speak to a friend who felt they kept falling short?"], "mins": 2, "id": "no-notes-of-failings", "reflect": "Which of your own mistakes do you keep notes on?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The worry that was not needed", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["story", "calm"], "parts": ["In 1966 Yogiji Maharaj was due to travel from Limdi to Rajkot. Pramukh Swami Maharaj sent the attendant sadhus ahead early to prepare lunch, and told them to go straight there. On the way they could not resist a quick detour for darshan (a sacred viewing of the murtis) at the historic mandir in Muli, built by Bhagwan Swaminarayan. They reckoned they could make up the time.", "Then everything went wrong. Their roof rack caught on a low railway bridge and was ripped off, scattering pots and ladles across the road. A few kilometres later their tired old car broke down, and they had to be towed by another. They reached Rajkot hours late, and worry gnawed at them. Yogiji Maharaj would be waiting, and what would Pramukh Swami say?", "They walked in to find Yogiji Maharaj calmly eating while Pramukh Swami sat beside him, lovingly serving. Seeing the attendants had not arrived, he had quietly cooked the whole meal himself. Yogiji Maharaj glowed with pleasure. The scene they had dreaded on the road was simply not there. So often the disaster we rehearse on the way is not what we find."], "quote": "Worry gnawed at them. What would Pramukh Swami say?", "src": "In the Joy of Others", "ch": "Ch. 6, \"Guru Bhakti\", pp. 69-71", "url": "", "take": "When you catch yourself rehearsing a disaster, name one other way the scene might turn out.", "reflects": ["What are you worryin
