s": ["calm", "strength"], "parts": ["In Vachanamrut Gadhada I 74, Bhagwan Swaminarayan gives a vivid image. If God seats us on an elephant, a mark of honour, we should be happy there. If he seats us on a donkey, we should be just as happy. What matters is not the ride but staying attached to God's holy feet.", "He says the same about bigger things: whether Satsang grows or shrinks, we should stay content, because everything happens by God's will. Like a dry leaf carried wherever the wind takes it, we can rest in his direction, remain dependent on him and keep worshipping joyfully, without letting frustration settle in the mind.", "This is not a call to pretend everything is fine. It is an invitation to loosen your grip on how things should look. A job offer or a rejection, a bright day or a heavy one: you are still his, still on the journey, and still able to remember him on either ride."], "quote": "if he seats us on a donkey, then we should remain happy", "src": "Swaminarayan Theology", "ch": "Ch. 4, \"Parabrahman: All-Doer\", p. 30", "url": "", "take": "Whatever today's ride is, say 'Your wish, Maharaj' once and keep going.", "reflects": ["Does today feel more like an elephant or a donkey?", "What outcome are you holding on to most tightly right now?", "How could you stay attached to Maharaj whichever way it goes?", "When has a 'donkey' season later turned out to hold something good?", "What frustration would you like to set down today?", "What does staying content look like for you, without pretending?", "How might this image help you handle a job rejection?", "What is one thing you can still do for God on a heavy day?", "Who has shown you how to stay steady on either ride?", "What would you say to Maharaj about the ride you are on now?"], "mins": 2, "id": "on-an-elephant-or-a-donkey", "reflect": "Does today feel more like an elephant or a donkey?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "A form to love", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["learn"], "parts": ["Many people think of God as a formless energy or a vast light. Bhagwan Swaminarayan taught clearly that Parabrahman eternally has a definite, divine form. It is not made of maya as our bodies are; it is radiant, human-like, serene and beautiful, and it resides in Akshardham (Vachanamrut G II 13, G III 38).", "He gave reasons we can follow. Akash (space) is formless, so pots cannot be shaped from it; a world full of forms comes from a creator with form (G II 10). And where scripture describes God as a mass of light, that light must come from somewhere: it is the radiance of his form, as sunlight comes from the sun (G I 66).", "Maharaj also spoke personally. He said that although he could constantly see that vast divine light, he was not drawn to it; he found deep bliss only in the darshan of God's form (L 14). A form can be seen, served and loved. That is why the murti in the mandir and in your puja is so precious."], "quote": "I experience profound bliss only from the darshan of God’s form.", "src": "Swaminarayan Theology", "ch": "Ch. 5, \"Parabrahman: Divine Form\", pp. 37-43", "url": "", "take": "During darshan or puja today, look at the murti's face for a few quiet breaths.", "reflects": ["Did you ever picture God as formless light or energy?", "How does believing God has a form change the way you pray?", "Which murti do you feel most drawn to, and why?", "What do you notice when you look at Maharaj's face in the murti?", "Which of Maharaj's reasons for God having a form made most sense to you?", "How is loving a form different from loving an idea?", "What seva could you offer to the murti this week?", "When has darshan brought you a moment of real joy?", "How would you explain this teaching to a curious friend?", "What would you like to say to Maharaj's murti today?"], "mins": 3, "id": "a-form-to-love", "reflect": "Did you ever picture God as formless light or energy?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Seated in one place, present everywhere", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["learn", "calm"], "parts": ["How can God be in Akshardham and also everywhere? The book answers with two words. Vyatirek means transcendent: Parabrahman resides in Akshardham in his divine form. Anvay means immanent: through his antaryami (inner-dwelling) power he is present within everything and everyone, as their controller and witness (Vachanamrut G I 7, S 5).", "Maharaj explained that when scriptures call God all-pervading, they do not mean he is formless like empty space. They mean he keeps his definite form in one place and yet, by his own power, gives darshan to all (V 13). He is within everything, yet like akash, which holds earth and water without being stained by them, he stays untouched by any flaw (K 8).", "So God is not far away in a distant abode, out of reach. Nor is he a vague, impersonal force. He is a personal God, with a form you can picture and love, who is also right here within you, aware of you, and unaffected by whatever mess or heaviness surrounds you today."], "quote": "by using his own powers, he gives darshan to all while residing in one place", "src": "Swaminarayan Theology", "ch": "Ch. 3, \"Parabrahman: Attributes\", p. 21; Ch. 5, pp. 44-45; Ch. 8, p. 121", "url": "", "take": "Pause once today, hand on heart, and remember He is here as well as in Akshardham.", "reflects": ["Do you usually think of God as far away or close by?", "Where today would you like to remember that He is present?", "How does it feel that God is within you but untouched by your struggles?", "What mess or heaviness around you could you invite Him into?", "When have you sensed God as a witness beside you?", "Which word, anvay or vyatirek, speaks to you more today?", "How could you remember His presence during a stressful task?", "What difference does a personal God make compared with a vague force?", "Where is one ordinary place you could greet Him this week?", "What would you like the God within you to hear today?"], "mins": 2, "id": "seated-in-one-place-present-everywhere", "reflect": "Do you usually think of God as far away or close by?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The archer and the arrow", "by": "Gunatitanand Swami", "theme": "satsang", "needs": ["learn"], "parts": ["Hindu scriptures describe many avatars, such as Ram and Krishna, who came to earth for particular tasks. Swaminarayan theology calls Parabrahman the avatari: the source from whom all avatars come. Someone once suggested to Gunatitanand Swami that the difference is like one actor playing many different roles. Swami gently disagreed and offered better pictures.", "He said it is like the difference between a king and a nobleman, an archer and the arrow, the moon and the stars (Swamini Vato 6.33). The arrow does great work, but its power comes from the archer. The book explains that God enters those through whom avatars appear and works through them, as fire enters iron and makes it glow, while each remains distinct (Vachanamrut P 7).", "This is taught with respect, not rivalry. The book notes that Maharaj never refuted any avatar or their devotees; he spoke of their glory. The point is to recognise who Bhagwan Swaminarayan is: the source from whom all that power flows, and the One we are blessed to have found."], "quote": "The difference between the avatars and their source is not like that.", "src": "Swaminarayan Theology", "ch": "Ch. 6, \"Parabrahman: Supreme\", pp. 50-53, 97", "url": "", "take": "When you see an avatar's murti, bow respectfully and remember the source of its power.", "reflects": ["Had you heard the 'actor and roles' idea before? What did you think of it?", "Which of Swami's comparisons helps you most: king, archer or moon?", "How does the image of fire in iron help you understand this?", "Why do you think Maharaj spoke of other avatars with respect?", "How can you hold firm conviction while staying respectful of others' faith?", "What does it mean to you that you have found the source itself?", "How would you explain the avatari idea to a cousin in a sentence?", "What question does this teaching raise for you?", "Where in your life do you see power flowing from a deeper source?", "How does this teaching deepen your gratitude for satsang?"], "mins": 3, "id": "the-archer-and-the-arrow", "reflect": "Had you heard the 'actor and roles' idea before? What did you think of it?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "A little at a time", "by": "Sadhu Brahmadarshandas", "theme": "faith", "needs": ["hope", "learn"], "parts": ["The book is honest that understanding Bhagwan Swaminarayan's true greatness is hard. Maharaj himself said that developing conviction in God is more difficult than anything else (Vachanamrut L 18). The book notes that even great sadhus such as Muktanand Swami and Brahmanand Swami took many years to grasp it fully.", "So Maharaj taught with compassion, according to each person's capacity. A Gujarati saying captures it: kidine kan, ane hathine man, a grain for the ant and a great measure for the elephant. Give the ant the elephant's share and it is crushed. Maharaj spoke to each audience at the level they could receive, and led them forward gently.", "Once Brahmanand Swami wept because they could not openly sing of Maharaj's supremacy everywhere. Maharaj told him to sing in a way that would help countless souls towards liberation. Your own understanding is allowed to unfold in the same patient way. Depth grows through steady contact, not by forcing it all at once."], "quote": "people developed conviction in his supremacy gradually over many years", "src": "Swaminarayan Theology", "ch": "Ch. 6, \"Parabrahman: Supreme\", pp. 94-99", "url": "", "take": "Take in one small teaching today, and let that be enough for now.", "reflects": ["Which part of satsang do you feel you are still slowly understanding?", "How does it feel to know great sadhus took years too?", "What is your 'grain for the ant' this week?", "Where do you put pressure on yourself to understand everything at once?", "What has become clearer to you over the last year?", "How could you be gentler with your own pace of growth?", "Who has explained things to you at just the right level?", "What question would you like to carry patiently for a while?", "How does Maharaj's compassion in teaching change how you see him?", "What small step of understanding would you like to take next?"], "mins": 2, "id": "a-little-at-a-time", "reflect": "Which part of satsang do you feel you are still slowly understanding?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "A lineage without end", "by": "Yogiji Maharaj", "theme": "satsang", "needs": ["learn", "hope"], "parts": ["Bhagwan Swaminarayan returned to Akshardham in 1830. So how can he still be manifest, present in a form we can meet? The Vachanamrut answers: when God is not personally on earth, one should seek the refuge of the Sant who has realised God, because liberation is attained through him too (V 10).", "Maharaj taught that he dwells in Aksharbrahman more fully than in anyone or anything else (G I 41). Yogiji Maharaj explained it with an image: there were many gopis, but Radha was the foremost. In the same way, Maharaj resides completely in the Gunatit Satpurush, the guru who is Aksharbrahman in human form.", "In a 1997 letter, Pramukh Swami Maharaj wrote that a queen has as much power as the king, and so Maharaj manifests through Aksharbrahman. The book traces the living succession from Gunatitanand Swami to Bhagatji Maharaj, Shastriji Maharaj, Yogiji Maharaj and Pramukh Swami Maharaj. As Yogiji Maharaj said, it never ends. God is still reachable, in person. Today, that living guru is Mahant Swami Maharaj."], "quote": "there is never an end to his lineage", "src": "Swaminarayan Theology", "ch": "Ch. 7, \"Parabrahman: Forever Manifest\", pp. 108-113", "url": "", "take": "Look at a photo of the guru today and remember Maharaj is present through him.", "reflects": ["What does it mean to you that God is still reachable in person?", "Which guru in the succession do you feel most connected to, and why?", "How does Yogiji Maharaj's image of Radha among the gopis help you?", "When have you felt Maharaj's presence through the guru?", "What would you like to ask the guru if you had a moment with him?", "How can you take the guru's refuge in a practical way this week?", "What story of a guru in this lineage do you love most?", "How does an unbroken lineage give you hope for the future?", "Who first introduced you to the guru?", "What one teaching of the guru would you like to live more fully?"], "mins": 2, "id": "a-lineage-without-end", "reflect": "What does it mean to you that God is still reachable in person?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Learning from the master", "by": "Gunatitanand Swami", "theme": "satsang", "needs": ["hope", "learn"], "parts": ["To become a doctor you learn from a professor of medicine; to become an engineer, from a professor of engineering. The book uses this everyday example to explain a central teaching: to become brahmarup, taking on the qualities of Aksharbrahman, we need to associate with Aksharbrahman himself, present on earth as the Gunatit guru.", "Maharaj also compared Aksharbrahman to the sun (Vachanamrut G II 42). Once the sun rises, every direction becomes clear. In the same way, through the guru we come to understand Parabrahman as he truly is. The Mundaka Upanishad says one who knows Brahman becomes brahmarup, and Maharaj said that close association passes Brahman's virtues to the jiva (G II 31).", "Gunatitanand Swami gave great hope here. He said that if one finds such a sadhu and does as he says, flaws that would have taken countless lifetimes to remove can be overcome now. Association means closeness in thought, word and action: listening to him, following his guidance and keeping him in mind through the day."], "quote": "imperfections that would have taken tens of millions of births to overcome are overcome today", "src": "Swaminarayan Theology", "ch": "Ch. 9, \"Aksharbrahman: Introduction\", pp. 127-129, 137", "url": "", "take": "Read or listen to a few words from the guru today and act on one of them.", "reflects": ["Who has been a real teacher in your life, and what did you learn from them?", "What does associating with the guru look like for you day to day?", "Which of your habits would you most like the guru's help with?", "How does the image of the sun rising help you understand the guru's role?", "What guidance of the guru have you already followed, and what happened?", "How does it feel to know change can happen faster than you expect?", "Which is easiest for you: thought, word or action? Which is hardest?", "What is one instruction of the guru you could act on this week?", "How could you keep the guru in mind during your job search?", "What quality of the guru would you most like to learn?"], "mins": 3, "id": "learning-from-the-master", "reflect": "Who has been a real teacher in your life, and what did you learn from them?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Swami and Narayan", "by": "Pramukh Swami Maharaj", "theme": "satsang", "needs": ["learn"], "parts": ["On 31 December 1801, on the fourteenth day after his guru Ramanand Swami passed away, Bhagwan Swaminarayan gave his devotees a new mantra at Faneni village: 'Swaminarayan'. At that time he was known by other names, such as Sahajanand Swami and Narayanmuni. If he only wanted to be worshipped, he could have used one of those. So why this word?", "Just as Radha-Krishna and Sita-Ram join God's name with his foremost devotee, 'Swaminarayan' joins Swami, meaning Gunatitanand Swami (Aksharbrahman), with Narayan, meaning Maharaj himself (Parabrahman). Pramukh Swami Maharaj explained that it means devotee with God: we offer true worship to Narayan by taking on the virtues of the ideal devotee, Swami.", "Bhagatji Maharaj once asked the young Shastriji Maharaj whether he truly understood 'Swaminarayan'. Shastriji Maharaj replied that he firmly believed Maharaj was supreme God. Bhagatji Maharaj said that was faith in Narayan alone; full understanding also meant knowing Gunatitanand Swami to be Akshar. Every time you chant the mantra, you repeat the whole theology in one word."], "quote": "Swami with Narayan, that is, Bhakta with Bhagwan.", "src": "Swaminarayan Theology", "ch": "Ch. 1, \"Swaminarayan Tattvagnan\", pp. 2-5", "url": "", "take": "Chant 'Swaminarayan' slowly five times, thinking of Swami on the first half and Narayan on the second.", "reflects": ["Did you know the story of where the mahamantra was first given?", "What does 'devotee with God' mean to you?", "Which of Gunatitanand Swami's virtues would you most like to imbibe?", "How might chanting feel different now you know its full meaning?", "How would you answer Bhagatji Maharaj's question yourself?", "When does chanting 'Swaminarayan' help you most?", "Which other pairs, like Radha-Krishna, help you understand this?", "What does it teach you that God chose to be named alongside His devotee?", "Who in your family taught you to chant, and what do you remember?", "How could you bring the mantra into one ordinary moment today?"], "mins": 2, "id": "swami-and-narayan", "reflect": "Did you know the story of where the mahamantra was first given?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "A mandir for the murti", "by": "Gunatitanand Swami", "theme": "satsang", "needs": ["learn"], "parts": ["Once, after hearing five Vachanamruts read aloud twice, Gunatitanand Swami concluded that becoming brahmarup is essential for everyone, whoever they are. Then he turned to a devotee with a picture. If you have a murti but no mandir, where will you install it? First prepare a mandir, and then God will stay (Swamini Vato 3.13).", "Our hearts are that mandir. To become brahmarup means to take on the qualities of Aksharbrahman: pure, steady and free from maya's pull. The Shikshapatri asks us to see our true self as brahmarup and to offer devotion to God with that understanding (verse 116). Swami's point is that such a heart becomes a fitting home for Purushottam.", "A mandir is built stone by stone, and it takes time. Each kind choice, each moment of patience, each sincere prayer and each piece of seva is another stone laid. Some days you may lay only one, and that still counts. Nothing is wasted, and the One who will live there values every stone."], "quote": "You have a murti, but without a mandir where will you install it?", "src": "Swaminarayan Theology", "ch": "Ch. 9, \"Aksharbrahman: Introduction\", pp. 129-130, 136", "url": "", "take": "Choose one quality to 'build' today, such as patience in one conversation.", "reflects": ["If your heart were a mandir, which part feels most complete?", "Which 'stone' would you like to lay this week?", "What does a fitting home for God look like to you?", "Which quality of Aksharbrahman inspires you most?", "What helps you feel steady inside?", "Which small kindness today could be a stone in your mandir?", "How does this picture change the way you see everyday effort?", "Who helps you build, and how?", "What would you like to clear out to make more room for God?", "How could you remember this image during a frustrating moment?"], "mins": 2, "id": "a-mandir-for-the-murti", "reflect": "If your heart were a mandir, which part feels most complete?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The greatest one serves", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["learn"], "parts": ["Aksharbrahman is vast beyond imagining. Maharaj said countless universes float like tiny atoms in each pore of Akshar (Vachanamrut G II 42). He explained with mountains: Girnar looks small beside Mount Meru, and Meru looks small beside Mount Lokalok. The universes do not actually shrink; Akshar is simply that immense.", "Yet the book describes one of Akshar's forms as God's eternal servant in Akshardham: a personal, divine form forever engaged in humble devotion and service to Parabrahman (G I 21). Aksharbrahman is also the abode where God lives, the all-pervading consciousness that supports everything, and the guru on earth. It is one reality working in four ways.", "The most exalted being after God chooses the role of servant. That turns ordinary ideas of greatness upside down. It also shows what devotion looks like at its highest: not grandness or recognition, but loving service. Every small seva you offer, even one nobody sees, is a step in the same direction as Akshar."], "quote": "In its other form, that Akshar remains in the service of Purushottam Narayan.", "src": "Swaminarayan Theology", "ch": "Ch. 10, \"Aksharbrahman: Attributes\", p. 143; Ch. 11, \"Aksharbrahman: Forms and Functions\", pp. 145-148", "url": "", "take": "Do one quiet act of service today that nobody needs to notice.", "reflects": ["What does greatness usually mean in the world around you?", "How does Akshar's choice to serve change that picture?", "Which of Akshar's four forms had you not heard of before?", "What seva do you find most joyful?", "Who do you know who is great but humble?", "How could you serve someone quietly this week?", "What does the mountain comparison help you imagine?", "Where might humility help you in a job interview or at work?", "What gets in the way of serving with a light heart?", "How does it feel to walk in the same direction as Akshar?"], "mins": 2, "id": "the-greatest-one-serves", "reflect": "What does greatness usually mean in the world around you?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Eighteen quilts", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["story", "learn"], "parts": ["In Vartal, Bhagwan Swaminarayan asked Gunatitanand Swami to serve the sadhus who were ill. Swami washed their quilts. Some healthy sadhus noticed his willingness and handed him their quilts as well. One day, having washed eighteen of them, he met Maharaj near the Hanuman gate and became lost in his darshan.", "Back in the assembly, Maharaj said that this sadhu had placed the quilts on his own shoulders, and asked for them to be brought in. The sick sadhus collected theirs; the healthy ones were too embarrassed to come forward. Then Maharaj asked Brahmanand Swami what he knew of this sadhu. Brahmanand Swami praised his bhajans, his seva, his renunciation and his faith.", "Maharaj said that was not all. Swami beheld Maharaj's murti within him while awake, dreaming and in deep sleep, and many would one day follow him. Maharaj felt Swami's seva as a weight on his own shoulders, and saw what others missed: the inner greatness of Akshar hidden in humble service."], "quote": "That sadhu has burdened the quilts upon my shoulders.", "src": "Swaminarayan Theology", "ch": "Ch. 11, \"Aksharbrahman: Forms and Functions\", pp. 157-158", "url": "", "take": "Do one task for someone who cannot repay you, and trust that Maharaj notices.", "reflects": ["What moves you most in this story?", "Why do you think Maharaj felt the quilts on his own shoulders?", "When has your quiet effort gone unnoticed by people?", "How does it feel to know Maharaj notices unseen seva?", "What do you think the healthy sadhus learned that day?", "How can you serve without keeping score?", "What inner quality of someone you know do others tend to miss?", "What would it be like to hold Maharaj in mind while doing a chore?", "Where might you need to say no kindly, so your seva stays joyful?", "Which detail of this story would you share with a friend?"], "mins": 2, "id": "eighteen-quilts", "reflect": "What moves you most in this story?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Covered, never spoiled", "by": "Sadhu Brahmadarshandas", "theme": "heavy", "needs": ["hope"], "parts": ["The book describes the jiva, your true self, in beautiful terms drawn from the Vachanamrut and Shikshapatri: eternal, conscious and blissful by nature, pure, radiant, ageless and indivisible. Nothing can pierce it and time cannot age it. It belongs to no caste or community, and it is described as an embodiment of happiness and knowledge.", "Why, then, do we not feel this? The book explains that since time without beginning, the jiva has been covered by maya's ignorance, which it compares to darkness hiding what is really there. This bondage is real, and it takes God and the guru to lift it. But the book makes a striking point: this covering cannot put a single flaw into the jiva's essentially pure form.", "Darkness hides a room; it does not damage it. The book says that through association with the Gunatit guru, the covering is removed, and the jiva comes to experience the knowledge and bliss that were always its own. Whatever you are going through, what you truly are has never been spoiled, and it is still his."], "quote": "it is unable to bring about any defects in their essentially pure form", "src": "Swaminarayan Theology", "ch": "Ch. 13, \"Jivas\", pp. 174-175; Ch. 14, \"Maya\", p. 186; Ch. 15, pp. 198-200", "url": "", "take": "In one heavy moment today, remind yourself: what I truly am is still pure and still His.", "reflects": ["Which description of the jiva surprised you most?", "How does it feel to hear your true self has never been spoiled?", "What do you sometimes believe about yourself that this teaching gently questions?", "When have you glimpsed something peaceful and bright within you?", "What helps lift the covering a little for you?", "How could you speak to yourself more kindly today, knowing this?", "Who reminds you of your goodness when you forget it?", "What would change if you treated yourself as God's pure creation?", "Which of your qualities do you think shines through even on hard days?", "What would you like to thank God for about who you are?"], "mins": 2, "id": "covered-never-spoiled", "reflect": "Which description of the jiva surprised you most?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Made with compassion", "by": "Sadhu Brahmadarshandas", "theme": "faith", "needs": ["hope", "learn"], "parts": ["Why does the universe exist at all? The book explains that Parabrahman is complete and content in himself, so he gains nothing by creating. He creates out of compassion, to give souls bound by maya the opportunity to become free (Vachanamrut K 1, P 1). The book adds that he shows no partiality or cruelty in how the world works.", "Even the great cosmic cycles carry kindness. The book notes that God dissolves the universe for the souls' benefit too: to let jivas, tired from countless births and deaths, rest (K 1). And when he creates again, it is so that they can have another chance to meet him and be freed. Nothing in the cycle is careless or cruel.", "Maharaj also taught that the world is not an illusion. Souls, maya and the universe are real (G I 39, 42). So your life, your efforts and your relationships are real, and the world they happen in was made with souls like you in mind. This human life is not an accident; it is an opportunity given with love."], "quote": "Creation is borne out of Parabrahman’s compassion", "src": "Swaminarayan Theology", "ch": "Ch. 14, \"Maya\", pp. 186-187, 190-191, 194", "url": "", "take": "Notice one beautiful thing in the world today and thank God for making it.", "reflects": ["How does it feel to know the world was made out of compassion?", "What in your life feels like an opportunity given with love?", "Where do you see kindness built into the world around you?", "What does it mean to you that your life and efforts are real?", "Which relationship in your life are you most grateful for?", "How could you use today's opportunity in a small way?", "What beautiful thing did you notice this week?", "How does the idea of rest for tired souls speak to you?", "What would you like to say to God about the world He made?", "How might this teaching change the way you see an ordinary morning?"], "mins": 2, "id": "made-with-compassion", "reflect": "How does it feel to know the world was made out of compassion?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Glow-worms and stars", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["learn"], "parts": ["Between God and us in the book's map are the ishwars: immensely powerful beings, such as the Brahma, Vishnu and Shiv of each universe, who help in its creation, sustenance and dissolution. The book says the difference between an ishwar and a jiva is like that between a glow-worm and a star: far greater power and knowledge, and a lifespan as long as the universe.", "Yet ishwars are still bound by maya, just as jivas are. All their power depends on Parabrahman, and before Aksharbrahman and Parabrahman they are powerless. For their own liberation, the book explains, even ishwars must take birth as humans on earth and associate with Brahman and Parabrahman, becoming brahmarup (Vachanamrut G II 31).", "Pause on that. Beings far greater than us need exactly what you already have: a human birth and the chance to associate with the guru and worship Maharaj. However small you may feel on some days, the opportunity in your hands is one that even the stars must come to earth to receive."], "quote": "as distinct as that between glow-worms and the stars", "src": "Swaminarayan Theology", "ch": "Ch. 12, \"Ishwars\", pp. 169-172", "url": "", "take": "Today, thank Maharaj once for this human birth and the satsang in it.", "reflects": ["Had you heard of the ishwar category before?", "How does it feel that even powerful beings need what you already have?", "When do you feel small, and how might this teaching speak to that?", "What part of your satsang life do you most take for granted?", "How could you make more of this opportunity this week?", "Which image here stays with you: the glow-worm or the star?", "What does 'bound by maya' mean to you in plain words?", "Who helped you find satsang in this life?", "What would you like to do with this human birth?", "How could you express gratitude for satsang in one action today?"], "mins": 2, "id": "glow-worms-and-stars", "reflect": "Had you heard of the ishwar category before?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Freedom while living", "by": "Sadhu Brahmadarshandas", "theme": "satsang", "needs": ["learn", "hope"], "parts": ["Swaminarayan theology speaks of two kinds of liberation. Videha mukti is liberation after this life, when the soul reaches Akshardham. Jivan mukti is liberation while still living: becoming brahmarup and experiencing God's presence and bliss here and now. Maharaj speaks of this living state in the Vachanamrut (S 9, G III 7).", "The book explains that such a devotee still meets the results of past karma, but is not shaken by them. They understand that whatever comes is by the will of their beloved God, and that nothing can trouble them without that will. Within themselves they see the manifest form of God, and they live with a steady, even mind in every situation (L 10, G II 1).", "The book also defines liberation not only as freedom from suffering but as joy: becoming brahmarup and experiencing God's own bliss. That is the direction satsang points in. It is not just a distant future reward; through the guru's association, that freedom can begin in this life, little by little, one steady moment at a time."], "quote": "Everywhere, always, and in all circumstances, he remains in a state of equanimity", "src": "Swaminarayan Theology", "ch": "Ch. 15, \"Mukti Mimansa: Deep Reflection on Liberation\", pp. 199-202", "url": "", "take": "In one tense moment today, pause and remember: this too is within His will.", "reflects": ["Had you thought of liberation as something that can begin now?", "What would a steadier mind look like for you this week?", "Which situations shake you most easily?", "How might remembering God's will soften one of them?", "When have you felt a moment of real inner freedom?", "What does joy, not just relief, mean to you spiritually?", "Who do you know who seems steady in all circumstances?", "What small practice helps you feel God within you?", "What would 'little by little' look like for you this month?", "What would you like to be free of, and what would you like to be free for?"], "mins": 2, "id": "freedom-while-living", "reflect": "Had you thought of liberation as something that can begin now?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Human actions, divine eyes", "by": "Gunatitanand Swami", "theme": "satsang", "needs": ["learn"], "parts": ["When Bhagwan Swaminarayan lived on earth, he slept, spoke, walked and travelled like anyone else. The book explains that God often conceals his divinity when he takes a human form, out of compassion, so that people can come close, serve him and offer devotion (Vachanamrut P 7). Yet his form on earth is exactly as divine as his form in Akshardham (G III 31).", "The same is true of the Gunatit guru. Gunatitanand Swami taught that true bliss in worship comes when God's human-seeming actions and his divine actions are seen as equally divine (Swamini Vato 5.101). He compared the two ways of seeing to the moon: seeing human flaws makes one's progress fade like the new moon, while seeing divinity makes it grow (5.392).", "This is a way of looking, practised over time. When the guru says something that surprises you, or one of Maharaj's leelas (divine actions) seems ordinary, the invitation is to look again with trusting eyes. The book says this understanding helps a devotee rise above maya, and brings real joy into worship."], "quote": "true bliss in worshipping God is attained", "src": "Swaminarayan Theology", "ch": "Ch. 7, p. 109; Ch. 8, \"Parabrahman: Absolutely Divine\", pp. 115-120", "url": "", "take": "Recall one ordinary-seeming moment from the guru's life and look for the divinity in it.", "reflects": ["Which ordinary action of Maharaj do you love hearing about?", "Why do you think God hides His divinity out of compassion?", "When has the guru surprised you, and how did you respond?", "What helps you look with trusting eyes?", "Which prasang of the guru felt ordinary at first but meaningful later?", "How does the moon comparison help you?", "What doubt would you like to see with divine eyes instead?", "How could this way of seeing bring you more joy in darshan?", "Who in your family models this kind of seeing?", "What would you like to ask Maharaj about this teaching?"], "mins": 2, "id": "human-actions-divine-eyes", "reflect": "Which ordinary action of Maharaj do you love hearing about?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The demons within", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["learn"], "parts": ["Earlier avatars came for particular tasks, often to defeat demons. In old manuscripts and in a letter to his paramhansas and devotees, Bhagwan Swaminarayan explained his own purpose differently: he came to make souls brahmarup and grant them ultimate liberation, and to destroy the ignorance that comes from maya. That, he said, was his sole purpose.", "Once, to test his followers, Maharaj pointed out that he had not killed any demons, so why did they call him God? The sadhus answered that the demons of old had themselves fallen to lust, anger and greed. Maharaj had destroyed those very forces inside people, which is greater still. Nishkulanand Swami recorded this answer in the Bhakta Chintamani, and Maharaj was very pleased.", "The book notes that through his association, countless men and women, householders and sadhus alike, experienced the bliss of atma and Paramatma while still living. That work continues. Satsang is not only about avoiding what is wrong; it is about Maharaj gently freeing you from what weighs on you from within."], "quote": "my incarnation is to make the jivas brahmarup and grant them ultimate liberation", "src": "Swaminarayan Theology", "ch": "Ch. 6, \"Parabrahman: Supreme\", pp. 79-80, 89-90", "url": "", "take": "Name one small inner habit, like irritability, and hand it to Maharaj in prayer today.", "reflects": ["What do you think of the sadhus' answer to Maharaj's test?", "Why might inner demons be harder to defeat than outer ones?", "Which inner habit would you most like Maharaj's help with?", "How does it feel that Maharaj's purpose is your freedom?", "When have you noticed an old habit loosening its hold?", "What helps you ask for help rather than fight alone?", "Which story of someone transformed by Maharaj inspires you?", "How might you be patient with yourself while habits change?", "What does 'freedom from within' mean to you?", "What would you like Maharaj to free you for this year?"], "mins": 2, "id": "the-demons-within", "reflect": "What do you think of the sadhus' answer to Maharaj's test?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The bliss in one pore", "by": "Bhagwan Swaminarayan", "theme": "faith", "needs": ["hope"], "parts": ["Bhagwan Swaminarayan described Parabrahman as the source of infinite, eternal bliss. In Vachanamrut Sarangpur 1 he said he would give up all the pleasures of countless universes for a single second of God's darshan. Gather every joy from every universe, he said, and it would not equal a millionth of the bliss present in one pore of God.", "The book adds more: God's is the most blissful form (G III 28), he is the reservoir of every kind of bliss (G III 39), and every joy we seek through the senses exists in him at once (G II 1). This is not a demand to reject happiness. It tells us where happiness finally comes from.", "On flat or grey days it can feel as if joy has dried up. This teaching says the source never runs dry, even when we cannot feel it. Every moment of genuine peace in darshan, kirtan or prayer is a drop from that ocean. The ocean is still there, and there is always more."], "quote": "for just one second’s darshan of that God", "src": "Swaminarayan Theology", "ch": "Ch. 3, \"Parabrahman: Attributes\", pp. 21-22", "url": "", "take": "Spend one minute in darshan today simply enjoying Maharaj, asking for nothing.", "reflects": ["When have you felt a moment of real joy in darshan or kirtan?", "What does it mean to you that joy has a source that never runs dry?", "Which kirtan lifts your mood most?", "What small joy did you notice this week?", "How could you make room for one minute of simple darshan today?", "What would it be like to ask Maharaj for nothing, just to enjoy Him?", "Where else do you look for happiness, and how does that compare?", "How might this teaching help on a flat day?", "Who helps you feel joy in satsang?", "What would you say to Maharaj about the bliss you hope to feel?"], "mins": 2, "id": "the-bliss-in-one-pore", "reflect": "When have you felt a moment of real joy in darshan or kirtan?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Nothing is lacking", "by": "Bhagwan Swaminarayan", "theme": "faith", "needs": ["hope"], "parts": ["In Vachanamrut Gadhada II 14, Bhagwan Swaminarayan says something surprising. A person who truly understands the nature and greatness of God, even with only a modest intellect, should be regarded as highly intelligent. A person without that understanding, however clever in worldly matters, should be seen as lacking real intelligence.", "Gunatitanand Swami said the same in his own words: one who has resolute conviction in God's form has completed every endeavour and has nothing more left to do (Swamini Vato 1.123). Maharaj also said that if someone has firm faith in God, a small shortcoming that still remains is nothing to worry about (G II 13).", "The world measures people by exams, CVs and job titles. Satsang uses a different scale. Your worth in God's eyes rests on your faith in him and understanding of his greatness, which no interview can take away. That does not make effort pointless, but it puts it in its proper place."], "quote": "should still be regarded as possessing much intellect", "src": "Swaminarayan Theology", "ch": "Ch. 2, \"Parabrahman: Introduction\", pp. 14-16", "url": "", "take": "Before any task that feels like a test today, remember your real worth is already safe with Him.", "reflects": ["What measures do you usually use to judge yourself?", "How does satsang's scale feel different from the world's?", "Which small shortcoming do you worry about more than you need to?", "When have you felt 'not clever enough', and what would Maharaj say?", "What does real intelligence mean to you now?", "How could this teaching steady you before an interview?", "Who do you know who is wise in faith, whatever their qualifications?", "What effort feels worthwhile to you, even if results are slow?", "How can you keep effort in its proper place this week?", "What would you like to remind yourself of on a hard day?"], "mins": 2, "id": "nothing-is-lacking", "reflect": "What measures do you usually use to judge yourself?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The only guardian", "by": "Bhagwan Swaminarayan", "theme": "heavy", "needs": ["strength", "calm"], "parts": ["In Vachanamrut Vartal 5, Bhagwan Swaminarayan describes what it means to truly take refuge in God. Such a devotee, even if facing pain as vast as the dissolution of the universe, would not look to anyone else as their protector. God alone is their guardian, and God alone is the one they call on.", "He goes on: whatever happiness this devotee wants, they seek it from God; they see no one else as the source of joy, and they live by God's wishes. Maharaj calls such a person a staunch devotee. Gunatitanand Swami added that one who understands God's glory stays happy whatever difficulties or ill health arise (Swamini Vato 1.4).", "Taking refuge does not mean you will never struggle. It means that when you do, you know where to turn. And since God is the all-doer, the help that comes through doctors, family and friends is also his help. You can accept it gladly while remembering the One working through it all."], "quote": "would not believe anyone to be his guardian against such misery except God", "src": "Swaminarayan Theology", "ch": "Ch. 4, \"Parabrahman: All-Doer\", pp. 31-32", "url": "", "take": "When you feel overwhelmed, say 'You are my guardian, Maharaj', then take one small next step.", "reflects": ["Where do you turn first when things feel too much?", "What does taking refuge in Maharaj look like for you in practice?", "Which person has been God's help to you recently?", "How does it feel to call Maharaj your guardian?", "What small next step could you take today, trusting Him?", "When have you felt protected during a hard time?", "What help are you finding hard to accept, and why?", "How could you thank God for the people He works through?", "What would you like to hand over to your guardian tonight?", "What words would you use to ask Maharaj for strength?"], "mins": 2, "id": "the-only-guardian", "reflect": "Where do you turn first when things feel too much?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The poet-saints of Maharaj", "by": "BAPS Enlightening Essays", "theme": "kirtan", "needs": ["story", "learn"], "parts": ["In the early years, scholars in Jamnagar mocked Bhagwan Swaminarayan's sadhus. When humble saints like Atmanand Swami could only say that they obeyed their guru, they were laughed at as unlettered villagers. Maharaj did not argue back. Instead he asked every sadhu to study Sanskrit and philosophy, and to develop music, poetry, singing and the arts until each gift was polished.", "Even Muktanand Swami, already in his fifties, sat with younger sadhus to learn Sanskrit from the beginning. Out of this effort came an extraordinary circle of poets. Muktanand Swami could sing, play many instruments and compose. Premanand Swami composed over 14,000 songs and sang so beautifully he could make an afternoon feel like dawn. Nishkulanand Swami, a skilled carpenter, wrote 23 books and over 2,000 songs.", "When the poet Dulaa Kaag recited Brahmanand Swami's compositions, tears flowed from his eyes. Years later the sadhus returned to the same courtyard in Jamnagar and, led by Nityanand Swami, answered the same scholars so well that they bowed. The kirtans we sing today were born from patient learning offered to God."], "quote": "Until today we thought that sadhus could only sing village rhymes", "src": "The Paramhansas: Gliding to Glory", "ch": "Enlightening Essays, 2008", "url": "https://www.swaminarayan.org/essays/2008/0809.htm", "take": "Pick one kirtan by Premanand, Brahmanand or Nishkulanand Swami and learn what one line means.", "reflects": ["Which kirtan do you love most, and do you know who wrote it?", "How might you have felt being laughed at like those early sadhus?", "Maharaj answered mockery with learning. What could you quietly learn this month?", "Muktanand Swami started Sanskrit in his fifties. What feels 'too late' for you to begin?", "Which of your gifts would you like to polish and offer to God?", "What does it feel like when a kirtan moves you to tears?", "Who in your life has helped you grow a talent?", "What small daily practice could turn into something beautiful over years?", "Which line from a kirtan has stayed with you, and why?", "How could singing be part of your seva this week?"], "mins": 2, "id": "the-poet-saints-of-maharaj", "reflect": "Which kirtan do you love most, and do you know who wrote it?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "To the beat of bhajan", "by": "Pramukh Swami Maharaj", "theme": "kirtan", "needs": ["story", "calm"], "parts": ["A doctor's son once rang from New Jersey to ask what Pramukh Swami Maharaj was doing. The answer came back simply: bhajan, of course, what else is there to do? In Mumbai in 1995, children ran upstairs and found him singing. When dinner finished early one evening, he asked what was next, and answered himself: bhajan. Even five spare minutes became singing with Dharmacharan Swami.", "Yogiji Maharaj used to tell of a cotton merchant so full of his trade that he asked for 'cotton' to drink when he meant water. Whatever fills the heart spills out naturally. For Swamishri it was bhajan, remembering and singing to God, and it ran through calls, letters, meetings and walks like a fish living in water.", "Asked about his hobby, he said bhajan. In his passport, under occupation, he wrote that his work was to do bhajan and inspire others to do it. For him, bhajan was the answer to every problem. The essay says his whole life kept one rhythm: the steady beat of devotion."], "quote": "Swamishri breathes to the beat of bhajan.", "src": "To The Beat of Bhajan", "ch": "Sadhu Yogvivekdas, 2009", "url": "https://www.swaminarayan.org/essays/2009/2201.htm", "take": "When you have five spare minutes today, hum one line of a bhajan instead of scrolling.", "reflects": ["What fills your mind most naturally when you are idle?", "If someone asked your 'hobby' today, what would you honestly say?", "Where could five spare minutes of bhajan fit into your day?", "Which bhajan do you find yourself humming without thinking?", "What does 'like a fish in water' mean to you in devotion?", "How do you feel after singing, compared with before?", "Who could you sing with this week?", "What would you write under 'occupation' if it described your heart?", "When a problem feels heavy, could a bhajan help you face it?", "What one rhythm would you like your days to keep?"], "mins": 2, "id": "to-the-beat-of-bhajan", "reflect": "What fills your mind most naturally when you are idle?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Narsinh Mehta's song of empathy", "by": "Narsinh Mehta", "theme": "kirtan", "needs": ["story", "learn"], "parts": ["Narsinh Mehta (1414 to 1481) is one of Gujarat's best-loved bhakta-poets. He was born near Junagadh and, as a child, could barely speak. He lost his parents early and was raised by his grandmother. Tradition says an ascetic at a Shiv temple blessed him and asked him to chant 'Radhe Krishna', and his speech returned.", "His devotion was not always welcome at home, and he later left to worship on his own. He sang freely, even in the neighbourhoods of the poorest people, which angered the orthodox of his community. His reply came as a song: a true Vaishnav, a beloved of God, is one who feels other people's pain as his own.", "When King Ra'Mandalik tested him by locking a garland inside a temple, Narsinh sang through the night, and the story says the garland came to rest around his neck. He left around 740 bhajans. Bhagwan Swaminarayan often asked his own poet-sadhus to sing Narsinh's songs and told devotees to take their feeling to heart."], "quote": "He is called a Vaishnav (Hari's beloved) who understands other people's misery", "src": "Narsinh Mehta", "ch": "Sadhu Mukundcharandas, 2005 (from Rishis, Mystics and Heroes of India, Vol. I)", "url": "https://www.swaminarayan.org/essays/2005/2209.htm", "take": "Listen once to 'Vaishnav jan to' today and notice one person whose pain you could ease.", "reflects": ["Narsinh struggled to speak as a child. Where has your voice felt blocked?", "Who do you know who truly understands other people's pain?", "When did someone last feel your pain as if it were their own?", "Where might God be asking you to sing, even if others disapprove?", "What does being 'Hari's beloved' mean to you?", "Which of Narsinh Mehta's bhajans do you already know?", "Why do you think Bhagwan Swaminarayan loved these songs?", "How could you show empathy to someone who is struggling this week?", "What would you sing through a long night of testing?", "Which line of a bhajan has comforted you in a hard time?"], "mins": 2, "id": "narsinh-mehta-s-song-of-empathy", "reflect": "Narsinh struggled to speak as a child. Where has your voice felt blocked?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Mirabai's refuge in Giridhar", "by": "Mirabai", "theme": "kirtan", "needs": ["story", "strength"], "parts": ["Mirabai was a Rajput princess of the sixteenth century. At three, her grandfather Dudaji helped her receive a small murti of Krishna, which stayed with her for life. When she was seven, watching a wedding procession, her mother told her that Kanha would be her bridegroom. The child took it to heart, and her whole life became a love song to him.", "Married into the royal family of Chitor, she faced years of hostility for her devotion. She chose Raidas, a humble leather worker, as her guru, which shocked the court. She answered with bhajans, saying she welcomed their disapproval if it meant staying close to her Lord. She sang to him by many names: Giridhar, Murlidhar, Ghanshyam, Ranchod.", "In Vrindavan, a great saint refused to meet her because of a vow. Mira replied that in Vrindavan there was only one man, Krishna, and everyone else was a gopi. He received her. One of her kirtans says the fruit of satsang may taste bitter at first, but becomes as sweet as mango. Tradition says that at the end she merged with her Lord inside the Dwarkadhish temple."], "quote": "Mira has taken refuge in Giridhar and shall ever remain at his lotus feet.", "src": "Mirabai A Great Krishna Bhakta", "ch": "Rama Murthy, 2011", "url": "https://www.swaminarayan.org/essays/2011/2210.htm", "take": "Say one of God's names slowly three times today, the way Mira called to Giridhar.", "reflects": ["What small thing from childhood has stayed with you as a link to God?", "Mira faced disapproval for her devotion. Have you ever felt that?", "Which name of God feels closest to your heart?", "What does 'refuge' mean to you on a hard day?", "Mira chose a humble guru. What does humility look like in your satsang?", "When has satsang felt bitter at first and sweet later?", "What would you say in a bhajan if you wrote one tonight?", "How can you stay gentle with people who do not understand your faith?", "Which of Mirabai's bhajans do you know or would like to learn?", "Where do you feel most at home with God?"], "mins": 2, "id": "mirabai-s-refuge-in-giridhar", "reflect": "What small thing from childhood has stayed with you as a link to God?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Raidas, the singing cobbler", "by": "Raidas", "theme": "kirtan", "needs": ["story", "hope"], "parts": ["Raidas was born near Kashi in 1377 into a family of cobblers and became a disciple of Swami Ramanand, alongside Kabir. When his father sent him away for his devotion, he built a small hut outside town. There he mended shoes and sang bhajans all day, worshipping a small murti. In one song he tells the Lord that He is the sandalwood and Raidas is only the water it scents.", "A jealous man complained to the king that a cobbler should not worship. At the palace, learned men were asked to call the murti into their laps with mantras, and could not. Raidas simply sang, asking how someone as unsteady as him could offer devotion, and the story says the murti came to rest in his lap.", "A sadhu once offered him a philosopher's stone that turned iron into gold. Raidas declined it, and left it untouched on a shelf. Queens and later Mirabai accepted him as their guru. He sang that his birth, deeds and talent were all low, yet the Lord had lifted him up. Honest work and a singing heart were enough."], "quote": "I do not want this maya.", "src": "Raidas", "ch": "Enlightening Essays, 2005 (from Rishis, Mystics and Heroes of India, Vol. I)", "url": "https://www.swaminarayan.org/essays/2005/0809.htm", "take": "While doing an ordinary task today, quietly sing or chant, as Raidas did at his work.", "reflects": ["Raidas sang while he worked. What task could you pair with a bhajan?", "When have you felt 'not good enough' to offer devotion?", "What does it mean to you that God lifted a humble cobbler so high?", "What 'philosopher's stone' tempts you away from what matters?", "Who do you know who does ordinary work with extraordinary devotion?", "How do you respond when someone looks down on you?", "What would you like your daily work to be filled with?", "Raidas called himself water and God the sandalwood. What image would you use?", "What does contentment look like in your life right now?", "Who could you encourage who feels overlooked?"], "mins": 2, "id": "raidas-the-singing-cobbler", "reflect": "Raidas sang while he worked. What task could you pair with a bhajan?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Gauribai and the missing crown", "by": "Gauribai", "theme": "kirtan", "needs": ["story", "strength"], "parts": ["Gauribai was born in 1759 in Giripur, Gujarat, into a community where everyone could read. Widowed as a small child, she did not despair. She said Bhagwan was her Lord and she had dedicated her life to Him. She stayed with her parents, worshipped, studied scripture and began composing bhajans of her own.", "Her reputation grew until the local Raja built a mandir in her honour, where pilgrims, sadhus and scholars came to hear her. Later she travelled to Gokul, Vrindavan, Kashi and Puri. In Jaipur a queen offered her five hundred gold coins; she gave them away. The king then tested her by locking a richly adorned murti in his private shrine and asking her to describe it.", "After prayer, Gauribai described every ornament, and added that only one thing was wrong: the crown was missing from the head. The king was astonished and asked forgiveness. She left behind thousands of bhajans, mostly in Gujarati. Her life shows how a woman's quiet, steady devotion could become song that still carries others to God."], "quote": "Bhagwan is my Lord and I have dedicated my life to Him.", "src": "Gauribai", "ch": "Sadhu Mukundcharandas, 2005 (from Rishis, Mystics and Heroes of India, Vol. I)", "url": "https://www.swaminarayan.org/essays/2005/2211.htm", "take": "Write one line of your own prayer or bhajan in a notebook today, however simple.", "reflects": ["Gauribai turned a painful start into dedication. What has shaped your path?", "What would you write in a single line of your own bhajan?", "Who is a woman of devotion who inspires you?", "What does it mean to dedicate a life to God in everyday terms?", "Gauribai gave away the gold coins. What is easy or hard for you to let go of?", "How does it feel to know God sees what is hidden, like the missing crown?", "Where do you go to study or learn about satsang?", "What gift could you offer back to God this week?", "Which bhajan by a woman saint-poet do you know?", "How can you keep your devotion steady when life changes around you?"], "mins": 2, "id": "gauribai-and-the-missing-crown", "reflect": "Gauribai turned a painful start into dedication. What has shaped your path?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Holi colours, Fuldol swing", "by": "Sadhu Mukundcharandas", "theme": "festivals", "needs": ["learn", "story"], "parts": ["Holi falls on the full moon of Fagun and welcomes spring. Its name is linked to an ancient offering of newly harvested grain to Agni, the fire deity. Several stories gather around it. The best known is of young Prahlad, whose father Hiranyakashipu tried to harm him for his devotion to Vishnu. His aunt Holika sat with him in the fire, yet Prahlad came out safe.", "The essay reads this symbolically: maya, the pull away from God, was burnt up by Prahlad's steady devotion. So the true Holi is burning our own unhelpful instincts, and letting ourselves be 'coloured' by God's colour. The day is also celebrated as the birthday of Nar-Narayan Dev. Holi, then, is less about the bonfire outside and more about the change inside.", "The next day is Fuldol, the flower swing. It recalls the Yadavs seating Krishna and Arjun on a swing of flowers. When we act to please God, it is as if we pull the swing closer to us. Bhagwan Swaminarayan celebrated Fuldol at Sarangpur and Vartal, and a prayer Nishkulanand Swami versified in the Bhaktachintamani is still sung. At Sarangpur, coloured water is still sprayed during the celebrations."], "quote": "Symbolically, maya, in the form of Holika, was destroyed by Prahlad's staunch devotion.", "src": "Significance of Holi and Fuldol", "ch": "Sadhu Mukundcharandas, 2004", "url": "https://www.swaminarayan.org/essays/2004/0803.htm", "take": "Name one habit you would like to 'burn' this Holi, and one quality of God you want to be coloured by.", "reflects": ["What is your happiest memory of Holi or Fuldol?", "Which unhelpful habit would you like to put into the Holi fire?", "What colour of God's nature would you most like to take on?", "How does Prahlad's courage speak to you today?", "What helps you feel God pulling closer, like the swing?", "Which festival rituals do you understand, and which would you like to learn about?", "What does spring mean to you after a long winter?", "Who in your family keeps festival traditions alive?", "How could you celebrate a festival more deeply this year?", "What does 'being coloured by God' look like in your daily life?"], "mins": 2, "id": "holi-colours-fuldol-swing", "reflect": "What is your happiest memory of Holi or Fuldol?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "The chariot that would not move", "by": "Pramukh Swami Maharaj", "theme": "festivals", "needs": ["story", "calm"], "parts": ["Rath Yatra, on Ashadh sud 2, is a procession where a murti rides in a decorated chariot through the streets so everyone can have darshan. The essay looks at chariots in four scriptures. In the Mahabharat, Krishna chose to be Arjun's charioteer. After the war he asked Arjun to step down first, and then the chariot burst into flames. Krishna's presence had been protecting it all along.", "In the Ramayan, Ram describes his real chariot: courage and tenacity as wheels, truth and character as flags, forgiveness and mercy as reins, devotion to God as the charioteer. In the Katha Upanishad, the atma rides in the body, the intellect drives, the mind holds the reins and the senses are the horses.", "On 11 July 1983 Pramukh Swami Maharaj was at the Amdavad mandir for Rath Yatra. The chariot had worked perfectly the night before, but that morning it would not move. Asked why, he said calmly that it was Maharaj's wish; perhaps He wanted to give darshan from a still chariot. Believing God is the all-doer, the essay says, makes life happier."], "quote": "He probably wanted to give darshan in a motionless chariot.", "src": "Rath Yatra", "ch": "Sadhu Mukundcharandas, 2001", "url": "https://www.swaminarayan.org/essays/2001/2206.htm", "take": "When a plan stalls today, say quietly, 'Perhaps Maharaj wants darshan from here,' and breathe.", "reflects": ["What plan of yours has stalled recently?", "How might you see a delay as God giving darshan in a different way?", "Which part of Ram's chariot (courage, truth, mercy, devotion) feels strongest in you?", "Which part would you like to strengthen?", "Where have you seen God quietly protecting you, like Arjun's chariot?", "Who is the 'charioteer' guiding your decisions right now?", "What helps your mind hold the reins gently rather than tightly?", "Have you ever been to a Rath Yatra? What stayed with you?", "How does believing God is the all-doer change a frustrating day?", "What would you like to say to God about something that will not move?"], "mins": 2, "id": "the-chariot-that-would-not-move", "reflect": "What plan of yours has stalled recently?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "A wonder in wood", "by": "H.E. Raju K. Bhatia", "theme": "festivals", "needs": ["learn", "hope"], "parts": ["The BAPS Swaminarayan mandir in Nairobi opened in August 1999. It was written about by India's High Commissioner in Kenya. For the ground-breaking, water was gathered from the Ganga, Narmada, Sabarmati and other rivers, and also from the Nile, Lake Victoria and the Indian Ocean. Coins from 151 countries went into the foundation, a sign of welcome to the whole world.", "It was an Indo-Kenyan effort. Yellow sandstone from Jaisalmer was carved by 150 craftsmen in Rajasthan and shipped to Mombasa. At the same time, East African timbers such as Elgon teak and mahogany were shipped to India, carved in 32 places, and brought back to be assembled. The dome, pillars and walls are wood, so people called it a wonder in wood.", "Beneath the mandir, an exhibition about India's culture, values and the Swaminarayan tradition welcomed visitors who had never seen India. One line displayed there summed up its message for a troubled world: hurt no one through thought, word or deed. Visitors who knew nothing of India left wanting to go there. A mandir, the writer felt, can speak to everyone."], "quote": "Hurt no one through Thought, Word and Deed", "src": "Temple With a Message", "ch": "H.E. Raju K. Bhatia, 2007 (first published in India Perspective)", "url": "https://www.swaminarayan.org/essays/2007/0812.htm", "take": "Before you speak or reply to a message today, check it against 'thought, word and deed'.", "reflects": ["What surprises you most about how the Nairobi mandir was built?", "Which mandir has left the deepest impression on you?", "What does it mean to you that coins from 151 countries lie in its foundation?", "How do thought, word and deed each show up in your day?", "Which of the three is hardest for you to keep gentle?", "What craft or skill would you love to offer to a mandir?", "How can a mandir speak to people who are not Hindu?", "What could you tell a friend about your faith in one sentence?", "When have you felt part of something built by many hands?", "What message would you want your own life to carry?"], "mins": 2, "id": "a-wonder-in-wood", "reflect": "What surprises you most about how the Nairobi mandir was built?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Why mandirs matter", "by": "Pramukh Swami Maharaj", "theme": "festivals", "needs": ["hope", "calm"], "parts": ["Science and technology have changed how we live, the essay says, but the human mind is much the same as it always was. Material progress has not delivered lasting happiness. The ancient sages built mandirs as places to turn the mind from restlessness towards God. Pramukh Swami Maharaj taught that mandirs preserve the cleanliness of the soul.", "A letter from John in East Ham, London, makes the point. He was fifteen, not a Hindu, and first visited Neasden Mandir with his school. He went back on his own and was so moved that he cried during the arti. He wrote that he felt a field of tranquillity around the mandir and thought of it every day.", "The essay lists what mandirs give: a steadier mind, nobler living, mutual respect, culture kept alive, a sense of our true identity as atma, peace, and a connection to God, who is present in the consecrated murtis. Neasden alone had welcomed millions of visitors, including many thousands of schoolchildren. Schools educate the mind; mandirs, the writer says, help educate the spirit."], "quote": "A mandir stabilises the mind; a mandir inspires nobler living", "src": "Mandir - For A Better Tomorrow....", "ch": "Sadhu Amrutvijaydas, 2004", "url": "https://www.swaminarayan.org/essays/2004/0809.htm", "take": "Plan one unhurried visit to the mandir this week, and sit for five quiet minutes after darshan.", "reflects": ["How do you feel when you first walk into a mandir?", "What does 'a steadier mind' look like for you?", "Have you ever felt moved to tears at arti? What was happening?", "Which part of the mandir do you feel most peaceful in?", "What would you tell a friend visiting a mandir for the first time?", "How often would you like to have darshan, realistically?", "What helps you carry mandir peace back into the week?", "Which of the benefits listed feels most true for you?", "Who first took you to a mandir, and what do you remember?", "What would help you feel the 'field of tranquillity' at home too?"], "mins": 2, "id": "why-mandirs-matter", "reflect": "How do you feel when you first walk into a mandir?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "From Nilkanth to today", "by": "Bhagwan Swaminarayan", "theme": "festivals", "needs": ["learn", "story"], "parts": ["Nilkanth Varni's pilgrimage across India lasted seven years, one month and eleven days, from 1792 to 1799. The essay calls it a journey of observation and enlightenment rather than wandering. It ended at Loj in Gujarat, at Ramanand Swami's ashram. There he was initiated as Sahajanand Swami, won everyone's respect through service, and became Ramanand Swami's successor.", "He opened almshouses, helped during famines and worked for women's dignity, encouraging their education. People gave up addictions and some notorious outlaws changed their lives. British officials and Bishop Heber met him with respect. Over 500 paramhansas, many of them poets, musicians and scholars, carried his message. He built six mandirs and revived festivals.", "The line of gurus continued through Gunatitanand Swami, Bhagatji Maharaj, Shastriji Maharaj, who founded BAPS in 1907, and Yogiji Maharaj. When the essay was written in 2005, Pramukh Swami Maharaj, then in his eighties, was still travelling, having visited over 250,000 homes and replied to half a million letters. The journey Nilkanth began, it says, continues."], "quote": "His was not an aimless wandering, but a journey of observation, assessment, inspiration and enlightenment.", "src": "The Journey Continues...", "ch": "Sadhu Amrutvijaydas, 2005", "url": "https://www.swaminarayan.org/essays/2005/2206.htm", "take": "Tell someone one fact about Nilkanth Varni's journey today, or look up where Loj is on a map.", "reflects": ["Which part of Nilkanth's journey amazes you most?", "How is your own life a journey rather than aimless wandering?", "What have you been observing and learning in this season of your life?", "Which guru in the parampara do you feel closest to?", "What social cause from Maharaj's work speaks to you?", "How does it feel to belong to a history of over two hundred years?", "Who has carried the journey forward in your own family?", "What part of satsang history would you like to learn more about?", "What does 'the journey continues' mean for you personally?", "Where might your own next step lead?"], "mins": 2, "id": "from-nilkanth-to-today", "reflect": "Which part of Nilkanth's journey amazes you most?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Nothing is going to happen", "by": "Shastriji Maharaj", "theme": "festivals", "needs": ["story", "strength"], "parts": ["As a boy, Dungar Bhagat loved satsang, studied brilliantly and spoke well. With his father's eventual blessing he became a sadhu at Vartal and was named Yagnapurushdasji, later known as Shastriji Maharaj. He accepted Pragji Bhakta (Bhagatji Maharaj) as his guru and learned from him the Akshar-Purushottam teaching: to identify oneself with Akshar and offer devotion to Purushottam.", "Preaching this brought opposition and even harassment, which he bore without complaint. He worked patiently and diplomatically, so that Bhagatji Maharaj was once honoured at Junagadh at Janmashtami. When his devotees worried for his safety, he told them nothing was going to happen to him, trusting that God would protect him.", "In time he left Vartal with five sadhus and a few devotees, with little else. From that small beginning came mandirs at Bochasan, Sarangpur, Gondal, Atladara and Gadhada, where he fulfilled Shriji Maharaj's wish for a hilltop mandir. Later he appointed the young Sadhu Narayanswarupdas, aged 28, to lead the Sanstha, standing firm when some objected. That young sadhu became Pramukh Swami Maharaj."], "quote": "Nothing is going to happen to me.", "src": "Determined Diplomacy", "ch": "Subramanian Iyer, 2007", "url": "https://www.swaminarayan.org/essays/2007/2210.htm", "take": "When you feel small, remember BAPS began with five sadhus. Take one small step on something that matters.", "reflects": ["What does it mean to you to 'identify with Akshar and worship Purushottam'?", "Shastriji Maharaj started with very little. What small beginning are you in?", "How do you respond when people oppose something you believe in?", "What would help you stay calm when others are worried?", "Which BAPS mandir history would you like to visit or read about?", "When has patience achieved more than force in your life?", "Who has trusted you with responsibility when others doubted?", "What does 'determined diplomacy' look like in your relationships?", "Where do you need courage right now?", "How does knowing this history change your darshan at a BAPS mandir?"], "mins": 2, "id": "nothing-is-going-to-happen", "reflect": "What does it mean to you to 'identify with Akshar and worship Purushottam'?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Why Diwali moves each year", "by": "Sadhu Paramtattvadas", "theme": "festivals", "needs": ["learn"], "parts": ["Why does Diwali land on a different date each year, yet always around late October or early November? The essay compares calendars. The Western calendar grew from Rome. Julius Caesar's version ran slightly long, and by the sixteenth century the seasons had drifted, so Pope Gregory reformed it in 1582. England only adopted the change in 1752.", "The Indian calendar uses both sun and moon. Months are lunar, about 29.5 days, but an extra month, adhik mas, is added roughly every two and a half years to keep festivals in step with the seasons. This idea goes back to the Rig Veda. Each month has a bright half (sud) and a dark half (vad), each of fifteen tithis, calculated from the angle between sun and moon.", "Dates are usually counted in Vikram Samvat, which began in 57 BCE and is linked to King Vikram of Ujjain. To convert, subtract 57 or 56 years depending on the time of year. Ancient Indian astronomers measured time with remarkable precision. Every festival date we celebrate carries this long, careful tradition."], "quote": "The Indian calendar is ingeniously based on both the sun and the moon", "src": "Indian Calendar System", "ch": "Sadhu Paramtattvadas, 2003", "url": "https://www.swaminarayan.org/essays/2003/2207.htm", "take": "Find out today's tithi and whether we are in the sud or vad half of the month.", "reflects": ["Did you know why festival dates move before reading this?", "Which festival do you most look forward to each year?", "What does it feel like to live by both the sun and the moon?", "Do you notice the moon's phases? What do they make you feel?", "How could knowing the tithi add meaning to your week?", "What is your birthday in Vikram Samvat, if you know?", "Who in your family knows the most about the Hindu calendar?", "What other part of Indian culture would you like to understand better?", "How does learning something new affect your mood?", "What small ritual could mark the start of each new lunar month for you?"], "mins": 2, "id": "why-diwali-moves-each-year", "reflect": "Did you know why festival dates move before reading this?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Together everyone achieves more", "by": "Pramukh Swami Maharaj", "theme": "work", "needs": ["learn", "story"], "parts": ["A team, the essay explains, is a group with complementary skills, one shared purpose and mutual accountability. Good teams need people skills, subject knowledge, clear communication, decision-making and problem-solving. Underneath these sit three values: togetherness, so no one plays the blame game; equality, so rank does not block honest talk; and empathy, seeing a situation from the other person's side.", "Pramukh Swami Maharaj once had to choose a companion sadhu for someone. The coordinator suggested a name. Swamishri gently said they should think from that sadhu's point of view: what help would he himself need from a companion? We often judge suitability by our own measure and forget the other person's needs.", "Teams grow through stages: forming, storming, norming, performing and, when the work is done, adjourning. Leaders are facilitators who say 'Let us do this'. When a former Finance Minister praised him, Swamishri credited the sadhus and devotees. He could clear 65 agenda items in an hour and would check the last meeting's minutes to follow up."], "quote": "With a strong feeling of togetherness, if something goes wrong, no one will blame anyone.", "src": "Teamwork Triumphs", "ch": "Dr A.C. Brahmbhatt, 2004", "url": "https://www.swaminarayan.org/essays/2004/2206.htm", "take": "In your next group chat or meeting, ask one person, 'What would help you most?'", "reflects": ["What was the best team you have ever been part of, and why?", "Which stage (forming, storming, norming, performing) feels familiar right now?", "When did someone think from your side and really help you?", "How do you usually react when something in a group goes wrong?", "What skill would you bring to a team in an HR role?", "How could you show empathy to a colleague or friend this week?", "Who is a leader who says 'let us' rather than 'you must'?", "How do you feel when someone gives credit to others instead of themselves?", "What does equality in a team look like to you?", "Which of these ideas could you mention in a job interview?"], "mins": 2, "id": "together-everyone-achieves-more", "reflect": "What was the best team you have ever been part of, and why?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "We're rebuilding", "by": "Sadhu Amrutvijaydas", "theme": "work", "needs": ["story", "strength"], "parts": ["Thomas Edison asked endless questions as a child: how does a hen hatch chicks, why does water put out fire? After only three months at school, a teacher dismissed him as slow, so his mother taught him at home. At nine she gave him a chemistry book, and he checked every experiment himself. At twelve he sold newspapers on the railway and ran a small lab in the baggage car.", "He built a research village at Menlo Park where chemists, machinists and mathematicians worked as a team, an idea others copied years later. He patented 1,093 inventions. The electric bulb took two years of searching for the right filament, with people sent as far as the Amazon and Japan to find materials.", "In December 1914, aged 67, his laboratory caught fire and much was lost. That night he gathered his staff and said they were rebuilding, arranged workshops and a crane, and spoke of building bigger and better. He kept learning into his eighties. The essay presents him as a picture of curiosity and hope after loss."], "quote": "You can always make capital out of disaster.", "src": "The Wizard Of Menlo Park", "ch": "Sadhu Amrutvijaydas, 2002", "url": "https://www.swaminarayan.org/essays/2002/2212.htm", "take": "Name one setback from this year and write one small 'rebuilding' step beside it.", "reflects": ["What were you curious about as a child?", "Who believed in you when a teacher or system did not?", "What has 'burnt down' for you, and what might be rebuilt?", "How do you usually speak to yourself after a setback?", "What could 'building bigger and better' mean for your job search?", "Which question would you love to find the answer to?", "Who could be on your 'Menlo Park' team of supporters?", "What is one thing you have tried many times without giving up?", "How does it feel to know great people had long searches too?", "What would you like to still be learning at eighty?"], "mins": 2, "id": "we-re-rebuilding", "reflect": "What were you curious about as a child?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "The best of what I had", "by": "Sadhu Vivekjivandas", "theme": "work", "needs": ["hope", "strength"], "parts": ["A middle-aged student told Bruce Lee he felt too old and stiff to learn. Lee confided that his own right leg was nearly an inch shorter than his left, which shaped his stance, and that his poor eyesight led him to a close-range style. His advice: kick at waist height and make up for lost flexibility with knowledge and practice. Accept limits, then develop what you have.", "Charles Steinmetz was born with a crooked back and was turned away by company after company. General Electric finally took him on as a draftsman for twelve dollars a week. He went on to patent over two hundred electrical inventions. Edison, too, struggled at school and later developed a remarkable memory.", "The essay ends with Bhagwan Swaminarayan's words about Nath Bhakta, who was frail, poor and barely literate. Maharaj said he was wiser than a clever minister of Baroda, because he was seeking his true, lasting good. Real intelligence is not being good at everything. It is knowing what matters and building patiently on what you have."], "quote": "I accepted my limitations and made the best of what I had.", "src": "A Leap To Excellence", "ch": "Sadhu Vivekjivandas, 2001", "url": "https://www.swaminarayan.org/essays/2001/2209.htm", "take": "List two things you are genuinely good at, and use one of them in a job application today.", "reflects": ["What limitation have you been fighting that you could work with instead?", "Which two strengths would a friend say you have?", "Steinmetz was turned away many times. How does his story feel in your job search?", "What is your 'waist-height kick', something realistic you can do well?", "How could knowledge make up for something you find hard?", "Who do you know who has built a good life around a limitation?", "What does 'real intelligence' mean to you after reading this?", "What would you tell a friend who felt too far behind to start?", "Where have you already made the best of what you had?", "What one skill would you like to practise this month?"], "mins": 2, "id": "the-best-of-what-i-had", "reflect": "What limitation have you been fighting that you
