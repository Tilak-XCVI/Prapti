could work with instead?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Live in the present", "by": "Yogiji Maharaj", "theme": "work", "needs": ["calm", "story"], "parts": ["Joe Hyams was learning a martial art from Master Han, but kept glancing at the clock, thinking of his next appointment. The master stopped the lesson early. At the door he said, 'Your mind is elsewhere,' and told him he must learn to live in the present. A wandering mind leaks energy; a present mind gathers it.", "Yogiji Maharaj told of Shekh Challi, hired to carry a pot of ghee. As he walked he daydreamed: his wages would buy a goat, then cows, a dairy, a house, a family. When his imaginary son invited him to dinner, he shook his head, and the real pot fell and broke. Living in tomorrow cost him today.", "At Draupadi's swayamvar, many princes failed to pierce the fish's eye by looking at its reflection. Arjun succeeded because his mind held only the target. The essay's practical advice is to take genuine interest in whatever you are doing, so distractions fade. Anchor yourself firmly to what you do, and let the next thing wait its turn."], "quote": "You must learn to live in the present.", "src": "Seize The Moment", "ch": "Sadhu Vivekjivandas, 2001", "url": "https://www.swaminarayan.org/essays/2001/0809.htm", "take": "Choose one task today and give it 20 minutes with your phone in another room.", "reflects": ["Where does your mind most often wander to during the day?", "What 'pot of ghee' have you dropped by living in tomorrow?", "Which task would benefit most from your full attention today?", "What helps you come back to the present when you drift?", "How does your body feel when you are fully present?", "What is your 'fish's eye', the one target that matters this week?", "How could you take more genuine interest in a dull task?", "When did you last feel completely absorbed in something?", "What would change if you gave darshan or puja your full attention?", "What can wait its turn so you can focus now?"], "mins": 2, "id": "live-in-the-present", "reflect": "Where does your mind most often wander to during the day?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Motions before emotions", "by": "Sadhu Mukundcharandas", "theme": "work", "needs": ["strength", "learn"], "parts": ["At fifteen, John Goddard wrote a list of 127 things he wanted to do in life. By 59 he had done 106 of them, including canoeing the Nile and the Amazon, despite storms, bandits and grief along the way. The essay draws three lessons: dare to dream, act with courage, and let each achievement carry you to the next.", "Confidence, it says, is built, not born. Like hesitating at the edge of a pool, the longer we wait, the more fear grows; once we move, fear shrinks. Dr George Crane put it this way: motions come before emotions. Smile and you feel lighter. When meeting someone new, take their hand warmly, look at them, and say you are glad to meet them.", "Feed the mind with positive thoughts: garbage in, garbage out. In the First World War, Marshal Foch reported that both his wings were failing but the situation was excellent, and he went on to win. Walk tall. And, most important of all, pray: many people have found their confidence in sincere prayer. Emerson said they conquer who believe they can."], "quote": "Motions are the precursors of emotions.", "src": "Self-Confidence", "ch": "Sadhu Mukundcharandas, 2004", "url": "https://www.swaminarayan.org/essays/2004/0810.htm", "take": "Before your next call or interview, stand up, smile once, and say a short prayer.", "reflects": ["What would be on your own list of things to do in life?", "Where are you standing at the edge of the pool right now?", "Which small action could come before the feeling of confidence?", "How do you usually greet someone new?", "What thoughts are you 'feeding' your mind most days?", "When have you said 'the situation is excellent' when it didn't look it?", "What happens to your mood when you smile on purpose?", "How does prayer affect your confidence?", "Who in your life seems confident, and what do they do differently?", "What is one brave step you could take this week?"], "mins": 2, "id": "motions-before-emotions", "reflect": "What would be on your own list of things to do in life?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Big stones first", "by": "Bhagwan Swaminarayan", "theme": "work", "needs": ["learn", "calm"], "parts": ["A teacher filled a jar with big stones and asked if it was full. The class said yes. He added pebbles, then sand, then water. His point: if the water had gone in first, the big stones would never have fitted. Life works the same way. Put the most important things in first and the rest finds its place.", "Doctors check airway, breathing and circulation in that order. Families budget for needs before luxuries. For a satsangi, the essay says, the first priority is God. Gunatitanand Swami said we are born for two purposes: to become aksharrup and to worship God. Shriji Maharaj compared all our work, even our spiritual efforts, to zeros. On their own they add up to nothing; place the 1 of God before them and they gain great value.", "Keeping God first is not a single act but a habit. The essay recalls that Brahmanand Swami gave up his position as a royal poet once he recognised Maharaj. For us, it can be as simple as remembering God while studying, working and resting, so that He stays the big stone in the jar."], "quote": "place the '1' of God before the zeros", "src": "First Things First", "ch": "Sadhu Amrutvijaydas, 2005", "url": "https://www.swaminarayan.org/essays/2005/2207.htm", "take": "Write tomorrow's plan with one 'big stone' at the top, and start the day with it.", "reflects": ["What are the big stones in your life right now?", "What 'water' tends to fill your day first?", "How could you put God first in a practical way tomorrow morning?", "Which of your efforts feel like zeros without meaning behind them?", "What would change if God stood as the '1' before your job search?", "What does 'becoming aksharrup' mean to you in simple words?", "Which task keeps getting pushed out by smaller ones?", "How do you decide what matters most on a low-energy day?", "Who helps you keep your priorities clear?", "What would a well-packed jar look like for your week?"], "mins": 2, "id": "big-stones-first", "reflect": "What are the big stones in your life right now?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Listening with the heart", "by": "Sadhu Amrutvijaydas", "theme": "work", "needs": ["learn", "story"], "parts": ["After Waterloo, the first message to reach England read 'Wellington defeated', and the country despaired. Then the next word arrived: 'Napoleon'. A businessman's wife once cabled to ask if she could buy an expensive bracelet. He replied, 'No, price too high,' but the comma went missing, and she bought it. Small gaps in communication can cost a great deal.", "We spend much of our waking day communicating, and a large part of it listening. But hearing is not listening. The essay offers LADDER: Look at the speaker, Ask questions, Don't interrupt, Don't change the subject, Empathise, Respond. Much of what passes between two people is unspoken, in tone, face and posture. Prejudice, fear and our own wishes are what block us from truly hearing.", "When communication breaks down completely, a sincere letter admitting your own part can heal it; the essay tells of a son and mother reconciled this way. It closes with the Gita's rule for speech: say only what is true, helpful and kind, or stay quiet. For anyone in people-focused work, these are daily tools."], "quote": "Utter only those words which are: truthful (satya), beneficial (hit) and palatable (priya).", "src": "The Art of Communication", "ch": "Sadhu Amrutvijaydas, 2006", "url": "https://www.swaminarayan.org/essays/2006/0804.htm", "take": "In one conversation today, climb the LADDER: look, ask, don't interrupt, and empathise.", "reflects": ["When has a missing word or tone caused a misunderstanding for you?", "Which LADDER step do you find hardest?", "Who in your life listens to you with their heart?", "What gets in the way of your listening: prejudice, fear or wanting?", "How could you show someone you really heard them this week?", "Is there a relationship where a sincere letter might help?", "Before speaking, how could you check: true, helpful, kind?", "Why might listening be a key skill in HR work?", "What does your body language usually say when you are anxious?", "When did staying quiet turn out to be the kindest choice?"], "mins": 2, "id": "listening-with-the-heart", "reflect": "When has a missing word or tone caused a misunderstanding for you?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "This, too, will pass", "by": "Sadhu Atmaswarupdas", "theme": "heavy", "needs": ["hope", "calm"], "parts": ["A boy watched a butterfly struggling to get out of its cocoon. Wanting to help, he cut the cocoon open. The butterfly came out easily, but its wings were weak; it fluttered and fell. Years later he understood: the struggle itself was what strengthened the wings. The cocoon offered just enough resistance for the butterfly to be able to fly.", "The essay suggests our difficulties can work the same way. When many troubles crowd in at once, it offers a practical step: live one minute at a time, face one difficulty at a time as best you can, and set the others down for now. You may be surprised how much lighter each one becomes.", "A king once asked his philosopher for a sundial inscription that would fit both his happiest and his saddest days. The answer was four words: this, too, will pass. Faith, the essay says, is not won in one prayer or one night. It grows as we come to feel God's love and His willingness to help carry what we cannot carry alone."], "quote": "This, too, will pass!", "src": "This Too Will Pass", "ch": "Sadhu Atmaswarupdas, 2005", "url": "https://www.swaminarayan.org/essays/2005/2202.htm", "take": "Pick just one difficulty to face today. Put the rest on a list for later, and tell God about them.", "reflects": ["What feels like your 'cocoon' right now?", "Could any part of this struggle be quietly strengthening you?", "Which one difficulty will you face today?", "Which worries can you set down until tomorrow?", "What does 'one minute at a time' look like for you this evening?", "When has a hard season passed that you thought would never end?", "What would you write on your own sundial?", "Who helps you carry things you cannot carry alone?", "How does it feel to hand one worry to God in prayer?", "What small sign of lightness have you noticed this week?"], "mins": 2, "id": "this-too-will-pass", "reflect": "What feels like your 'cocoon' right now?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "One step, a thousand steps", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["hope", "calm"], "parts": ["Loneliness is common, especially while we are finding our place among other people. It can come from shyness, feeling not good enough, a move, a lost friendship or a change of school or work. The essay suggests gentle action: step into situations even when it feels awkward, and join activities where friendships grow naturally. The mandir offers many: music, study circles, sports, languages and seva.", "It adds a caution: loneliness should never push us towards company that pulls us away from our values. It is kinder to ourselves to wait for the right friends. Quiet seasons can also become a time to know ourselves: our likes, fears and hopes. Above all, they can deepen our relationship with God and His Sadhu through prayer and reading.", "Drawing on Gunatitanand Swami, the essay says our truest friends are God and His holy Sadhu, who never fail us. Pramukh Swami Maharaj taught that one who loves God is loved a thousandfold, and that when we take one step towards God, He takes a thousand towards us. Loneliness is temporary. And if we are not lonely, we can help someone who is."], "quote": "One who loves God is loved a thousandfold by Him.", "src": "Loneliness", "ch": "Enlightening Essays, 2002", "url": "https://www.swaminarayan.org/essays/2002/2204.htm", "take": "Take one small step towards God today, even a single 'Swaminarayan', and trust He is taking a thousand.", "reflects": ["When do you feel most lonely in the week?", "Which mandir activity could you try, even once?", "What has this quiet season taught you about yourself?", "What does it feel like to think God takes a thousand steps towards you?", "Who is one person you could message today, just to say hello?", "What kind of friend do you hope to find?", "How can you be gentle with yourself while you wait for the right people?", "Who might be lonely around you, and how could you include them?", "When have you felt God or Swami as a real friend?", "What small step towards God feels possible today?"], "mins": 2, "id": "one-step-a-thousand-steps", "reflect": "When do you feel most lonely in the week?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Worth that does not wobble", "by": "Gunatitanand Swami", "theme": "heavy", "needs": ["hope", "strength"], "parts": ["Many of us quietly believe our worth depends on something: good results, other people's approval, a relationship, a job title. The essay calls this the performance trap. Because no one meets every standard all the time, our sense of worth keeps wobbling. Signs of the trap include perfectionism, avoiding risks, fear of criticism, hopelessness and low motivation.", "It offers a different foundation. Success cannot add to our worth before God and His Sadhu, and failure cannot take away from it. When they look at us, they see a soul trying to grow, and their compassion is greater than their judgement. The essay says plainly that God does not look to our faults.", "Gunatitanand Swami taught that we can please only God; pleasing everyone is impossible and unnecessary. This does not mean doing less. Studies, family, work and seva still deserve our best. The difference is the reason: we offer our effort to please God and Swami. Then a setback does not shrink us, because sincere effort is what they value."], "quote": "You can please only God.", "src": "Do You Feel Useless and Unworthy?", "ch": "Enlightening Essays, 2007", "url": "https://www.swaminarayan.org/essays/2007/2209.htm", "take": "When you catch yourself measuring your worth today, say: 'I am doing this to please God, and that is enough.'", "reflects": ["What standard do you secretly believe you must meet to feel okay?", "Which sign of the performance trap do you recognise in yourself?", "How does it feel to hear that failure cannot reduce your worth before God?", "Whose approval matters too much to you right now?", "What would change if you did one task only to please God?", "When has someone valued your effort more than your result?", "How would you speak to a friend caught in the performance trap?", "What does 'God does not look to our faults' mean to you?", "Which small effort today could you offer to Swami?", "What would a steady sense of worth feel like in your body and mind?"], "mins": 2, "id": "worth-that-does-not-wobble", "reflect": "What standard do you secretly believe you must meet to feel okay?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "When souls catch up", "by": "Sadhu Vivekjivandas", "theme": "heavy", "needs": ["calm", "story"], "parts": ["An explorer was travelling through the Amazon with local guides. On the third day they suddenly stopped and would not move. He was impatient. Their chief explained that they had been going so fast that they needed to wait for their souls to catch up with their bodies. The essay suggests our rushed lives need the same kind of pause, not as laziness but as a way to stay whole.", "A pause is not wasted time. In music, the rest is part of the song. Thoreau spent two years at Walden Pond reflecting on how to live. Gunatitanand Swami stressed the need for introspection, turning inwards to see ourselves clearly, because the senses naturally pull us outwards. A pause gives us the chance to look inside.", "Two brothers, Govindram and Mayaram Bhatt, devotees of Bhagwan Swaminarayan, once spent a whole night planning a small shop in Mangrol. At dawn they paused and realised that if planning alone had taken all night, the busy shop would leave no time for worship. They let the idea go. A pause helped them see what mattered."], "quote": "their souls had caught up with their bodies.", "src": "Pause!", "ch": "Sadhu Vivekjivandas, 2001", "url": "https://www.swaminarayan.org/essays/2001/2208.htm", "take": "Set a gentle reminder for mid-afternoon: stop for two minutes, breathe, and let your soul catch up.", "reflects": ["When did you last feel your soul lagging behind your body?", "What would a two-minute pause look like in your day?", "What 'rest' in the music of your week could you protect?", "What do you notice when you turn inwards for a moment?", "Which plan might need a pause before you go further?", "Where do you feel most rushed, and why?", "What quiet place helps you reflect?", "How could introspection be kind rather than critical?", "What did the brothers' choice teach you about priorities?", "What would you like to remember at the end of each day?"], "mins": 2, "id": "when-souls-catch-up", "reflect": "When did you last feel your soul lagging behind your body?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Standing at the door", "by": "Bhagwan Swaminarayan", "theme": "heavy", "needs": ["hope", "story"], "parts": ["The paramhansas loved Bhagwan Swaminarayan deeply. On a scorching Gujarat day, when Maharaj was tired from travel, they made him a shelter out of their own cloths, soaking it with water to keep it cool, while they stood outside in the sun. Premanand Swami sang with such love that one cold winter night Maharaj came and stood at his door just to listen.", "Some sadhus, called Ekadmals, found the discipline too hard and returned to ordinary clothes. They still lived simply and sang Maharaj's praises from village to village, but they were kept at a distance and felt it keenly. They held no bitterness, and they longed to be close to Maharaj again.", "When a well needed digging at Gadhpur, sixty-five of them eagerly volunteered and finished in fifty-five days. Maharaj pressed his footprints on their chests. They sang kirtans, clapping for two hours, and he embraced each one and told them he forgave all their shortcomings and would redeem them all. No one who turns back towards Him with love is left outside."], "quote": "I now forgive you for all your shortcomings. I shall redeem all of you.", "src": "The Paramhansas: A Love Supreme", "ch": "Sadhu Tilakratnadas, 2008", "url": "https://www.swaminarayan.org/essays/2008/0810.htm", "take": "If you feel far from God today, offer one small seva or sing one kirtan, and picture Him at your door, listening.", "reflects": ["When have you felt far from God or satsang?", "What does it mean to you that Maharaj stood at Premanand Swami's door to listen?", "What small seva could be your 'well' this week?", "How does it feel to read that He forgave every shortcoming?", "Who has welcomed you back after you drifted?", "What would you sing if you knew He was listening?", "How can you welcome someone who feels outside?", "What does love for God look like on an ordinary day?", "Where are you holding on to a shortcoming you could hand over?", "What helps you trust you are never left outside?"], "mins": 2, "id": "standing-at-the-door", "reflect": "When have you felt far from God or satsang?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Trusting the refusal", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["calm", "story"], "parts": ["Stress, the essay says, touches everyone regardless of wealth or status. It lists many sources: family, work, time pressure, change, noise, and worry about what might happen. Formula One drivers reportedly feel most stressed not at top speed but in the pit stop, where they are still and dependent on others. Lack of control is hard.", "It offers ways to cope: build a balanced life, gradually raise how much you can tolerate, notice your first reactions, know your strengths and limits, share troubles with trusted people, and pray and meditate. Pramukh Swami Maharaj encouraged ghar sabha, a daily family gathering, and regular satsang so no one carries worries alone.", "Before the mandir in Neasden was built, a site in Harrow was considered. After much time and effort, permission was refused, and many were dejected. Swamishri heard the news as he was getting ready to rest. Convinced it was Shriji Maharaj's will and would turn out for the best, he fell peacefully asleep. The mandir was later built at Neasden."], "quote": "whatever happens in any given situation is due to God's will and is ultimately beneficial", "src": "Stress Management", "ch": "Prof. A.C. Brahmbhatt, 2002", "url": "https://www.swaminarayan.org/essays/2002/0810.htm", "take": "Tonight, name one worry, then say: 'This is in Your hands, Maharaj,' before you close your eyes.", "reflects": ["What is your current 'pit stop', where you feel still and out of control?", "Which source of stress is loudest for you this week?", "Who could you share one worry with?", "What helps you unwind in the evening?", "How might a 'no' today be making room for something better?", "What would ghar sabha look like in your home?", "When has a disappointment later turned out for the best?", "What is one strength you can lean on right now?", "How does it feel to picture Swamishri resting peacefully after bad news?", "What could you place in God's hands before sleep tonight?"], "mins": 2, "id": "trusting-the-refusal", "reflect": "What is your current 'pit stop', where you feel still and out of control?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "A prayer for others", "by": "Pramukh Swami Maharaj", "theme": "faith", "needs": ["story", "hope"], "parts": ["At exam time, hundreds of schoolchildren visit the Amdavad mandir to pray for good results. The essay does not mock this. Insecurity about exams, jobs or health brings people of every age to prayer. Often prayer is a last resort, when surgeons say 'just pray' or when droughts drag on. Yet God stays compassionate even to our self-centred prayers.", "In the Puranas, Gajendra the elephant was caught by a crocodile. He struggled until his strength was gone. Then he lifted a lotus to God in prayer, and God came at once to free him. We often try everything ourselves first, and turn to God only when we are helpless. Gandhi said he would have gone mad without prayer.", "The finest prayer, the essay says, goes beyond ourselves. In 1986 Pramukh Swami Maharaj had an operation to remove a large but harmless tumour. When shown a video of the surgery, he folded his hands and prayed that no one else should have to go through such suffering. He asked nothing for himself. Every sincere prayer, the essay promises, is heard."], "quote": "Every sincere prayer is heard and answered!", "src": "Prayer - Wishes Turned Godwards", "ch": "Sadhu Brahmaviharidas, 2001", "url": "https://www.swaminarayan.org/essays/2001/0805.htm", "take": "Add one line for someone else to your prayer tonight, especially someone going through what you have been through.", "reflects": ["What do you find yourself praying for most often?", "When have you felt like Gajendra, out of strength and turning to God?", "What is your 'lotus', the small offering you can lift to God today?", "Who could you pray for tonight?", "How does it feel to pray for someone facing what you have faced?", "Do you pray first, or only when everything else has failed?", "What answer to prayer have you noticed looking back?", "What would a prayer of thanks sound like from you today?", "How does Swamishri's prayer after surgery move you?", "When is it easiest for you to pray?"], "mins": 2, "id": "a-prayer-for-others", "reflect": "What do you find yourself praying for most often?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Because You are awake", "by": "Yogiji Maharaj", "theme": "faith", "needs": ["strength", "calm"], "parts": ["Fear, the essay says, both protects and harms us. Normal fear sharpens us in danger; phobias are irrational and exhausting. Even famous people had odd fears: Caesar is said to have trembled at thunder and Poe to have feared the dark. Fear arises, the essay says, when we feel smaller than what faces us. The psychologist William James noted that a sense of an infinite power behind us is what eases it.", "On the night before facing Bhishma in battle, Arjun slept peacefully. Asked how he could sleep with such danger ahead, he gave a simple reply to Krishna: because You are awake, my Lord. Faith does not remove the battle; it lets us rest while God keeps watch. We do our part, then we let Him hold the night.", "Yogiji Maharaj's advice for exam fear was practical and prayerful: study regularly, four hours a day at school and eight at college, because fear comes from lack of preparation; so prepare extensively and pray fervently. The essay ends with a saying worth remembering: fear knocked on the door, faith answered, and nothing was there."], "quote": "Because you are awake my Lord!", "src": "Fear", "ch": "Enlightening Essays, 2002", "url": "https://www.swaminarayan.org/essays/2002/0805.htm", "take": "Before an interview or hard call, prepare one thing well, then pray: 'You are awake, Maharaj.'", "reflects": ["What fear has been knocking loudest lately?", "Which part of it could preparation shrink?", "Which part can only faith answer?", "What would it mean to rest because God is awake?", "How does your body tell you that you are afraid?", "When has a fear turned out smaller than you imagined?", "What does 'prepare extensively and pray fervently' look like for you this week?", "Who helps you feel braver?", "What prayer do you say when you feel afraid?", "What would you do today if fear were a little quieter?"], "mins": 2, "id": "because-you-are-awake", "reflect": "What fear has been knocking loudest lately?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "The unseen wind", "by": "Sadhu Brahmaviharidas", "theme": "faith", "needs": ["hope", "learn"], "parts": ["We never see gravity, yet it holds our whole world together. We never see air, yet we cannot live five minutes without it. Astronomers found Neptune before they saw it, by noticing its pull on Uranus. The essay's point is simple: the most important forces in life are often invisible.", "Ronald Nixon, a Cambridge scholar, was a fighter pilot in the First World War. On one flight he felt an unexplained force pull his plane to the left. Later he learned enemy aircraft would have shot him down had he not veered. That experience stayed with him. He left his career to seek that force, came to India, surrendered to a guru and became known as Yogi Krishnaprem.", "When the young Narendranath asked Ramakrishna Paramhansa, 'Have you seen God?', the answer was a calm yes, as clearly as I see you. That honest reply lit a faith that made him Swami Vivekananda. The essay closes by saying that thousands today feel they have touched God through Pramukh Swami Maharaj. Faith, like the wind, is known by what it moves."], "quote": "it is not the lofty sails but the unseen wind that moves the ship", "src": "How Visible Is The Invisible?", "ch": "Sadhu Brahmaviharidas, 2003", "url": "https://www.swaminarayan.org/essays/2003/0805.htm", "take": "Notice one invisible thing holding you up today, like breath or someone's prayers, and thank God for it.", "reflects": ["What invisible support has carried you this year?", "When have you sensed a pull you could not explain?", "What are the 'lofty sails' you tend to rely on?", "What is the 'unseen wind' in your life?", "Who in satsang has made God feel real to you?", "What question would you ask a saint if you could?", "How do you know someone loves you, even without seeing it?", "What helps your faith when you cannot see results?", "How does noticing your breath change your mood?", "Where might God be moving your ship without you noticing?"], "mins": 2, "id": "the-unseen-wind", "reflect": "What invisible support has carried you this year?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Protected by God Himself", "by": "Bhagwan Swaminarayan", "theme": "faith", "needs": ["story", "calm"], "parts": ["One evening a messenger named Dharamsinh arrived at Galuji's home in Dadusar with a letter from Shriji Maharaj at Vadtal. It asked Galuji to pack and come at once, leaving his mother at home. Galuji did not ask why, and he did not delay to make excuses. Within an hour he had packed and set out for Vadtal.", "That same night, around three in the morning, armed men broke into the house to settle an old grudge. Galuji's mother calmly told them he had left for Vadtal because Maharaj had called him. The men were stunned. Only an all-knowing Lord could have known their plan. Their leader apologised, said Galuji's God was true and his devotion pure, and asked how anyone could touch someone God protects.", "Galuji's mother gently suggested they let go of their old enmity, and they agreed and asked for the Lord's blessing. What began as a threat ended in reconciliation. The story shows a devotee who simply obeyed, and a God who was already caring for him before he knew there was danger."], "quote": "But who can touch those protected by God Himself?", "src": "Galuji of Dadusar", "ch": "Sadhu Amrutvijaydas, 2006", "url": "https://www.swaminarayan.org/essays/2006/0805.htm", "take": "When you lock the door tonight, say quietly: 'You are already caring for me, Maharaj.'", "reflects": ["When have you been protected from something you only learned about later?", "How easy is it for you to follow guidance without knowing why?", "What 'letter' from God might you be receiving right now?", "How does Galuji's mother's calm speak to you?", "Who in your life could you let go of an old grudge with?", "What helps you feel safe at night?", "How do you picture God caring for you before you ask?", "When has obedience led you somewhere good?", "What does 'protected by God Himself' feel like to you?", "How could you share this story with someone who is anxious?"], "mins": 2, "id": "protected-by-god-himself", "reflect": "When have you been protected from something you only learned about later?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Held on through the test", "by": "BAPS Enlightening Essays", "theme": "faith", "needs": ["strength", "story"], "parts": ["While writing the scripture Satsangijivan, Nityanand Swami described Shriji Maharaj as the supreme God, the source of all avatars. Many at the time saw Maharaj only as an avatar of Krishna, and complaints reached him. Maharaj publicly told Nityanand Swami to change the text. Nityanand Swami humbly refused: even hearing Maharaj deny it, he could not think of him as anything less.", "Maharaj sent him away. Nityanand Swami left without bitterness and spent seven days in meditation beside a small lake. Meanwhile Maharaj asked about him every day. After a week he called him back to Vadtal, embraced him before everyone, and said this was a true disciple: what he had written was correct, and he had proved his conviction by holding on even when sent away.", "The essay notes that when God lives among people, He may behave in very human ways, which can confuse us. The Vachanamrut (Gadhada I-78) says one with total conviction will not be misled by this. Faith, the essay says, is believing in what one cannot see, and its fruit is seeing what one believed."], "quote": "Faith is believing in what one cannot see.", "src": "The Paramhansas: Rising with Resolve", "ch": "Enlightening Essays, 2008", "url": "https://www.swaminarayan.org/essays/2008/2208.htm", "take": "On a day when God feels distant, hold on to one thing you know about Him and say it aloud.", "reflects": ["What do you believe about God that no one could talk you out of?", "When has God felt distant, even though you kept going?", "How do you think Nityanand Swami felt beside that lake?", "What does it mean to you that Maharaj asked about him every day?", "Where might a hard season be testing your conviction?", "How can you hold on without bitterness?", "What have you seen that you first only believed?", "Who in your life has stayed faithful through difficulty?", "Which part of Akshar-Purushottam upasana would you like to understand better?", "What would you say to God on a day He feels far away?"], "mins": 2, "id": "held-on-through-the-test", "reflect": "What do you believe about God that no one could talk you out of?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Only love matters", "by": "Yogiji Maharaj", "theme": "bhakti", "needs": ["story", "learn"], "parts": ["Thakorbhai Patel was a respected gynaecologist and, in the late 1960s, Mayor of Baroda. He saw murtis as mere stone. Then he fell seriously ill with a liver abscess. Facing the worst, he went to Yogiji Maharaj, who lovingly gave him sanctified water. The essay says his bleeding stopped and he recovered. Thakorbhai said he became a changed man, most of all through experiencing God's presence in Yogiji Maharaj himself.", "Murti puja, worship of God's sacred image, rests on the idea of a personal God with form. Love needs someone to love. Worship purifies the senses and the mind: the hands serve, the mind dwells on God's qualities, and concentration grows. If God is everywhere, He is certainly present in the murti; and great saints can invoke His presence especially strongly.", "The essay recalls that Premanand Swami was garlanded by the murti of Gopinathji in Gadhada while he was lost in singing His glory, and that Yogiji Maharaj often spoke with murtis. How can the infinite have a form? The devotee is not troubled by this question. God is beyond such contradictions, and for the devotee only love matters."], "quote": "God is above all contradictions. For him, it is only love that matters.", "src": "Relevance Of Murti Puja", "ch": "Sadhu Anandswarupdas, 2003", "url": "https://www.swaminarayan.org/essays/2003/2203.htm", "take": "At darshan or in your puja today, look at the murti for one full minute as if meeting someone who loves you.", "reflects": ["What do you feel when you look at Thakorji?", "Which murti has felt most alive to you?", "What does 'love needs someone to love' mean in your devotion?", "How does caring for your puja help steady your mind?", "What question about God do you carry without needing an answer?", "Who helped you first feel God's presence?", "How could you make your daily puja more loving and less rushed?", "What would you like to say to the murti today?", "How does Premanand Swami's garland story make you feel?", "What small offering could you make with love this week?"], "mins": 2, "id": "only-love-matters", "reflect": "What do you feel when you look at Thakorji?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "He who serves is great", "by": "Yogiji Maharaj", "theme": "bhakti", "needs": ["story", "hope"], "parts": ["On a train to Bochasan, a young man asked Yogiji Maharaj how he had become so respected. He answered that it came from scrubbing utensils and the grace of his guru, Shastriji Maharaj. He loved to recall how Gunatitanand Swami swept the Junagadh mandir courtyard and said that the one who serves is great.", "Once, 75 devotees arrived at Sarangpur in the middle of the night. Yogiji Maharaj had been turning his mala until 1 a.m., yet he rose at once and happily cooked for them until 3 a.m. In Dar-es-Salaam he quietly washed young people's clothes. At Ramod, when the kitchen smoke stung everyone's eyes, he cheerfully took over.", "At 76 in Gondal, while everyone slept, he swept the garden and tidied the kitchen. He sighed that being a guru stopped him serving as much as he wished, and said he would like to be a disciple again just to scrub utensils. Even his dreams were of seva. For him, service was joy, not a duty."], "quote": "In our scheme of things he who serves is great.", "src": "Yogiji Maharaj's Spirit of Service", "ch": "Ram Murthy, 2003", "url": "https://www.swaminarayan.org/essays/2003/0812.htm", "take": "Do one small unseen seva at home today, like tidying a shared space, and offer it to Yogiji Maharaj.", "reflects": ["Which small seva brings you quiet joy?", "How does it feel that Yogiji Maharaj valued scrubbing utensils so highly?", "What seva could you do that no one would notice?", "When has serving someone lifted your own mood?", "Who in your family serves without being asked?", "How could you turn a household chore into seva today?", "What would it mean to serve 'with undiminished joy'?", "Which story of Yogiji Maharaj touches you most?", "How could seva fit gently into a low-energy day?", "Who could you serve this week without them knowing?"], "mins": 2, "id": "he-who-serves-is-great", "reflect": "Which small seva brings you quiet joy?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "The name that steadies", "by": "Bhagwan Swaminarayan", "theme": "bhakti", "needs": ["calm", "learn"], "parts": ["A wealthy man once watched Pramukh Swami Maharaj chanting with kartals and was struck by the bliss on his face. The essay explains why chanting works: what we hear shapes how we feel. A shout of 'Scorpion!' brings fear; praise brings joy. In the same way, repeating God's name makes us God-conscious. Soldiers and people in hardship have always sung to find courage.", "The name works even when we are imperfect: Valmiki is said to have chanted 'Mara, Mara' instead of 'Rama, Rama', and still it purified him. Bhagwan Swaminarayan gave a very practical instruction: when troubling thoughts flood the mind during meditation, stop trying to meditate and chant the Swaminarayan mantra aloud instead.", "The essay also gives simple guidelines for nama japa: choose a regular time, ideally early morning; keep a set place; sit comfortably, facing north or east; pronounce the name clearly; use the mala properly; picture Bhagwan Swaminarayan and the gurus; avoid asking for worldly things during japa; and let go of fault-finding. Small, steady practice is the key."], "quote": "one should abandon meditation and resort to chanting the Swaminarayan mantra aloud", "src": "Nama Japa", "ch": "Shastri Shri Haridas Swami, 2001", "url": "https://www.swaminarayan.org/essays/2001/0812.htm", "take": "When thoughts start racing today, say 'Swaminarayan' aloud, slowly, eleven times.", "reflects": ["When do troubling thoughts crowd in most for you?", "How does chanting aloud feel different from chanting silently?", "What time of day could become your japa time?", "Where in your home could be your quiet japa place?", "What happens to your breathing when you chant slowly?", "Does it comfort you that the name works even when you feel imperfect?", "Which guideline would be easiest to start with?", "How could you use japa before an interview or difficult call?", "Who taught you to turn the mala?", "What do you notice after eleven slow repetitions?"], "mins": 2, "id": "the-name-that-steadies", "reflect": "When do troubling thoughts crowd in most for you?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Back to the nest", "by": "Bhagwan Swaminarayan", "theme": "bhakti", "needs": ["calm", "learn"], "parts": ["In the very first Vachanamrut, Shriji Maharaj says that no spiritual effort is harder than keeping the mind continuously on the form of God. People take on hard pilgrimages and outward disciplines, yet guiding the mind gently back to God is harder still. Knowing this, Maharaj does not scold. He gives three simple pictures to help.", "If you pour one pot of water on the same spot each day, it dries before the next, and no pool forms. A steady stream makes a pool. So remembrance needs to flow through eating, walking and working, not only puja time. And twenty pails poured separately make weak trickles, but poured together they become a strong current. A mind gathered in one direction is powerful.", "The third picture is the gentlest. Birds leave their nests by day, but at night they always return to their own nest to rest, never another bird's. After satsang, katha and kirtan, Maharaj asks, do we return to rest in the form of God? Whatever the day holds, our real home is Him."], "quote": "they always return to their respective nests at night to rest", "src": "Focusing on God Pt-1", "ch": "Sadhu Amrutvijaydas, 2007", "url": "https://www.swaminarayan.org/essays/2007/0802.htm", "take": "Tonight, before sleep, picture Maharaj's murti for a few breaths, like a bird returning to its nest.", "reflects": ["Where does your mind 'fly' during the day?", "What is your nest to return to at night?", "How could remembrance flow as a stream rather than single pots?", "Which activity could carry a moment of remembrance tomorrow?", "Where is your energy scattered into many trickles?", "What would one gathered current look like for you?", "How does picturing the murti before sleep feel?", "Why do you think Maharaj called this the hardest effort?", "How can you be gentle with yourself when your mind wanders?", "What helps you feel at home with God?"], "mins": 2, "id": "back-to-the-nest", "reflect": "Where does your mind 'fly' during the day?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "From Magniram to Advaitanand", "by": "BAPS Enlightening Essays", "theme": "lives", "needs": ["story", "hope"], "parts": ["Magniram left home young to seek God. When his guru wanted him to marry his daughter, he refused, holding to his vow, and was sent away. He wandered for years without finding peace. His frustration turned to anger at his guru, at himself and at God. He began using powers he had gained to frighten people and extract money from kings, chasing fame instead of God.", "In Mangrol he demanded money from the king, who challenged him to overcome the Lord, seated simply in white. Magniram threatened black magic. The Lord answered that He taught people to live purely, not to show powers, and said He feared nothing. Magniram's spells failed. The goddess he invoked told him this was the Supreme Godhead, and that he had forgotten what he first set out to find.", "That night something changed. In the morning Magniram begged to become a disciple and gave up his wealth and pride. He humbly carried the saints' shoes on his head and was named Advaitanand. He told Maharaj he wanted nothing from the past, only His grace. No one has wandered too far to come home."], "quote": "I want none of it, all I desire is your grace.", "src": "Casting Off Old Feathers", "ch": "Enlightening Essays, 2008", "url": "https://www.swaminarayan.org/essays/2008/0811.htm", "take": "Name one frustration that has turned into anger, and offer it to God in a short, honest prayer.", "reflects": ["When has frustration turned into anger for you?", "What did you first set out to find in life, before things got complicated?", "What 'old feathers' would you like to cast off?", "How does it feel to know Maharaj welcomed Magniram completely?", "What does 'only Your grace' mean to you today?", "Where have you chased recognition instead of peace?", "Who in your life has come back from a hard path?", "What would a fresh start look like for you?", "How can you be kind to the part of you that got lost?", "What would you say to God if you were starting again today?"], "mins": 2, "id": "from-magniram-to-advaitanand", "reflect": "When has frustration turned into anger for you?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Letters that carried blessings", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "hope"], "parts": ["Between 1971 and 1995, Pramukh Swami Maharaj read and replied to around 435,000 letters, about two hours a day, alongside constant travel and assemblies. On a 1977 tour he described answering letters in cars, while sitting, even in bed. When a devotee in London joked that the sadhus never let him rest, Swamishri replied that this was his service to the Lord.", "The night before flying from Mumbai to London in 1988, with a crowded schedule, he still wrote to Trigunbhai, an unwell devotee he had not been able to visit. He apologised for not coming, asked him to remember Maharaj and keep up devotion, and assured him that all would turn out for the best.", "Many young people who later became sadhus were first encouraged by his letters in their struggles. People framed his letters, kept them in their puja, and read them in hard times. Many felt their guru had personally visited them. The essay recalls an old saying: if one is steadfast, the Lord will surely help."], "quote": "All will turn out for the best.", "src": "With Blessings...", "ch": "Translated by Sadhu Yogvivekdas, 2008", "url": "https://www.swaminarayan.org/essays/2008/2212.htm", "take": "Write a short note or message of encouragement to someone who is unwell or struggling today.", "reflects": ["Have you ever received a letter or message that you kept for years?", "Who could you write a few kind lines to today?", "How does it feel to picture Swamishri answering letters in the car?", "What words would you most like to hear from your guru right now?", "What does 'all will turn out for the best' mean on a hard day?", "Where is steadfastness asked of you at the moment?", "How could writing help you process your own feelings?", "Who has encouraged you through a message at the right time?", "What would you write to God in a letter tonight?", "How can you make your messages to others more like blessings?"], "mins": 2, "id": "letters-that-carried-blessings", "reflect": "Have you ever received a letter or message that you kept for years?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "The smallest of the small", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "calm"], "parts": ["In a 1986 interview in Sarangpur, sadhus asked Pramukh Swami Maharaj the secret of his spiritual progress. He said it was single-minded determination to please his guru, and pointed to Bhagatji Maharaj, Shastriji Maharaj and Yogiji Maharaj, who had each risen through the same devotion to their own guru. It was not talent or effort alone, but a heart set on pleasing the guru.", "He shared a memory he said he could never forget. As a young sadhu, he had prepared milk for Shastriji Maharaj, and by mistake a harmful medicinal oil had gone into it. He was terrified and broke down in tears. Shastriji Maharaj did not scold him. He comforted him, asking whether he was not as great a bhakta as Mira, Prahlad and Narsinh, and whether Maharaj would not save him. He assured him he would be fine, and he was.", "Asked how he stayed calm through praise and insult, Swamishri said he thought of himself as the smallest of the small: I know nothing, everyone else is greater. With that attitude, he said, the mind stays still. He added that nothing happens without Maharaj's wish, and we are simply His servants."], "quote": "I am the smallest of the small. I know nothing.", "src": "The Secret of Your Greatness!", "ch": "Interview with Pramukh Swami Maharaj, Sarangpur 1986 (published 2001)", "url": "https://www.swaminarayan.org/essays/2001/0811.htm", "take": "If you make a mistake today, answer yourself the way Shastriji Maharaj answered a frightened young sadhu.", "reflects": ["How do you usually treat yourself after a mistake?", "How would it feel to be comforted instead of scolded, like the young sadhu?", "Who has been gentle with you when you got something wrong?", "How could you be that gentle with someone else this week?", "What does 'the smallest of the small' mean to you?", "How does humility help your mind stay still?", "Whose praise or criticism affects you most?", "What does pleasing your guru look like in daily life?", "When have you felt that nothing happens without Maharaj's wish?", "What would you ask Swamishri if you could interview him?"], "mins": 2, "id": "the-smallest-of-the-small", "reflect": "How do you usually treat yourself after a mistake?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "What can't we do?", "by": "Shastriji Maharaj", "theme": "lives", "needs": ["story", "strength"], "parts": ["Shastriji Maharaj's birth anniversary falls on Vasant Panchmi. Even when seriously ill, he travelled to consecrate murtis of Akshar and Purushottam, saying he had been born to create mandirs. During one discourse near Vadodara on the bond between devotee and God, he became so absorbed he spoke until three in the afternoon.", "When a devotee, Nagardas Darji, broke his leg in Sarangpur, Shastriji Maharaj gave him a room and personally looked after him, asking others to serve him as Hanumanji would. At eighty-one, barely able to walk ten steps, he still went to sanctify a devotee's home in Muli, supported across a dry riverbed by Yogiji Maharaj and another sadhu.", "On the farmland at Shrijipura, fast water broke through a mud channel. When Soma Bhagat struggled to repair it, Shastriji Maharaj lay down in the gap and told him to heap mud on him. Soma Bhagat hesitated; Swami insisted. He even drew the plans for the Sarangpur mandir himself. His attitude was simple: for our supreme God, what can we not do?"], "quote": "What can't we do for our supreme God!", "src": "Brahmaswarup Shastriji Maharaj", "ch": "Sadhu Vivekjivandas, 2006", "url": "https://www.swaminarayan.org/essays/2006/2201.htm", "take": "Offer one act of care today to someone who is unwell or struggling, as Shastriji Maharaj did for Nagardas.", "reflects": ["Which of these stories surprises you most?", "Who has cared for you when you were unwell?", "Who could you care for in a small way this week?", "What 'gap' in your life could you help fill for others?", "What would you gladly do for God, even if it was uncomfortable?", "How does it feel that a great guru served with his own hands?", "What does 'born to create mandirs' inspire in you?", "Where has love for God given you unexpected strength?", "How could you celebrate Vasant Panchmi meaningfully this year?", "What does selfless service look like on a tired day?"], "mins": 2, "id": "what-can-t-we-do", "reflect": "Which of these stories surprises you most?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "A storm and a rosary", "by": "Bhagwan Swaminarayan", "theme": "lives", "needs": ["story", "hope"], "parts": ["Lakshmichand was a young man from Ghogala, near Div. A group of paramhansas led by Vrajanand Swami came to his village, and he noticed a divine fragrance around them as they meditated. Vrajanand Swami explained that when devotees meditate with love, God accepts their mental offerings. Lakshmichand asked to join satsang.", "When he left for Africa to earn a living, the sadhus gave him a rosary and advice: work honestly, never be tempted by ill-gotten money, and remember God. At sea a violent storm struck. He prayed and chanted 'Swaminarayan', and the ship came through. In Africa he became a trusted manager, respected for diligence and honesty.", "After five years he fell ill and refused medicine made with alcohol. That night, the essay says, Shriji Maharaj appeared to him, helped him recover and told him to return and meet Him at Gadhada. Lakshmichand turned down his boss's generous offers and walked with his wife to Gadhada, where he finally had Maharaj's darshan with great joy."], "quote": "Never be tempted to make ill-gotten riches. They will ultimately spell ruin.", "src": "Lakshmichand Sheth of Ghogala", "ch": "Translated by Sadhu Amrutvijaydas, 2005 (from Footprints: 1)", "url": "https://www.swaminarayan.org/essays/2005/0810.htm", "take": "Keep your mala or a small reminder of God with you today, the way Lakshmichand carried his rosary abroad.", "reflects": ["What reminder of God do you carry with you?", "When has a 'storm' in life calmed after prayer?", "What does honest work mean to you in your job search?", "How do you want colleagues to describe you one day?", "What values would you refuse to trade for money or success?", "Who gave you advice before a big step that you still remember?", "What would returning to God look like in your daily routine?", "How does Lakshmichand's journey with his wife inspire you?", "What 'Gadhada' are you walking towards?", "What small promise to God could you keep this week?"], "mins": 2, "id": "a-storm-and-a-rosary", "reflect": "What reminder of God do you carry with you?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "God works through everyone", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "hope"], "parts": ["A sculpture at Swaminarayan Akshardham in New Delhi says that we are the makers of our own happiness. The essay offers three tools for growth: daily introspection, remembering we are atma; taking the Satpurush, the God-realised guru, as our role model; and slowly taking on his qualities. The stories that follow show what those qualities look like up close.", "At Atladra in 1975, Shrirang Swami was reciting chapter two of the Bhaktachintamani, which he knew Swamishri loved. He forgot a line and could not recall it. Swamishri, surrounded by responsibilities, quietly completed it for him. He had been listening all along. In 1999, hearing that a poor boy, Prashant, was in intensive care in Surat after an accident, he went to see him, walking along broken roads and stepping over a trench to reach the bedside.", "In 1992, preparing for the Yogi centenary festival, workers doubted they would finish in time. Swamishri calmly said God would work through everyone one hundred per cent. The team finished. The essay's point is gentle: grow by watching the guru closely and doing a little of what he does, each day."], "quote": "God will work through everyone 100 percent.", "src": "Role Model for Self-Improvement: Pramukh Swami Maharaj", "ch": "N. Dullabh, 2010", "url": "https://www.swaminarayan.org/essays/2010/0805.htm", "take": "Pick one quality of Swamishri, such as listening fully, and practise it in one conversation today.", "reflects": ["Which quality of Pramukh Swami Maharaj would you most like to grow in?", "When did someone really listen to you, like Swamishri with Shrirang Swami?", "Who could you visit or check on this week, like Prashant?", "What deadline or task feels impossible right now?", "How does 'God will work through everyone' change how you see it?", "What does daily introspection look like for you?", "What makes someone a good role model to you?", "How could you make one person feel valued today?", "What is one small quality you could practise every day?", "Where have you seen God working through ordinary people?"], "mins": 2, "id": "god-works-through-everyone", "reflect": "Which quality of Pramukh Swami Maharaj would you most like to grow in?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "The gold under the clay", "by": "Gunatitanand Swami", "theme": "satsang", "needs": ["hope", "story"], "parts": ["Guinness lists enormous rooms, but the essay says the world's largest room is the room for improvement. When a sadhu group visited a car factory in Germany in 1986, a manager said they had made only a fraction of the safety improvements possible. A sadhu gently asked whether improving the driver mattered even more. Michelangelo said small details make perfection, and perfection is no small thing.", "In Bangkok in 1957, a large clay murti of the Buddha was being moved when rain stopped the work. Later someone noticed a crack in the clay and, beneath it, a gleam. Under the clay the whole murti was gold. The essay compares this to the atma: pure and bright underneath, covered over by layers of attachment gathered over many lives.", "As a boy, Gunatitanand Swami, then called Mulji, looked at a well whose water was hidden by moss. He explained that desires are like moss: they hide the clear water of our true self. The Vachanamrut says faults like anger and greed are not the jiva's real nature. With the company of a God-realised sadhu, the moss clears and the gold shows."], "quote": "The world's largest room is the room for improvement!", "src": "The World's Largest Room", "ch": "Sadhu Amrutvijaydas, 2006", "url": "https://www.swaminarayan.org/essays/2006/0810.htm", "take": "When you criticise yourself today, add: 'There is gold under this clay,' and name one good quality.", "reflects": ["What does it mean to you that your true self is like gold?", "What 'clay' feels like it covers you at the moment?", "Which one small improvement would make a real difference this week?", "How can you see room for improvement without harshness?", "What moss would you like to clear from the well?", "Who in your life helps you see your own gold?", "What good quality would a close friend name in you?", "How does the company of saints help clear the moss?", "What detail in your daily routine could you care for more lovingly?", "How would you treat yourself if you truly believed you were atma?"], "mins": 2, "id": "the-gold-under-the-clay", "reflect": "What does it mean to you that your true self is like gold?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "The light that is cool", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["learn", "calm"], "parts": ["Bhagwan Swaminarayan taught five eternal realities: jiva (the soul), ishwar, maya, Akshar and Parabrahma (God). Akshar, also called Aksharbrahma, is second only to God and depends only on Him. Akshar has two forms. In personal form, Akshar serves God eternally in His abode and comes with Him whenever He comes to earth. In the other form, Akshar is the divine abode itself, Akshardham.", "Describing Akshar's light, Maharaj asks us to imagine a world made of pure glass, lit by countless stars each shining like the sun. Even that brilliance, he says, is nothing beside Akshar's radiance. Yet this light is cool, soothing and peaceful, not harsh. Countless universes look like tiny specks before Akshar, who is also subtler than the smallest particle.", "The essay gives a tender image of Akshar's role. A mother bathes her child, dresses it in clean, bright clothes, and presents it to the father, who holds it lovingly. So Akshar gently cleanses souls of anger, jealousy, ego and greed and presents them to God. When Maharaj came, Akshar came as Gunatitanand Swami, and the guru parampara continues that role."], "quote": "The light of infinite suns is utterly insignificant when compared to the light of Akshar.", "src": "The Infinite Glory Of Akshar", "ch": "Sadhu Anandswarupdas, 2004", "url": "https://www.swaminarayan.org/essays/2004/2210.htm", "take": "At puja today, picture the guru as a loving parent getting you ready to meet God.", "reflects": ["Can you name the five eternal realities without looking?", "What does 'a light that is cool and soothing' feel like to imagine?", "How does the image of the mother and child speak to you?", "Which quality would you most like the guru to wash away?", "How do you understand the difference between Akshar and Purushottam?", "What helps you feel close to Gunatitanand Swami?", "When have you felt 'presented to God' through satsang?", "What question about Akshar-Purushottam would you like to ask a sadhu?", "How does knowing you are atma change a hard day?", "What does Akshardham mean to you personally?"], "mins": 2, "id": "the-light-that-is-cool", "reflect": "Can you name the five eternal realities without looking?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Two chambers within", "by": "Yogiji Maharaj", "theme": "satsang", "needs": ["story", "learn"], "parts": ["The essay pictures two rooms inside every person: one where God lives, and one where our unhelpful tendencies live. Company decides which door opens. Like a tree drawing the minerals it needs from the soil, we absorb qualities from those around us. The company of a God-realised saint awakens faith and love for God, while unhealthy company awakens the other side.", "It tells of Yogiji Maharaj visiting Dhuava, near Jamnagar, to bless a devotee's new home. He promised to sanctify the devotee's farm as well. On the way to Rajkot, after about five kilometres, he insisted on going back, even though the devotee himself had forgotten. He walked across the ploughed field, patted two mango trees, and said they had been doing austerities for ten thousand years.", "The lesson: meeting a true saint is never an accident; it is grace. The essay adds that it is hard for the over-wise to walk the spiritual path, so we should come to satsang humbly, ready to learn. Having received such a gift, the essay says, we should keep the guru in our hearts while doing our work in the world."], "quote": "We have to preserve him only in our hearts.", "src": "Two Chambers Within Us… (Part 1)", "ch": "Enlightening Essays, 2011", "url": "https://www.swaminarayan.org/essays/2011/0803.htm", "take": "Notice which conversations today open the 'God room' in you, and seek one more of those.", "reflects": ["Which people help open the 'God room' inside you?", "Which influences tend to open the other door?", "What does it mean to you that meeting a saint is grace?", "How does the mango tree story make you feel?", "Where might you be 'over-wise' and need to listen more?", "How do you keep the guru in your heart during ordinary tasks?", "What company would you like more of this month?", "Who first brought you into satsang?", "What promise has someone kept to you that you did not expect?", "How could you be good company for someone else this week?"], "mins": 2, "id": "two-chambers-within", "reflect": "Which people help open the 'God room' inside you?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "A platform, not a playground", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["learn"], "parts": ["As Nilkanth Varni travelled across India, he asked five questions of the spiritual leaders he met: What is jiva? What is ishwar? What is maya? Describe Brahma. Describe Parabrahma. He was looking for true understanding. He found it at Loj, in Ramanand Swami's ashram, and later taught his own philosophy.", "It builds on Ramanujacharya's teaching but differs in key ways. Ramanujacharya spoke of three realities; Bhagwan Swaminarayan taught five eternal ones: jiva, ishwar, maya, Brahma (Akshar) and Parabrahma (Purushottam). Ramanujacharya saw creation as God's play. Bhagwan Swaminarayan taught that the universe exists for the jivas, as a platform for their liberation. And liberation can be experienced in this life, not only after it.", "The way is to identify oneself with Akshar and worship Purushottam in a spirit of servant and master. The essay stresses that this final freedom is not earned by effort alone but is given by grace. The line of gurus, from Gunatitanand Swami to Pramukh Swami Maharaj, carries this understanding forward."], "quote": "a platform from which the jivas can endeavour to get their release", "src": "Philosophy of Bhagwan Swaminarayan", "ch": "Sadhu Atmaswarupdas, 2006", "url": "https://www.swaminarayan.org/essays/2006/0803.htm", "take": "Ask yourself Nilkanth's first question, 'What is jiva?', and answer it in one sentence in your journal.", "reflects": ["How would you answer 'What is jiva?' in your own words?", "Which of the five questions do you find hardest?", "What does it mean that the world is a platform, not a playground?", "How does that change the way you see a hard season?", "What does 'liberation in this life' look like to you?", "How do you understand 'identify with Akshar, worship Purushottam'?", "What role does grace play in your spiritual life?", "Who helps you understand philosophy in a simple way?", "What would you like to study more deeply in the Vachanamrut?", "How can knowing these truths bring you calm?"], "mins": 2, "id": "a-platform-not-a-playground", "reflect": "How would you answer 'What is jiva?' in your own words?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "No good effort is wasted", "by": "Bhagwan Swaminarayan", "theme": "satsang", "needs": ["hope", "learn"], "parts": ["The Vachanamrut records Bhagwan Swaminarayan's answers to hundreds of questions from sadhus and devotees. This essay gathers a few that feel very human. Dinanath Bhatt asked about the struggle to master the mind. Maharaj said that someone who wins becomes an ekantik bhakta; and someone who loses? His efforts are not wasted. After one life, two, or many, he too will get there.", "Anandanand Swami admitted that jealousy stayed with him despite his efforts. Maharaj advised taking on the good qualities of the person you feel jealous of, or at least never harming them. On calmness, Maharaj told Muktanand Swami that when the understanding that 'I am atma, distinct from the body' becomes very firm, one does not lose composure.", "He also said the true devotee's mind rests on God, while a worldly person finds that hard. And he named the greatest practice of all: staying close, in thought, word and deed, to a Sant with true saintly qualities. The Vachanamrut, the essay says, is as relevant now as when it was spoken."], "quote": "his efforts will not have been in vain", "src": "Perennial Relevance of Vachanamrut", "ch": "Sadhu Anandswarupdas, 2005", "url": "https://www.swaminarayan.org/essays/2005/2201.htm", "take": "Write down one spiritual effort you feel you are 'failing' at, and beside it: 'Not in vain.'", "reflects": ["Which spiritual effort feels hardest for you right now?", "How does it feel to hear that no sincere effort is wasted?", "Who do you sometimes feel jealous of?", "What good quality of theirs could you learn from?", "When have you stayed calm by remembering you are atma?", "Which Vachanamrut question would you have asked Maharaj?", "What does staying close to the Sant look like for you?", "Where are you being too hard on yourself about progress?", "What does 'after one life, two, or many' make you feel?", "Which Vachanamrut would you like to read this week?"], "mins": 2, "id": "no-good-effort-is-wasted", "reflect": "Which spiritual effort feels hardest for you right now?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Gathering the feathers", "by": "Sadhu Vivekjivandas", "theme": "living", "needs": ["learn", "story"], "parts": ["Gossip happens everywhere: offices, colleges, parties, even among devotees. The essay says it can topple governments, wreck marriages and ruin careers. It names the roots: feeling inferior and wanting to feel bigger, frustration, idleness, clashes of opinion, and simple dislike of someone's habits. It also recalls how envy-driven talk once hurt Maharaj himself, when some sadhus belittled Muktanand Swami's success in a debate.", "A woman who had spread gossip asked a priest how to make amends. He told her to pluck a turkey's feathers and scatter them. She did. Then he told her to go back and gather every one. She said that was impossible. So, he said, is taking back gossip once it has spread.", "The remedies are practical. Tactfully excuse yourself when gossip starts. If you cannot leave, stay quiet and change the subject. Remember that words cannot be recalled. And use speech to praise God, devotees, colleagues and neighbours. Samuel Johnson said the habit of looking on the best side is worth a fortune."], "quote": "Use your tongue to bring life - not death.", "src": "Gossip", "ch": "Sadhu Vivekjivandas, 2001", "url": "https://www.swaminarayan.org/essays/2001/0807.htm", "take": "The next time a conversation turns to someone absent, say one good thing about them or gently change the subject.", "reflects": ["When is gossip most tempting for you?", "Which root (frustration, idleness, feeling small) do you recognise?", "How do you feel after gossip, compared with after praising someone?", "What phrase could you use to change the subject kindly?", "Have you ever been hurt by gossip? How did it feel?", "Who could you speak well of today?", "What does 'looking on the best side' mean for your week?", "How might gossip affect trust at work, especially in HR?", "What would your words 'bring life' to today?", "How could you respond if someone gossips to you about a friend?"], "mins": 2, "id": "gathering-the-feathers", "reflect": "When is gossip most tempting for you?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "The ego in every quarrel", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["learn", "calm"], "parts": ["However clever or wise we are, the essay says, families still quarrel: parents and children, spouses, in-laws, siblings. Pramukh Swami Maharaj pointed to the root: people want things their own way. Ego is at play in every quarrel. Even when we are not at fault, understanding and forgiveness keep the peace. Gunatitanand Swami taught that right understanding brings happiness, whether we are rich or poor.", "His practical remedy was ghar sabha, a family gathering each day. Even after an argument, sit together. Read satsang books, pray, share scripture stories, and talk about each person's struggles and joys. Add morning puja, mandir visits and turning the mala. Spending real time together, and speaking lovingly, helps a family stay close.", "Ghar sabha can feel repetitive, but like medicine it works with time and patience. People's natures do not change overnight. The culture of honouring parents as divine asks for tolerance and gratitude for their sacrifices, even when temperaments clash. Accepting people as they are, the essay says, dissolves many problems."], "quote": "It is the ego which is at play in all quarrels.", "src": "Cure for Family Issues", "ch": "From Pramukh Swami Maharaj's blessings, translated by Kaushik Joshi, 2010", "url": "https://www.swaminarayan.org/essays/2010/2212.htm", "take": "Suggest ten minutes of ghar sabha tonight, even just one short reading and a prayer together.", "reflects": ["When do you most want things your own way at home?", "Which family relationship feels most tender right now?", "What would a simple ghar sabha look like in your home?", "How has your family shown sacrifice for you?", "Who could you thank at home this week?", "How do you usually act after an argument?", "What does 'accepting people as they are' ask of you?", "Which small ritual could bring your family closer?", "Where might forgiveness bring more peace than being right?", "What would you like your family to feel after a ghar sabha?"], "mins": 2, "id": "the-ego-in-every-quarrel", "reflect": "When do you most want things your own way at home?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Half the work is restraint", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["learn", "calm"], "parts": ["A respected elder had done much good for society, yet his harsh way of speaking had made many opponents. Pramukh Swami Maharaj gave him personal guidance. The problem was not whether he was right or wrong; it was his manner. Swamishri advised him to consult others, keep relationships warm, and treat everyone with respect and equality. Then, he said, your boat will sail smoothly.", "Restraint in speech, Swamishri said, does half the work. Speak calmly. If you cannot do what someone asks, still give them respectful attention instead of a blunt no. He noted the difference between saying 'my father's wife' and 'mother': the facts are the same, but the words change everything. When a complaint comes, do not reject it straight away; show you have considered it.", "He advised letting go of resentment towards opponents and meeting them with friendliness. In meetings, give others half the time to speak and they will listen to you in turn. Taking someone else's advice, he said, does not make anyone small or inferior. It is a mark of greatness, and it makes our work stronger."], "quote": "By exercising restraint in one's speech half the work is accomplished.", "src": "Resolving Conflict", "ch": "Sadhu Priyadarshandas, translated by Sadhu Vivekjivandas, 2009", "url": "https://www.swaminarayan.org/essays/2009/2208.htm", "take": "In one conversation today, pause for a breath before replying, and choose the softer word.", "reflects": ["When has your tone said more than your words?", "Where could a softer word change a relationship?", "How do you say no kindly?", "What does 'my father's wife' versus 'mother' teach you?", "Who have you been holding resentment towards?", "How could you give others more space to speak?", "Whose advice have you been reluctant to take?", "How might these ideas help in an HR role?", "What complaint could you consider more carefully this week?", "What would 'your boat sailing smoothly' look like in your life?"], "mins": 2, "id": "half-the-work-is-restraint", "reflect": "When has your tone said more than your words?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "What you are in the dark", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["learn", "story"], "parts": ["The real measure of a nation, the essay says, is not its size or wealth but the character of its people. Character is the sum of our moral qualities, and has been described as what you are in the dark, when no one is watching. We may show one face in public, believe we have another, and truly have a third; our inner self always knows which is real.", "In an old story, Indra visits Prahlad and, as his gift, asks for Prahlad's character. Prahlad agrees. At once, righteousness, truth, good conduct, strength and prosperity leave with it, one by one, saying they all depend on character. A reputation of a thousand years can be decided by an hour's conduct; character is easier kept than recovered.", "In the village of Karcheliya, on a hot day of home visits, someone told Pramukh Swami Maharaj about a photo said to miraculously produce water. Wiping his own sweat, Swamishri said that water would do no good; this sweat, spent in serving people, would. His message was simple: develop good character yourself, and help build a society rich in character."], "quote": "Character is what you are in the dark", "src": "Character The Home of Happiness", "ch": "Sadhu Paramtattvadas, 2002", "url": "https://www.swaminarayan.org/essays/2002/0804.htm", "take": "Do one right thing today that no one will ever see or know about.", "reflects": ["Who are you when no one is watching?", "Which quality would you most like to be known for?", "What does Prahlad's story teach you about what matters most?", "When has keeping your word been hard but worth it?", "How does Swamishri's 'sweat, not miracles' message speak to you?", "Which small habit shapes your character most right now?", "Who do you admire for their character, not their success?", "How could good character show in a job interview?", "What would you do differently if you truly believed character is everything?", "What one right thing could you do today in private?"], "mins": 2, "id": "what-you-are-in-the-dark", "reflect": "Who are you when no one is watching?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Empty your cup", "by": "Sadhu Vivekjivandas", "theme": "living", "needs": ["learn", "story"], "parts": ["A professor visited a Zen master to learn about Zen, but spent the visit talking about his own ideas. The master poured him tea and kept pouring until it spilled over. The professor protested. The master said he was like the cup, so full of opinions that nothing new could go in. First he had to empty his cup.", "A seeker once asked a guru how long learning would take. One month, said the guru. The seeker then listed everything he already knew. In that case, one year, said the guru, because first he would have to empty the cup. Socrates said the one thing he knew was that he knew nothing, and that was the start of his wisdom.", "The essay compares the martial arts hall, where students face their fears under a master, with the mandir, where we face our inner struggles in satsang with the guru. In the Gita, Krishna asks Arjun to let go of everything else and take refuge in Him alone. Humility, the essay says, is the first rule of learning."], "quote": "The principle rule to learning and imbibing is humility and emptying oneself of all airs.", "src": "Empty Your Cup", "ch": "Sadhu Vivekjivandas, 2001", "url": "https://www.swaminarayan.org/essays/2001/2207.htm", "take": "In your next katha, class or training video, listen for one idea you have never considered before.", "reflects": ["What opinions might be filling your cup right now?", "Where would a beginner's mind help you most?", "How does it feel to admit 'I don't know'?", "What new skill are you ready to learn with an empty cup?", "Who have you learned the most from, and why?", "How can you listen in katha without mentally arguing?", "When has humility opened a door for you?", "What would Socrates' attitude look like in your job search?", "What could you let go of to make room for something better?", "How does the mandir help you face your inner struggles?"], "mins": 2, "id": "empty-your-cup", "reflect": "What opinions might be filling your cup right now?", "scan": "", "letter": false, "src_kind": "essay"}, {"title": "Only I don't understand", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["learn", "calm"], "parts": ["On Karyakar Din in Amdavad in August 2002, short scenes were acted out showing real family situations, and Pramukh Swami Maharaj answered questions on them. The first showed a father and son clashing over studies, friends and habits. Swamishri said the gap widens when parents are absorbed in work and g V.kind = p => {
