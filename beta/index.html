g about in advance at the moment?", "When has something you dreaded turned out fine?", "How do you react when plans go wrong one after another?", "What would you have felt in the car on the way to Rajkot?", "Who quietly covers for you when things go wrong?", "How could you do the same for someone else?", "What helps your mind come back to the present when it races ahead?", "What worry could you write down and set aside tonight?", "How do you imagine Pramukh Swami greeted the late attendants?", "What small mistake could you forgive yourself for today?"], "mins": 2, "id": "the-worry-that-was-not-needed", "reflect": "What are you worrying about in advance at the moment?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Do your utmost, leave the rest", "by": "Pramukh Swami Maharaj", "theme": "work", "needs": ["strength", "calm"], "parts": ["Yogiji Maharaj often spoke of Satsang spreading across the world, which to many devotees sounded like a dream. Pramukh Swami Maharaj took every word seriously and patiently built weekly assemblies abroad, some starting with only a handful of people. The effort was enormous. The book explains how he carried it: he saw himself as a servant and an instrument in God's hands. His part was to try; the results he left to God and guru.", "On his first tour abroad as guru in 1974, he worked tirelessly, spending hours consoling families newly arrived in Britain from Uganda, settling disputes large and small, and speaking twice a day. When it ended there was still much to be done, and he knew he would need to return. Yet he felt no unease about leaving. He had given everything he could, and trusted Maharaj with what remained.", "This is a freeing way to work, especially during a job search. You cannot control who replies, who is shortlisted, or when. You can control whether you tried honestly today. Do that part as fully as you can, then open your hands and let God hold the outcome, the way Swamishri did at the end of every tour."], "quote": "He had done his utmost, Maharaj would look after the rest.", "src": "In the Joy of Others", "ch": "Ch. 7, \"Neither Night, Nor Day\", pp. 87-88, 99-102", "url": "", "take": "At the end of today, name one thing you did your best at, then hand the rest to Maharaj.", "reflects": ["Which outcomes are you trying to control at the moment?", "What is fully in your hands today?", "How does it feel to think of yourself as an instrument rather than the one in charge?", "When have you done your best and still had to wait?", "What would 'leaving the rest to Maharaj' look like in practice?", "How do you usually feel after sending an application?", "What helps you let go at the end of the day?", "Who in your life models calm effort?", "What is one honest effort you can make before bedtime?", "How might your days feel if results were not your burden?"], "mins": 2, "id": "do-your-utmost-leave-the-rest", "reflect": "Which outcomes are you trying to control at the moment?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "You carry your shoes, I'll carry mine", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story"], "parts": ["In 1972 a pilgrimage train carried Pramukh Swami Maharaj, sadhus and devotees to Ayodhya. From there they set off by bus for Chhapaiya, the village where Bhagwan Swaminarayan was born. On the way, a broken bridge over a canal stopped them completely, and nobody knew what to do. Then a small, weary coal train came chugging towards Chhapaiya, and a few sadhus waved their shoulder cloths until the driver stopped.", "Swamishri called for everyone to get on, and the whole group ran for it. He hitched his dhoti above his knees, grabbed his mojdi (sandals) in one hand and ran with them. When a sadhu offered to carry his sandals, a puffing Swamishri told him to carry his own and just keep running. Later the devotees felt bad they had not given him better transport, but he did not mind; his joy lay in reaching Chhapaiya for darshan.", "On another trip in the monsoon, his tractor sank in the mud; a second and a third tractor sank too, before a fourth finally pulled it free, while he stood calmly and patiently to one side. Plans collapse and bridges break. His response was never panic, only good humour and the next practical step."], "quote": "You carry your shoes and I’ll carry mine… Just run!", "src": "In the Joy of Others", "ch": "Ch. 7, \"Neither Night, Nor Day\", pp. 89-91", "url": "", "take": "When a plan falls through today, look for the next small train, and laugh a little as you run.", "reflects": ["What plan of yours fell through recently?", "How do you usually react when things break down?", "What made Swamishri's response so light?", "When has a detour turned into a good memory?", "Who helps you laugh when things go wrong?", "What is the 'next small train' in your situation?", "How could you carry your own load without feeling alone?", "What does calm patience look like for you on a stressful day?", "What part of this story made you smile?", "How might you tell today's setback as a funny story one day?"], "mins": 2, "id": "you-carry-your-shoes-i-ll-carry-mine", "reflect": "What plan of yours fell through recently?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Bored of what?", "by": "Pramukh Swami Maharaj", "theme": "work", "needs": ["strength", "learn"], "parts": ["Pramukh Swami Maharaj's days were crowded with letters, meetings, home visits and assemblies, often running late into the night. In 1994, at a youth camp in Atlanta, a young man asked him a very honest question: didn't he ever get bored with all this work? It is a question many of us quietly ask about our own routines, especially when days feel repetitive and purpose feels far away.", "Swamishri answered at once, asking what there was to be bored of: this was why he had come. He explained that when we do something only because our own mind wants it, boredom follows. But when we act because the Satpurush (the God-realised guru) has asked, and we sincerely wish to please God, boredom never arrives. The meaning behind the work changes how the work feels.", "During the long drought of 1987 and 1988, a seventy-year-old farmer, Megha Bapa, served twelve hours a day at one of the Sanstha's cattle camps. Asked if he ever grew tired or bored, his eyes filled: if Swami never tired of his huge work, why should he tire of his small one? Ordinary tasks, offered to God, can carry that same light."], "quote": "If we sincerely desire to please God and his Sadhu then boredom never comes.", "src": "In the Joy of Others", "ch": "Ch. 7, \"Neither Night, Nor Day\", p. 99; Ch. 15, \"A Friend in Need\", p. 294", "url": "", "take": "Before a dull task today, quietly offer it to Maharaj and notice if it feels different.", "reflects": ["Which part of your day feels most repetitive?", "What would change if you offered that task to God?", "When have you done something dull that still felt meaningful?", "What purpose would you like your days to serve?", "How do you usually respond to boredom?", "Whose example, like Megha Bapa's, inspires you?", "What small task could you do today purely as seva?", "How is job searching different when you see it as part of a bigger purpose?", "What gives your day a sense of 'this is why I am here'?", "How can you tell the difference between boredom and tiredness in yourself?"], "mins": 2, "id": "bored-of-what", "reflect": "Which part of your day feels most repetitive?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Held since your forefathers", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["hope", "story"], "parts": ["In Nairobi in 1994, a devotee named Prakashbhai came to see Pramukh Swami Maharaj after breakfast. He was hoping for a photograph of Swamishri holding his hand, and asked him playfully to hold on. Swamishri replied, with a gentle smile, that they had been holding on since the days of his forefathers.", "Then, to Prakashbhai's amazement, he recited the family line from memory: Prakash, son of Navnitbhai, son of Purushottambhai, son of Prahaladbhai, then Himmatsinh, then Haribhai, whose name appears in the Bhaktachintamani, an early account of Bhagwan Swaminarayan's life. He had held that family's hand ever since. The connection had not begun with the photograph; it reached back through generations.", "In the same chapter, walking round a shrine in Sarangpur, he spotted an ordinary villager and called him by name: Vitthal, a potter who had briefly served there forty years before. You may feel you have only just reached out, or that your grip is weak. But you were being held long before you asked, and you are known by name."], "quote": "We’ve held on since the time of your forefathers,", "src": "In the Joy of Others", "ch": "Ch. 7, \"Neither Night, Nor Day\", pp. 102-103", "url": "", "take": "When you feel unsteady today, open your palm for a moment and remember: your hand is already held.", "reflects": ["Where do you feel your grip is weak at the moment?", "How does it feel to know you were held before you asked?", "Who in your family first brought you into Satsang?", "What does it mean to you to be known by name?", "When have you felt remembered by someone unexpectedly?", "How could you hold someone else's hand this week?", "What family blessings are you grateful for?", "What would you say to Swamishri if you were holding his hand now?", "How could this image help on an anxious day?", "Who might need to hear that they are not forgotten?"], "mins": 2, "id": "held-since-your-forefathers", "reflect": "Where do you feel your grip is weak at the moment?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "It is me, Pramukh Swami", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["story", "hope"], "parts": ["In the assembly hall at Bochasan, devotees were waiting near the staircase. When Pramukh Swami Maharaj came down, everyone surged forward to surround him. He moved slowly through the crowd, patting bowed heads and smiling at faces he recognised. Only one man stayed seated: Manibhai, who was blind. He could hear the excitement, but could not get up and find his way without help, so he waited patiently where he was.", "Through the crowd, Swamishri saw him and made his way across. He placed his hand lightly on Manibhai's head. Manibhai tilted his head back and asked who it was. Swamishri told him simply that it was Pramukh Swami. Manibhai could only gasp his name and say nothing more. There was no need to say anything. He had been seen, and remembered.", "There are days when you cannot push forward with everyone else, when all you can do is sit where you are and wait. This story says that is enough. The one you are waiting for can see you, and will come across the room to you. You do not have to be first in the crowd to be reached."], "quote": "He had not been forgotten.", "src": "In the Joy of Others", "ch": "Ch. 8, \"It's Me, Pramukh Swami!\", pp. 107-108", "url": "", "take": "If you cannot do much today, simply sit quietly for two minutes and let yourself be found.", "reflects": ["When have you felt unable to keep up with everyone else?", "What does it feel like to picture Swamishri crossing the room to you?", "Who in your life notices when you are left behind?", "How could you notice someone who cannot push forward?", "What does 'waiting patiently' look like for you on a heavy day?", "When have you felt seen without having to ask?", "What would you want to say if you were Manibhai?", "How can you be gentle with yourself on days you can only sit still?", "Who could you reach out to who might feel forgotten?", "What small comfort can you allow yourself today?"], "mins": 2, "id": "it-is-me-pramukh-swami", "reflect": "When have you felt unable to keep up with everyone else?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The poor man's whole offering", "by": "Pramukh Swami Maharaj", "theme": "bhakti", "needs": ["story", "learn"], "parts": ["When devotees were pledging donations for a new mandir, Pramukh Swami Maharaj met them one by one. He asked about each person's income and responsibilities, such as loans, medical bills or a daughter's wedding, and together they settled on a sensible figure. A very poor devotee stood in the line, brimming with enthusiasm, and began to promise a large sum.", "Swamishri gently asked about his situation and saw that he could not possibly manage it. He suggested a small offering, and that the rest be used to provide for his family and educate his children. The man insisted he would beg in the streets if he had to. Moved and pleased, Swamishri patted him; the devotion was already accepted. Talking quietly, he persuaded him to lower the amount a great deal, without hurting his feelings.", "The book recalls how delighted Bhagwan Swaminarayan was when the aged, poor Dubli Bhatt offered just 13 paise for the Gadhada mandir. Maharaj explained that others had given large sums but still had plenty left, while Dubli Bhatt had given everything he had. God treasures the heart behind a gift, not its size. Your small offering of time, effort or love counts in full."], "quote": "His all! You have offered considerable sums, but still have other possessions.", "src": "In the Joy of Others", "ch": "Ch. 8, \"It's Me, Pramukh Swami!\", pp. 119-120", "url": "", "take": "Offer one small thing today, a prayer, a phone call or ten minutes of help, with your whole heart.", "reflects": ["What do you feel you have to offer right now?", "When have you felt your contribution was too small to matter?", "How does Dubli Bhatt's story change that feeling?", "What small offering could you make with your whole heart today?", "Why do you think Swamishri cared about the man's family as well as his devotion?", "Where could you give time or attention rather than money?", "Who has given you something small that meant a great deal?", "How can you honour the effort behind other people's gifts?", "What does sincerity look like in your daily puja?", "How might you value your own efforts more generously?"], "mins": 3, "id": "the-poor-man-s-whole-offering", "reflect": "What do you feel you have to offer right now?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Thirty minutes of anger, then dinner", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["calm", "story"], "parts": ["In July 1985, twenty thousand people gathered in a London football stadium to honour Pramukh Swami Maharaj. Uncomfortable with the fuss, he spent his speech giving all credit to Bhagwan Swaminarayan and his gurus. That same night, at the house where he was staying, a middle-aged man asked to see him privately. Once inside, the man began shouting, worked himself into a fury, and poured out abuse and threats.", "An attendant sadhu tried to have him removed. Swamishri stopped him, and quietly bore it all for a full thirty minutes, offering no argument and no defence. When the man finally left, spent and exhausted, Swamishri asked a sadhu to make sure he was given a meal before he went. Then he calmly picked up his pen and went back to answering letters.", "The Bhagavad Gita describes a sthitapragna, someone who stays steady through both praise and insult. Within a few hours Swamishri received both, and neither shook him. Staying calm with an angry person is not weakness. Caring for someone even as they lash out is a strength most of us can only grow towards, one small moment at a time."], "quote": "Serve this man dinner, make sure he doesn’t leave hungry.", "src": "In the Joy of Others", "ch": "Ch. 9, \"Panch Vartman\", pp. 152-154", "url": "", "take": "If someone speaks sharply to you today, take one slow breath before you reply.", "reflects": ["How do you usually react when someone is angry with you?", "What helps you stay steady when you feel attacked?", "When have you been both praised and criticised in a short space of time?", "What do you think the angry man felt when he left?", "How could you respond more calmly in a family argument?", "What does 'steady in praise and insult' mean to you?", "Who in your life shows this kind of calm?", "What is one breathing habit that settles you?", "How can you be kind to yourself after a hurtful conversation?", "What small step towards calm could you practise this week?"], "mins": 2, "id": "thirty-minutes-of-anger-then-dinner", "reflect": "How do you usually react when someone is angry with you?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The ease of saying sorry", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["learn", "story"], "parts": ["After a large pilgrimage to the Himalayas, Pramukh Swami Maharaj received an angry letter from a man in London. His family had travelled on the same dates and struggled to find rooms. He accused Swamishri of being selfish and said the group had spoilt their holiday. In fact the trip had been carefully planned months ahead, and the clash was pure coincidence. Swamishri was in no way to blame.", "Still, he wrote back with an apology. He said he was sorry for any inconvenience, that causing them distress had never been the intention, and that had the family told them at the time, rooms would gladly have been arranged. He did not defend himself or explain the planning. His apology was not an admission of guilt; it was a way of caring about how they felt.", "Another time in New York, a seven-year-old named Yogi was speaking to him when Swamishri turned aside to talk with a sadhu. Yogi sat down, upset that nobody was listening. Swamishri apologised at once, admitted he had made a mistake, and asked the boy to stand and begin again. Whether at fault or not, a sincere sorry costs little and mends much."], "quote": "It was not our intention to cause you distress.", "src": "In the Joy of Others", "ch": "Ch. 9, \"Panch Vartman\", pp. 155-156, 168", "url": "", "take": "If someone is upset today, try 'I'm sorry that was hard for you' before explaining anything.", "reflects": ["Is there an apology you have been putting off?", "How do you feel when someone apologises to you simply and warmly?", "What is the difference between saying sorry and blaming yourself?", "Why do you think Swamishri did not explain the careful planning?", "How did young Yogi probably feel when Swamishri said sorry?", "When have you felt unheard, like Yogi?", "How could you listen more fully to someone this week?", "What makes an apology sincere to you?", "Who could you ask to 'begin again' in a conversation?", "How can you apologise without piling guilt on yourself?"], "mins": 2, "id": "the-ease-of-saying-sorry", "reflect": "Is there an apology you have been putting off?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "You know, and I do not", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["story", "learn"], "parts": ["In Gondal, Pramukh Swami Maharaj was describing Satsang as joining one's hands humbly before the guru and following his guidance. Krishna Pandya, an old devotee who often joked with him, called out that he could manage the humble part. Swamishri teased back that the second part was harder: when the guru asks something, the mind gets upset. Except that he meant the English word 'upset', and it came out as 'except'.", "As he tried again, a little boy piped up with the right word. Swamishri turned to the assembly, delighted, and praised the boy for speaking correctly. Then he told the child, with a smile, that the boy knew and he did not, because he had not studied as far. He was pleased the boy knew English, and not the least bit bothered at being corrected in front of everyone.", "Being corrected can feel exposing, especially when you are already anxious about how you come across. Here a guru revered around the world was corrected by a small child in public, and his response was warmth and praise. Mistakes in front of others do not have to be humiliating. They can be a chance to lift someone else up."], "quote": "You know whilst I do not know.", "src": "In the Joy of Others", "ch": "Ch. 9, \"Panch Vartman\", pp. 167-168", "url": "", "take": "When someone corrects you today, try saying 'Thank you, you're right' and notice how it feels.", "reflects": ["How do you usually feel when someone corrects you?", "What stood out to you about Swamishri's response?", "When have you been embarrassed by a small mistake in public?", "How could you turn a correction into a moment of warmth?", "Who could you praise for knowing something you do not?", "What would it feel like to say 'you know, and I do not'?", "How does humour help when you make a mistake?", "What are you still learning that you could admit openly?", "How might this attitude help in a job interview?", "Who taught you something recently, and have you thanked them?"], "mins": 2, "id": "you-know-and-i-do-not", "reflect": "How do you usually feel when someone corrects you?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "No need to rush around", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["calm", "story"], "parts": ["In Hong Kong, Pramukh Swami Maharaj watched his attendant scurrying from room to room in a devotee's house, hunting for a cushion so that Swamishri would have a proper seat for lunch. Eventually he found one and invited him to sit. Afterwards Swamishri gently told him not to worry next time. There was no need to send others rushing about just for a seat; he would happily sit on the floor, as he had all his life.", "In 1971 a devotee in Mumbai, Kishorbhai Dave, invited Swamishri to bless his new flat before the family moved in. Swamishri arrived on time, but they were not ready. The mattresses were down, the sheets were not. Kishorbhai ran about trying to do everything at once. Without a word, Swamishri began laying the sheets on the mattresses himself, leaving Kishorbhai embarrassed and deeply touched.", "Anxiety often tells us that everything must be perfect before we are acceptable. These stories say otherwise. The people we most want to please are often not asking for perfection at all. When things are unfinished or you feel behind, it may be enough to slow down, breathe, and let someone help you lay the sheets."], "quote": "There’s no need to rush others around just for a seat.", "src": "In the Joy of Others", "ch": "Ch. 9, \"Panch Vartman\", pp. 165, 168-169", "url": "", "take": "Leave one thing slightly imperfect today on purpose, and notice that all is still well.", "reflects": ["Where do you feel everything must be perfect before others see it?", "How do you feel when you are caught unprepared?", "What do you think Kishorbhai felt when Swamishri laid the sheets?", "Who in your life is happy to help rather than judge?", "What could you let be 'good enough' this week?", "How does rushing affect your mood?", "What would slowing down look like in your morning?", "When have you been relieved that someone did not mind a mess?", "How can you put a flustered person at ease?", "What would you like to tell yourself when you feel behind?"], "mins": 2, "id": "no-need-to-rush-around", "reflect": "Where do you feel everything must be perfect before others see it?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Not my burden but God's", "by": "Pramukh Swami Maharaj", "theme": "faith", "needs": ["calm", "learn"], "parts": ["In London in 1994, a teenager asked Pramukh Swami Maharaj how he stayed so fresh amid so much activity. His answer was unusually personal. Whatever he did, he said, he did because he had been asked to by his gurus. The responsibilities belonged to God, not to him. And while he served, he kept remembering the murti (sacred form) of Maharaj and Swami.", "In Houston, a devotee asked how he remained free of ego when sadhus praised him in assemblies. He replied that whatever happens is due to God's grace, and ego only creeps in when we feel that we are doing it all. When asked how often that awareness of God's grace came to him, he answered humbly that it never left him.", "This can be a real relief for an anxious mind. We are asked to do our part sincerely, but we are not asked to carry the whole world on our shoulders. When the weight of a task, a search or a decision feels crushing, you can quietly hand the load back to the one it truly belongs to, and simply do the next thing."], "quote": "The responsibilities are not my burden but God’s.", "src": "In the Joy of Others", "ch": "Ch. 9, \"Panch Vartman\", p. 169; Ch. 10, \"God First\", p. 176", "url": "", "take": "When a task feels heavy today, say 'This is Yours, Maharaj; I will do my part' and begin.", "reflects": ["What responsibility feels heaviest to you right now?", "How would it feel to hand that weight back to God?", "What is 'your part' in that situation?", "When do you notice the feeling 'I have to do it all'?", "How might remembering Maharaj while you work change your mood?", "When has something worked out that you could not have managed alone?", "How could you remember God's grace during a busy day?", "What would you stop worrying about if you trusted God as the doer?", "How does this teaching sit with your own sense of effort?", "What is the next small thing you can do, and leave the rest?"], "mins": 2, "id": "not-my-burden-but-god-s", "reflect": "What responsibility feels heaviest to you right now?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Remembering him all day", "by": "Pramukh Swami Maharaj", "theme": "bhakti", "needs": ["learn", "calm"], "parts": ["A devotee in Bochasan once asked Pramukh Swami Maharaj an innocent question. All day long he patiently met people and listened to their troubles, so when did he find time for bhakti (devotion)? Swamishri laughed. He said he did bhakti without a break: every moment he thought of Maharaj and Swami, and alongside that he served people, because he had come to ease the distress of those who were unhappy.", "The devotee had thought of devotion as something done at set times, such as arti, puja or turning the mala (rosary). He learned that the deepest devotion is an unbroken closeness to God that runs quietly beneath everything else. When someone else asked how he managed to remember Harikrishna Maharaj all day, Swamishri said it was because God takes such care of us; how could we not remember him?", "That turns the usual pressure around. Remembering God is not another task to squeeze into a crowded day, but a natural response to being cared for. You can remember him while sending an application, helping at home or walking to the shops. A single thought of gratitude in the middle of an ordinary moment is already bhakti."], "quote": "He takes so much care of us, how can we not remember him?", "src": "In the Joy of Others", "ch": "Ch. 10, \"God First\", pp. 177, 191", "url": "", "take": "Set a gentle reminder three times today to think: 'He takes care of me.'", "reflects": ["When in your day do you feel closest to God?", "What ordinary task could become a moment of remembrance?", "How has God cared for you this week?", "Do you think of bhakti as something only done at set times?", "What helps you return your thoughts to Maharaj?", "How might serving others be a form of devotion for you?", "What would an unbroken sense of closeness feel like?", "When do you most easily forget God, and why?", "What small reminder could you place where you will see it?", "How does it feel to think of remembrance as gratitude rather than duty?"], "mins": 2, "id": "remembering-him-all-day", "reflect": "When in your day do you feel closest to God?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Show it to Thakorji first", "by": "Pramukh Swami Maharaj", "theme": "bhakti", "needs": ["calm", "learn"], "parts": ["In Kisumu, Kenya, Pramukh Swami Maharaj visited a doctor's surgery for a vaccination. The doctor handed him a pill to take beforehand. Swamishri immediately asked that it first be shown to Thakorji, meaning Harikrishna Maharaj, the murti of God he always kept close. The pill was held before the murti for a few moments, and then, quite naturally, he swallowed it.", "The doctor knew that everything Swamishri ate was first offered to God, and had heard that even new shoes and glasses were shown to Thakorji. But medicine was new to him. After his cataract operations in Boston, Swamishri did the same with his new spectacles: he had them presented to Thakorji, then asked for the murti to be brought, so that his first sight through the new lenses was darshan of the Lord.", "It is a lovely, simple practice. It does not replace doctors or treatment; Swamishri took his medicine and wore his glasses. It invites God into the ordinary business of looking after ourselves. Tablets, appointments and fresh starts can all be shown to Thakorji first, and received back as something blessed."], "quote": "Show it to Thakorji first,", "src": "In the Joy of Others", "ch": "Ch. 10, \"God First\", pp. 181, 184", "url": "", "take": "Before taking your tablets today, hold them before Thakorji for a moment, then take them as usual.", "reflects": ["What everyday things could you show to Thakorji first?", "How might this practice change how an appointment feels?", "What new start in your life would you like to offer to God?", "How does it feel to think of treatment as something blessed?", "What did you notice about how natural Swamishri was about this?", "Which daily routine could include a moment of offering?", "How do you feel about looking after yourself as a form of devotion?", "What would you like your first 'darshan' of each day to be?", "Who helps you take care of yourself, and how can you thank them?", "What small ritual brings you calm?"], "mins": 2, "id": "show-it-to-thakorji-first", "reflect": "What everyday things could you show to Thakorji first?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Darshan from a hospital bed", "by": "Pramukh Swami Maharaj", "theme": "bhakti", "needs": ["calm", "hope"], "parts": ["In April 1986, surgeons in Mumbai removed a large growth from Pramukh Swami Maharaj's thigh; tests had already shown it was harmless. As he came round, still drowsy, someone slipped his glasses on and another held up what had been removed. Swamishri was not interested. His first question was where Maharaj was. When Harikrishna Maharaj was brought to him, he folded his hands in prayer.", "The doctors and attendants urged him to rest and withdrew to a corner. He tried to sleep but could not. Instead, for about twenty minutes, they watched him fold his hands, speak softly, listen and smile. Days later the sadhus asked what he had been doing. He admitted he had been having darshan of the murtis in all their mandirs: Sarangpur, Gadhada, Gondal, Ahmedabad and more.", "He could not travel, so he travelled inwardly. Worship held in the mind and heart like this is known as mansi puja. On days when you cannot get to the mandir, when you are tired, unwell or simply stuck at home, you can still close your eyes and visit each shrine you love, one by one, from wherever you are."], "quote": "I was doing darshan of the murtis in all our mandirs.", "src": "In the Joy of Others", "ch": "Ch. 10, \"God First\", pp. 189-190; Ch. 16, \"Spiritual Teachings Made Simple\", pp. 306-307", "url": "", "take": "Tonight, close your eyes and visit one mandir in your mind, murti by murti.", "reflects": ["Which mandir would you most like to visit in your mind tonight?", "How could mansi puja help on days you cannot go out?", "What was Swamishri's first thought on waking, and what is yours?", "How does it feel to know darshan is possible from anywhere?", "Which murti do you picture most clearly?", "When have you felt close to God while unwell or tired?", "What would you say to Maharaj during your inward darshan?", "How might this practice help you fall asleep?", "Who could you share this practice with?", "What does it mean to you that God can be visited in the heart?"], "mins": 2, "id": "darshan-from-a-hospital-bed", "reflect": "Which mandir would you most like to visit in your mind tonight?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Then you do believe in God", "by": "Pramukh Swami Maharaj", "theme": "faith", "needs": ["story", "learn"], "parts": ["In Bochasan a father brought his teenage son to Pramukh Swami Maharaj with a complaint: the boy did not believe in God. The teenager had not wanted to come at all; his parents had almost dragged him from the house. He stood silently, bracing himself for a telling-off. Swamishri was not shocked in the slightest. Many people, after all, do not believe in God.", "Instead he asked a few simple questions. Did the boy live an ethical life? Yes. Did he do wrong? No. Any addictions, meat or alcohol? No. Then, Swamishri concluded warmly, he did believe in God. He added that just as we keep some rules out of respect for the law or community, we can live knowing God sees us, and that trusting God as the doer brings strength and courage.", "The teenager bowed his head for a pat of blessing, feeling that here was someone who truly understood him. Faith is not always loud or certain. Sometimes it is already there, quietly, in how you try to live. If your faith feels thin on a heavy day, look at your choices; they may be believing more than you realise."], "quote": "Then you do believe in God!", "src": "In the Joy of Others", "ch": "Ch. 11, \"With Satsangis\", pp. 194-195", "url": "", "take": "List three good choices you made this week, and see them as quiet acts of faith.", "reflects": ["When does your faith feel thin?", "Which of your everyday choices show what you believe?", "How do you think the teenager felt when he was not scolded?", "Who in your life understands you without judging?", "What gives you strength and courage when you feel unsure?", "How could you respond kindly to someone who doubts?", "What does 'God sees me' mean to you in a comforting way?", "When have you acted from faith without calling it that?", "How do you like to be spoken to when you are struggling?", "What quiet sign of faith do you notice in yourself today?"], "mins": 2, "id": "then-you-do-believe-in-god", "reflect": "When does your faith feel thin?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "When faith and results do not match", "by": "Pramukh Swami Maharaj", "theme": "work", "needs": ["hope", "strength"], "parts": ["In Los Angeles a young man came to Pramukh Swami Maharaj feeling depressed and frustrated. He had been in Satsang for years and kept all the niyams (the disciplines of devotee life), yet had found no success in business or in jobs. He admitted he was beginning to lose faith in religion itself. Swamishri put down the letter he was writing and leaned forward in concern.", "There was no need to lose faith, he said. Krishna himself was with the Pandava brothers, and still hardship came to them. Dada Khachar, one of Bhagwan Swaminarayan's dearest devotees, had a land dispute that only the king of Bhavnagar could settle. Each time he went, Maharaj blessed him, yet it was not resolved in Maharaj's lifetime. Through it all, Dada never lost his faith or his love.", "Swamishri told the young man not to become sad, and not to lose hope, but to pray to God and try his best. Faith is not a contract promising quick results. It is a relationship that keeps you company while you keep trying. A long wait for a job, or for anything, does not mean you have been forgotten."], "quote": "don’t lose hope. Pray to God and try your best", "src": "In the Joy of Others", "ch": "Ch. 11, \"With Satsangis\", pp. 210-211", "url": "", "take": "Today, pray one honest line about your job search, then do one practical thing towards it.", "reflects": ["Where do you feel your efforts are not being rewarded?", "How has this affected your faith, honestly?", "What does Dada Khachar's patience teach you?", "How can faith keep you company rather than feel like a test?", "What is one prayer you could say about your job search?", "What is one practical step you could take alongside it?", "Who could you talk to when you feel like giving up?", "When has a long wait eventually led somewhere good?", "How would you encourage a friend in the same position?", "What small hope can you hold onto this week?"], "mins": 2, "id": "when-faith-and-results-do-not-match", "reflect": "Where do you feel your efforts are not being rewarded?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Peace because you came", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["hope", "story"], "parts": ["After a misunderstanding, a young man felt so hurt that he stopped coming to Satsang altogether. He said he wanted nothing more to do with the mandir, the sadhus or the devotees, and that no one there deserved his respect. His father came to Pramukh Swami Maharaj close to tears. Swamishri did not criticise the son at all. Instead, he spoke warmly of him and praised him.", "The father went home and repeated those kind words. They softened the young man, and the next day he came to see Swamishri and broke down crying in his lap. Stroking his head, Swamishri told him not to be so upset, because seeing him unhappy made Swamishri unhappy too. He asked him to try to let the incident go, reminded him that Satsang is family, and said to come straight to him if anything like this happened again.", "Then he said something remarkable: he felt so much peace that day, simply because the young man had come. Ever since hearing about him, Swamishri had been anxious. When we pull away after being hurt, we can imagine no one notices. This story says the opposite. Someone is waiting, not to judge, but to welcome you home."], "quote": "I feel so much peace today because you came…", "src": "In the Joy of Others", "ch": "Ch. 11, \"With Satsangis\", pp. 211-212", "url": "", "take": "If you have drifted from someone or somewhere, send one small message today.", "reflects": ["Is there a place or person you have drifted from after being hurt?", "How do you think the young man felt when he heard Swamishri's kind words?", "Who might be quietly waiting for you to come back?", "What makes it hard to return after a misunderstanding?", "How could you speak kindly of someone who has pulled away?", "What does 'Satsang is family' mean to you?", "When have you been welcomed back without being judged?", "Who could you go to directly if you felt hurt again?", "What would it feel like to know your presence brings someone peace?", "What small step back towards connection could you take?"], "mins": 2, "id": "peace-because-you-came", "reflect": "Is there a place or person you have drifted from after being hurt?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Once you start, strength follows", "by": "Pramukh Swami Maharaj", "theme": "work", "needs": ["strength", "learn"], "parts": ["At a student hostel in Vidyanagar, a young man named Sandeep told Pramukh Swami Maharaj that he hesitated to apply the tilak-chandlo, the sacred mark devotees put on the forehead during morning puja. Nobody was stopping him. He simply felt he ought to wait until he had improved himself and was living the disciplines properly. Only then would he feel worthy to wear it.", "Swamishri turned this round. His life would become ordered, he said, when he started wearing the tilak-chandlo, and once he began he would find the inner strength to keep going. The practice was not a prize for being perfect; it was a tool for becoming steadier. Elsewhere he compared a new routine to a young ox learning to wear a yoke: awkward at first, then natural once its neck grows strong.", "He applied the same image to daily puja, reading and visiting the mandir: hard for a newcomer, but after a while it all comes naturally and the mind grows stable. If you are waiting to feel ready before beginning a routine, you may wait a long time. Begin small today. The strength tends to arrive after the first step, not before."], "quote": "Once you start you will gain the mental strength to continue.", "src": "In the Joy of Others", "ch": "Ch. 11, \"With Satsangis\", pp. 214-215; Ch. 16, \"Spiritual Teachings Made Simple\", pp. 304-305", "url": "", "take": "Choose one part of your morning routine and do it today, even if you do not feel ready.", "reflects": ["What are you waiting to feel ready for?", "Which small habit would you like to start this week?", "How does it feel to hear that strength comes after starting?", "What routine once felt awkward but now feels natural?", "What is the smallest possible version of your new habit?", "How could daily puja help your mind feel steadier?", "What would you say to a friend who felt unworthy to begin?", "When during the day would a new habit fit most easily?", "How can you be patient while a habit is still new?", "Who could encourage you to keep going for the first few weeks?"], "mins": 3, "id": "once-you-start-strength-follows", "reflect": "What are you waiting to feel ready for?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Even if you do not write", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["hope", "story"], "parts": ["When a young engineer, Mitesh Patel, moved to America at his relatives' urging, Pramukh Swami Maharaj asked him to write every month. Then he added a promise: even if Mitesh did not write, Swamishri would still write to him. He kept that promise. For nearly three years he sent regular letters, some more than twenty pages long, full of guidance from the Vachanamrut and stories of great devotees.", "One letter speaks straight to anyone far from home and struggling. The surroundings may be tempting, he wrote, so take care. If difficulties come, do not lose heart, but be mindful not to repeat the same mistake. Do not give in; be bold and speak words of courage. If one is steadfast, God will surely help. And he added that they had prayed for Mitesh from where they were.", "When life is heavy, it is easy to stop writing: to stop praying, calling or showing up. This story says the connection does not depend on you holding up your end perfectly. Someone keeps writing anyway, and keeps praying for you from where they are. When you are ready, even a few words back are enough to pick up the thread."], "quote": "Even if you don’t write, I’ll still write to you.", "src": "In the Joy of Others", "ch": "Ch. 11, \"With Satsangis\", pp. 216-218", "url": "", "take": "Write a short prayer or note to Swamishri today, even just one line.", "reflects": ["Where have you 'stopped writing' lately, in prayer or friendship?", "How does it feel to know someone keeps writing anyway?", "What would you write back today, in one line?", "Who prays for you, even from far away?", "What difficulty are you facing where you need courage?", "How could you avoid repeating a mistake without punishing yourself?", "What does being steadfast look like for you this week?", "Who could you write to who might need encouragement?", "When have you felt far from home, and what helped?", "What words of courage could you say to yourself today?"], "mins": 2, "id": "even-if-you-do-not-write", "reflect": "Where have you 'stopped writing' lately, in prayer or friendship?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The bench that collapsed", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story"], "parts": ["In Ukai, an engineer at the great dam invited Pramukh Swami Maharaj to stay at his home and gathered colleagues for a small evening assembly. Swamishri sat in the middle of a broad bench, with Dr Swami and Mahant Swami on either side. When another sadhu arrived a little late, Mahant Swami insisted he squeeze onto the bench as well, and everyone shuffled along to make room.", "With that, the bench gave way. Swamishri and the two senior sadhus flipped over backwards, heads down and feet in the air. The horrified engineers rushed to help him up, and found him laughing uncontrollably. The serious business of satsang had been in full flow, and then, whoosh, a backward somersault. His sense of humour saved the day.", "Nearly twenty years later, at a convention outside Mumbai, a sadhu retold the story on stage. Swamishri, busy writing letters, burst out laughing, leaned back and raised his arms and legs to show everyone exactly how he had fallen. Embarrassing moments can become the stories we laugh about most, if we let them."], "quote": "He was laughing uncontrollably! He found the whole accident hilarious.", "src": "In the Joy of Others", "ch": "Ch. 12, \"Laugh and Make Play\", pp. 223-224", "url": "", "take": "Think of one embarrassing moment from your past and let yourself smile at it today.", "reflects": ["What embarrassing moment still makes you cringe?", "Could you imagine laughing about it one day, as Swamishri did?", "How does humour change a difficult situation?", "Who in your life helps you laugh at yourself kindly?", "What did you enjoy most about this story?", "How do you usually react when something goes comically wrong?", "When did you last laugh until you could not stop?", "How could you bring more lightness into a serious day?", "What would change if you treated small accidents as funny rather than shameful?", "Who could you share a funny memory with this week?"], "mins": 2, "id": "the-bench-that-collapsed", "reflect": "What embarrassing moment still makes you cringe?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Seventeen beginnings", "by": "Yogiji Maharaj", "theme": "work", "needs": ["strength", "story"], "parts": ["The youth assembly in Ahmedabad has an unusual record: it was launched seventeen times before it finally took root. Over several years, Yogiji Maharaj would appoint a committee, show them how to run the weekly gathering, encourage and bless the young people, and move on. Within a couple of weeks he would hear it had stopped. On his next visit he simply started again.", "Sixteen times it fell apart, and the book says he watched it happen with great patience. By the mid-1980s, the Ahmedabad youth assembly had become one of the most active anywhere, with hundreds of young people filling the mandir hall. Pramukh Swami Maharaj carried on the same encouragement, and by the great festivals of 1981 and 1992, many thousands of young volunteers were serving.", "A job search can feel like the Ahmedabad assembly: you start, it fizzles out, you start again. That does not mean you are failing. You may simply be on beginning number six, or eleven, or sixteen. Yogiji Maharaj's patience suggests that no fresh start is wasted. Each one is part of how something lasting is built."], "quote": "It had the distinction of being inaugurated seventeen times", "src": "In the Joy of Others", "ch": "Ch. 12, \"Laugh and Make Play\", pp. 224-225", "url": "", "take": "If something has fizzled out, restart it today in the smallest possible way.", "reflects": ["What have you started more than once?", "How do you feel about restarting something that stopped?", "What does Yogiji Maharaj's patience teach you?", "Which beginning number do you think you are on in your job search?", "What small restart could you make today?", "Who encourages you when things fizzle out?", "How could you be patient with a plan that keeps stalling?", "What might be slowly taking root that you cannot see yet?", "How would you encourage a friend on their tenth attempt?", "What would it mean to see each fresh start as progress?"], "mins": 2, "id": "seventeen-beginnings", "reflect": "What have you started more than once?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Laughing all the way to Akshardham", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "hope"], "parts": ["One evening in Mumbai, Pramukh Swami Maharaj took the small lift up to his fifth-floor room while the sadhus ran up the stairs. As the lift passed the third floor, they made loud chugging train noises and called out like station vendors. Upstairs they lined up as carriages, each holding the shoulder cloth of the one in front. Stepping out, Swamishri understood the game at once and became the engine.", "He cheerfully appointed one sadhu to be the guard's van at the very back, and chugged off towards his room like a grandfather playing with his grandchildren. At his door he announced that the station had arrived and all carriages should separate. The sadhus were still giggling when he said, with a wave, that laughing and joking like this they would all surely reach Akshardham, the divine abode.", "Another evening, a sadhu sat down right in his walking path to make him stop. Swamishri walked straight up to him, laughing, and leapfrogged clean over his head. He once said that once you have met God and his Sadhu, there is nothing left to do but laugh. Joy is not a distraction from spiritual life. It can be the very road."], "quote": "Happy and jesting in this way we’ll all surely get to Akshardham.", "src": "In the Joy of Others", "ch": "Ch. 12, \"Laugh and Make Play\", pp. 225-229", "url": "", "take": "Find one small reason to laugh with someone today, and let it count as devotion.", "reflects": ["When did you last play or be silly with people you love?", "How does it feel to think of joy as part of spiritual life?", "What part of this story made you smile most?", "Who brings out the playful side of you?", "How might laughter help on a heavy day?", "What stops you from being light-hearted sometimes?", "What simple game or joke could you share this week?", "How could you make someone else laugh today?", "What does it mean to you to be happy on the way to Akshardham?", "When have you felt closest to others through laughter?"], "mins": 2, "id": "laughing-all-the-way-to-akshardham", "reflect": "When did you last play or be silly with people you love?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Your genuine feelings are enough", "by": "Pramukh Swami Maharaj", "theme": "living", "needs": ["story", "calm"], "parts": ["In 1991 a large Cultural Festival of India was held in Edison, New Jersey. Crowds of visitors parked in the surrounding streets, and some local residents grew angry, organised opposition and even printed their protest in a local newspaper. After the festival, a neighbour named Jim came to see Pramukh Swami Maharaj on behalf of the neighbourhood.", "He apologised sincerely. They had come to love the festival and realised they had been wrong to cause such an uproar. They had even sent an official apology to the newspaper, he said, but it had not been printed, and he was truly sorry. Swamishri listened calmly and told him it did not matter whether the paper printed it or not. His sincere feelings were enough. God would be pleased, and Jim would find peace.", "Swamishri did not ask for a public correction, or make Jim prove his regret. He received the apology as it was offered and let it be complete. When someone says sorry to you, you can do the same. And when you apologise and the world does not notice, remember that a sincere heart has already been seen."], "quote": "Your genuine feelings are enough for us.", "src": "In the Joy of Others", "ch": "Ch. 13, \"A Leader\", pp. 240-241", "url": "", "take": "If an apology is waiting to be accepted, receive it fully today, without needing more.", "reflects": ["Is there an apology you have not fully accepted?", "How do you feel when your sorry goes unnoticed?", "What does it mean to let an apology be complete?", "Why do you think Swamishri did not need a public correction?", "When have you changed your mind about someone you once opposed?", "How could you make it easier for others to apologise to you?", "What would peace look like in a relationship that has been strained?", "How can you trust that sincere feelings are seen by God?", "What grudge could you gently set down this week?", "How would you like to be treated when you admit you were wrong?"], "mins": 2, "id": "your-genuine-feelings-are-enough", "reflect": "Is there an apology you have not fully accepted?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "When a door closes", "by": "Pramukh Swami Maharaj", "theme": "faith", "needs": ["hope", "story"], "parts": ["The London Satsang community bought good land in Harrow to build a traditional mandir. After years of effort with the local authorities, permission was finally refused. Devotees were crushed, and for many the setback felt unbearable. The book notes that the person with most to lose was Pramukh Swami Maharaj himself. Yet when the news reached him by telephone, he stayed calm and composed.", "To stop the devotees sinking into dejection, he immediately wrote them a nine-page letter. This had been the way since Maharaj's time, he explained: whatever God does is for our good. He described such moments as a test of faith and understanding, through which Maharaj makes us spiritually strong. Everything would turn out for the best, he assured them, so they must not lose heart.", "Those words may have been hard to accept at the time. But in August 1995, a beautiful traditional stone mandir opened in Neasden, London. A no in one place became a far greater yes in another. When an application is rejected or a plan falls through, it is not the end of the story; it may simply be a turn in the road."], "quote": "Whatever he does will turn out for the best… Therefore don’t lose heart.", "src": "In the Joy of Others", "ch": "Ch. 13, \"A Leader\", pp. 243-244", "url": "", "take": "After any rejection this week, write 'This is not the end of the story', and rest.", "reflects": ["What recent 'no' is still weighing on you?", "How did you feel reading that Harrow became Neasden?", "When has a closed door led you somewhere better?", "What helps you stay calm when news is disappointing?", "How could you encourage someone else after a rejection?", "What does 'everything will turn out for the best' mean to you today?", "Who writes you words of hope when you need them?", "How can you care for yourself on the day a rejection arrives?", "What might be growing that you cannot see yet?", "What would you like to tell yourself about the next door?"], "mins": 2, "id": "when-a-door-closes", "reflect": "What recent 'no' is still weighing on you?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Bring your certificates tomorrow", "by": "Pramukh Swami Maharaj", "theme": "work", "needs": ["hope", "story"], "parts": ["While recovering from surgery at a devotee's home in Mumbai, Pramukh Swami Maharaj met a young labourer from Uttar Pradesh who had just delivered a basket of mangoes. Swamishri asked his name and what he did for a living. He carried baskets for a fruit merchant, he said, earning ten rupees a basket and rarely more than two deliveries a day. His clothes were worn and his parents were poor.", "Swamishri asked whether he had studied. The young man said he had a qualification in homeopathic medicine, and had saved a little here and there to pay for the degree. But he had no money to open a dispensary, and after six months in the city he felt there was no one as unhappy as him. Tears welled in his eyes as he spoke.", "Swamishri at once asked a sadhu to have devotee doctors find him work dispensing medicine, and told the young man to come back the next evening with his certificates. That same evening he personally asked the doctors to help. Being qualified but stuck is a painful place to be. One conversation, and one person willing to ask on your behalf, can change the direction of a search."], "quote": "Come here tomorrow evening with your certificates.", "src": "In the Joy of Others", "ch": "Ch. 14, \"Bettering People, Bettering Society\", pp. 254-255", "url": "", "take": "Get your certificates and CV ready today, as if someone has asked to see them tomorrow.", "reflects": ["How do you feel about your own qualifications right now?", "When have you felt stuck despite doing everything right?", "Who could you tell honestly about your job search?", "Who might be willing to ask on your behalf?", "What would you want someone to notice about you?", "How did Swamishri's questions help the young man open up?", "What practical step could you take with your CV this week?", "How might you help someone else who feels stuck?", "What does it feel like to imagine being asked to bring your certificates?", "What small hope can you carry into tomorrow?"], "mins": 2, "id": "bring-your-certificates-tomorrow", "reflect": "How do you feel about your own qualifications right now?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Sit in the bhajan", "by": "Pramukh Swami Maharaj", "theme": "bhakti", "needs": ["calm"], "parts": ["In the village of Sankari, Pramukh Swami Maharaj noticed several poor ploughmen sitting on a garden wall, chatting and smoking. Instead of passing by, he stopped to talk with them. He invited them to come to the mandir every day for darshan. The mandir was not only for the wealthier landowning families, he told them, but for them too, and he would be disappointed if others benefited while they did not.", "He asked nothing of them but a few moments. If they sat for a little while in the mandir and joined the bhajan (devotional singing), he said, their weariness would lift. He was not asking for their money. In his eyes, simply coming to the mandir and joining their hands in prayer was worth as much as a gift of lakhs of rupees.", "When you feel you have little to offer, or wonder whether you really belong, remember this invitation. The mandir is yours too. You do not need to arrive with anything but yourself. A few minutes of sitting, singing or listening can rest a weary heart, and your folded hands are treasured."], "quote": "sit in the bhajan and your weariness will go.", "src": "In the Joy of Others", "ch": "Ch. 14, \"Bettering People, Bettering Society\", pp. 274-275", "url": "", "take": "Put on one bhajan today and simply sit with it, hands folded, for its full length.", "reflects": ["Do you ever feel you do not quite belong at the mandir?", "How does it feel to hear 'the mandir is yours too'?", "Which bhajan rests your heart most?", "When did you last simply sit and listen, without doing anything else?", "What weariness would you like to lay down today?", "How could a few minutes in the mandir fit into your week?", "What does it mean that folded hands are treasured?", "Who could you invite to sit in a bhajan with you?", "How do you feel after singing or listening to kirtan?", "What would you like to offer, simply by being present?"], "mins": 2, "id": "sit-in-the-bhajan", "reflect": "Do you ever feel you do not quite belong at the mandir?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Giving back what you gave", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["hope", "story"], "parts": ["During the terrible drought of 1987 and 1988, the Sanstha opened camps to feed and shelter farmers' cattle. Four devotees from Sangavadar came to see Pramukh Swami Maharaj in Gondal. Things were miserable, they admitted, but they felt reluctant to send their bullocks to the camps. For years they had given their yearly offerings to the mandir. Now it felt wrong to be helped by it.", "Swamishri asked them who had provided everything the mandir had. It was the devotees themselves, he said. They had sacrificed and given so much for Thakorji (God, as worshipped in the mandir). Now that they were in need, the mandir was helping them in turn. It was simply returning what they had given. There was no reason to hesitate, and he told them to send their bullocks to the camp at Bochasan.", "Many of us find it far easier to give than to receive, especially when times are hard and we feel we ought to be coping alone. Accepting help is not a failure or a debt. Often it is the love you have given over the years, quietly finding its way back to you. Let it."], "quote": "We are giving you what you have given us!", "src": "In the Joy of Others", "ch": "Ch. 15, \"A Friend in Need\", p. 295", "url": "", "take": "Accept one offer of help this week without apologising for it.", "reflects": ["Is it easier for you to give or to receive?", "What help have you been reluctant to accept lately?", "How have you given to others over the years?", "What would it feel like to see help as love returning to you?", "Who would be glad to support you if you let them?", "What stops you from accepting help?", "How do you feel when someone accepts your help gratefully?", "What would you say to a friend who felt too proud to be helped?", "How could you receive kindness this week without guilt?", "What does 'Satsang is family' mean when you are the one in need?"], "mins": 2, "id": "giving-back-what-you-gave", "reflect": "Is it easier for you to give or to receive?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Sure of his teeth", "by": "Pramukh Swami Maharaj", "theme": "faith", "needs": ["story", "learn"], "parts": ["Each afternoon in Gondal, Pramukh Swami Maharaj would sit informally with the sadhus and share out prasad (blessed offerings). One day he gave half an orange to Ramji Bhagat, a young novice who was often gently teased. A sadhu joked that Ramji had teeth and could manage harder fruit. Swamishri, keeping a straight face, asked Ramji whether he really had teeth.", "Ramji, who could never quite pronounce 'Swami', said he did. Could he see them? No. Then how did he know? Because he saw them in the mirror, Ramji insisted. Swamishri declared it must be a trick mirror; if he truly had teeth, he should be able to see them as plainly as his own palm! The whole room burst out laughing, Swamishri and Ramji loudest of all.", "Ramji held his ground: his teeth could not be seen, but he definitely had them. Smiling broadly, Swamishri drew the lesson. We should be just as sure that we have found God's company. You may not always feel God near or see him plainly, but that does not make his presence any less real."], "quote": "We should have a likewise conviction of having attained the association of God.", "src": "In the Joy of Others", "ch": "Ch. 16, \"Spiritual Teachings Made Simple\", pp. 301-303", "url": "", "take": "When God feels far today, remind yourself: unseen does not mean absent.", "reflects": ["When does God feel far away to you?", "What makes you sure of something you cannot see?", "How could Ramji's certainty help you on a doubtful day?", "What signs of God's company have you noticed this week?", "How does humour help you learn something deep?", "What does 'unseen does not mean absent' mean to you?", "Who in your life reminds you that God is near?", "What part of this story made you laugh?", "How could you hold on to faith when feelings are flat?", "What would you like to feel sure of today?"], "mins": 2, "id": "sure-of-his-teeth", "reflect": "When does God feel far away to you?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The note held high", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "hope"], "parts": ["At a Rakshabandhan celebration, crowds pressed forward to have a rakhdi (sacred thread) tied by Pramukh Swami Maharaj. One young boy only wanted to touch him. Three times he rose on tiptoe, lost his balance and was swept aside by the jostling crowd. His hopes began to fade. Then he had an idea. He slipped away from the crush and scribbled a short note.", "When the rush eased, he came back, stretched up on his toes and held the note high above his head with both hands. Swamishri noticed, bent down, took the note and blessed him, and the boy's joy knew no bounds. Back in his room, Swamishri read the scrap of paper and tucked it safely into his pagh (turban), keeping it for days.", "Later he gently pointed out to a local sadhu that the high seating had kept him from the child. A lofty throne adds nothing to anyone's greatness, he said; far better to arrange things so that he and the children could meet freely. If you have tried and been pushed back, keep holding your note up. You will be seen."], "quote": "One’s greatness is in no way elevated by sitting on a high sinhasan.", "src": "In the Joy of Others", "ch": "Ch. 17, \"With Blessings\", pp. 310-311", "url": "", "take": "Try once more today at something you gave up on, in a new way, like the boy's note.", "reflects": ["Where have you tried and been pushed back?", "What new way could you try to reach your goal?", "How do you think the boy felt when Swamishri took his note?", "What would you write on your note to Swamishri today?", "When have you felt swept aside by a crowd, literally or not?", "Who notices your efforts even when you feel small?", "How could you make yourself more reachable to others?", "What does it mean to you that Swamishri kept the note?", "What hope are you still holding up?", "How can you encourage someone who keeps getting pushed back?"], "mins": 2, "id": "the-note-held-high", "reflect": "Where have you tried and been pushed back?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "No worry is too small", "by": "Pramukh Swami Maharaj", "theme": "heavy", "needs": ["calm"], "parts": ["Over the years, Pramukh Swami Maharaj read and answered hundreds of thousands of letters, around fifty a day, writing in the car, in waiting rooms and even between X-rays at the dentist. People wrote for inspiration, with questions or troubles, to unburden their hearts, or simply to say hello. He answered even the most trivial, and devotees treasured replies in his own handwriting as if he had visited their homes.", "Some requests seem almost funny: blessings for a new well, advice on buying a scooter, what to do about a rickshaw that kept breaking down, or five anonymous postcards asking for hair to grow back. Others were weightier: how to stop noticing others' faults, how to keep faith at a difficult school. The book observes that what looks trivial to us may matter enormously to the person asking.", "Swamishri understood this, and so he answered every one with patience. You never need to decide whether a worry is big enough for prayer, or for telling someone you trust. If it matters to you, it is worth bringing. Small worries, once spoken aloud, often lose some of their grip."], "quote": "Some write for inspiration; some write with questions, others with afflictions", "src": "In the Joy of Others", "ch": "Ch. 17, \"With Blessings\", pp. 312-319", "url": "", "take": "Write down one small worry today and offer it to Maharaj, however minor it seems.", "reflects": ["What small worry have you been keeping to yourself?", "Do you ever feel your concerns are too minor to share?", "Who listens to your small worries without judging?", "What would you write in a short letter to Swamishri today?", "How do you feel after you have told someone what is bothering you?", "Which of the requests in this story made you smile?", "How could you take someone else's small worry seriously this week?", "What helps a worry lose its grip on you?", "When is a good time each day to offer your worries in prayer?", "What would it feel like to believe nothing you care about is too small for God?"], "mins": 2, "id": "no-worry-is-too-small", "reflect": "What small worry have you been keeping to yourself?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "He shook my hand", "by": "Pramukh Swami Maharaj", "theme": "lives", "needs": ["story", "calm"], "parts": ["After the 1991 festival in New Jersey, two teenagers who had served as exhibition guides went to meet Pramukh Swami Maharaj. Kalpesh wanted blessings for his further studies. His friend Mihir tagged along, nervous, because he had never met Swamishri privately before. When their turn came, Mihir went red in the face and ended up half bowing, half kneeling, unsure what to do.", "Swamishri took his hand and shook it, asked him in English how he was, and then asked his name. Soon Mihir was introducing himself and felt completely at home. Outside on the lawn the two boys could not contain themselves; they leapt into the air, shouting that he had met them. Mihir could not get over it: Swamishri had shaken his hand and spoken to him in English.", "At a youth camp in Ahmedabad, Swamishri listened just as warmly while a teenager named Mitul struggled bravely through a speech in Gujarati, almost willing him on. Nerves before a meeting or interview are normal. Kind people are rarely waiting for you to be polished. Many, like Swamishri, are quietly trying to help you feel at home."], "quote": "He met us, he met us!", "src": "In the Joy of Others", "ch": "Ch. 11, \"With Satsangis\", pp. 202-203, 221", "url": "", "take": "Before your next call or interview, picture a warm handshake and a kind question.", "reflects": ["What kinds of meetings make you most nervous?", "How did Swamishri put Mihir at ease?", "What would help you feel at home in an interview?", "When has someone's kindness calmed your nerves?", "How could you make a nervous person feel welcome this week?", "What does 'being polished' mean to you, and does it matter as much as you think?", "How do you usually introduce yourself when anxious?", "What would you like an interviewer to know about you?", "When have you struggled bravely through something, like Mitul?", "What small joy could you celebrate afterwards, like the boys on the lawn?"], "mins": 2, "id": "he-shook-my-hand", "reflect": "What kinds of meetings make you most nervous?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Singing your way to stillness", "by": "the shastras", "theme": "kirtan", "needs": ["calm", "learn"], "parts": ["Kirtan bhakti is devotion through song. The book describes it simply: chanting God's holy names, and singing bhajans (devotional songs) about his divine actions, his virtues and his murti (sacred image), right down to his clothes and ornaments. It is one of the nine classical forms of bhakti, and it is open to everyone, whatever their voice sounds like and however much they know.", "The book quotes the Shrimad Bhagvat, an ancient scripture, which says that in Kaliyug, our present age, the highest spiritual state can be reached through kirtan. That is a remarkable claim for something as ordinary as singing. It suggests God does not only meet us in silence, study and effort, but also in melody, in a tune hummed while getting ready for the day.", "The book also explains why kirtan helps. Our senses and thoughts are easily pulled towards passing things. When we sing about God, they are gathered together and given somewhere good to rest. The result, it says, is peace, inner purity and tranquillity. A bhajan can be a gentle way of bringing a scattered mind back home."], "quote": "Kirtan bhakti results in peace, inner purity and tranquility.", "src": "Royal Path of Brahmavidya Sadhana", "ch": "Ch. 5, \"Swadharmanishtha: Bhakti I\", Kirtan Bhakti, pp. 78-79", "url": "", "take": "Put on one bhajan you love and sing along, even softly, before your day begins.", "reflects": ["Which bhajan or kirtan do you find yourself humming most often?", "When did singing last change how you felt inside?", "Which part of Maharaj's life would you most like to sing about?", "Do you prefer singing alone or with others? Why?", "Which line of a kirtan has stayed with you for years?", "How does your mind feel after five minutes of singing compared with before?", "Is there a time of day when a bhajan would help you most?", "Who taught you your first kirtan?", "What stops you from singing more often, and could one small change help?", "If you could only keep one bhajan, which would it be?"], "mins": 2, "id": "singing-your-way-to-stillness", "reflect": "Which bhajan or kirtan do you find yourself humming most often?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "The mantra that walks with you", "by": "Gunatitanand Swami", "theme": "kirtan", "needs": ["calm", "strength"], "parts": ["Among all the forms of kirtan, the simplest is the name itself. Bhagwan Swaminarayan gave his followers the Swaminarayan mahamantra, the great mantra of his own name. It needs no instrument, no book, no special place and no particular mood. It can be said aloud, whispered under your breath, or held silently in the mind while you do something else.", "Gunatitanand Swami, the first guru in the succession after Bhagwan Swaminarayan, spoke about this mantra with great conviction. In the Swamini Vato, his recorded talks, he says there is no more powerful mantra today, that it loosens the pull of worldly desires, and that one should always chant it. In another talk he notes it can be chanted while moving around or walking.", "This makes the mantra a companion rather than a task. It can travel with you to the shops, to an interview, or along a quiet evening walk. Each repetition is a small turning of attention towards God, woven into ordinary moments rather than set apart from them. Nothing about your day needs to stop for it."], "quote": "Today, there is no mantra more powerful than the Swaminarayan mantra.", "src": "Royal Path of Brahmavidya Sadhana", "ch": "Ch. 5, \"Swadharmanishtha: Bhakti I\", Kirtan Bhakti, p. 79", "url": "", "take": "On your next walk, silently repeat 'Swaminarayan' in time with your steps for one minute.", "reflects": ["When do you most naturally remember to chant 'Swaminarayan'?", "How does chanting feel different when walking rather than sitting still?", "Is there a daily journey where the mantra could keep you company?", "What does it mean to you that the mantra needs nothing but your attention?", "Have you ever chanted the mantra in a worried moment? What happened?", "Who in your family chants most often, and what have you noticed in them?", "Would you rather chant aloud or silently? Why?", "What is one ordinary task you could pair with the mantra this week?", "How might it feel to think of the mantra as a companion rather than a duty?", "What would you like the mantra to help you put down today?"], "mins": 2, "id": "the-mantra-that-walks-with-you", "reflect": "When do you most naturally remember to chant 'Swaminarayan'?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Never tired of bhajans", "by": "Bhagwan Swaminarayan", "theme": "kirtan", "needs": ["learn", "hope"], "parts": ["The Vachanamrut, the recorded discourses of Bhagwan Swaminarayan, contains a lovely personal admission. In Gadhada II 49 he says his mind never has enough of spiritual talks, devotional songs, conversations about God or meditation on him. However much there is, he wants more. Then he gently invites everyone listening to be the same.", "It is striking that devotional songs sit on his list right beside discourse and meditation. Kirtan is not treated as a light extra or a warm-up before the serious part. It is one of the things God himself delights in, and the book presents it as one of the nine forms of bhakti with real spiritual value of its own.", "The book carries this into seva, selfless service, too. Among its guidance on how to serve, it suggests remembering Maharaj and Swami and singing devotional songs while doing seva. Sweeping, setting out chairs or tidying a room can become a quiet form of worship when a bhajan runs alongside the work."], "quote": "My mind never becomes satiated with spiritual discourses, devotional songs", "src": "Royal Path of Brahmavidya Sadhana", "ch": "Ch. 5, \"Swadharmanishtha: Bhakti I\", pp. 74-75 and 86", "url": "", "take": "Next time you tidy or do a chore, hum a bhajan and let the work become seva.", "reflects": ["What do you never tire of, and what does that say about what you love?", "Which devotional song could you listen to again and again?", "How does it feel to know Maharaj himself loved devotional songs?", "Which everyday task could you pair with a bhajan?", "Does singing make seva feel lighter for you? In what way?", "When have you felt closest to God through music?", "Is there a kirtan you would like to learn properly this month?", "What might change if chores felt like offerings?", "Who could you share a favourite bhajan with this week?", "What does 'never satisfied' mean, in a good way, for you?"], "mins": 2, "id": "never-tired-of-bhajans", "reflect": "What do you never tire of, and what does that say about what you love?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Guarding a precious find", "by": "Nishkulanand Swami", "theme": "kirtan", "needs": ["story", "strength"], "parts": ["Nishkulanand Swami was one of the paramhansas, the senior sadhus, of Bhagwan Swaminarayan, and a gifted poet. The book quotes his composition the Chosath Padi, a set of sixty-four verses. One line feels like a gentle hand on the shoulder: believe that you have received something exceptional, and do not let it slip out of your hands.", "What is that exceptional thing? The book answers: the presence of Bhagwan Swaminarayan, the guidance of the Gunatit guru, and a path to God that it describes as rare even for the deities. The poet says to protect it day and night, whether sitting or sleeping, because something this valuable deserves care.", "The book offers a simple picture. With only a few coins in your pocket, you might doze off on a train. With something truly valuable, you stay awake and keep a hand on it. Nishkulanand Swami's verse is less a warning than a reminder of worth: what you hold is precious, so hold it with love and attention."], "quote": "protect it day and night, while sitting and sleeping", "src": "Royal Path of Brahmavidya Sadhana", "ch": "Ch. 11, \"Savdhani: Introduction and Kusang\", pp. 172-173", "url": "", "take": "Write down one thing about your satsang that feels precious, and keep it where you will see it.", "reflects": ["What in your spiritual life feels most precious to you right now?", "How do you usually look after the things you value?", "What helps you remember your faith on busy or tired days?", "Is there anything that quietly pulls you away from what you treasure?", "Which kirtan line reminds you of how fortunate you are?", "How might you 'keep a hand on' your faith during the week?", "Who helps you protect what matters to you?", "What is one small habit that guards your peace?", "When did you last feel truly grateful for satsang?", "If your faith were a jewel, where would you keep it?"], "mins": 2, "id": "guarding-a-precious-find", "reflect": "What in your spiritual life feels most precious to you right now?", "scan": "", "letter": false, "src_kind": "book"}, {"title": "Now God comes looking", "by": "Gunatitanand Swami", "theme": "heavy", "needs": ["hope", "calm"], "parts": ["For centuries, seekers in India went looking for God. The book describes people who endured great hardship, chanted God's name countless times and gave up comforts, all hoping to reach him. It recalls these long and difficult searches in order to set up a surprising and tender reversal that changes how the whole path looks.", "In the Swamini Vato, Gunatitanand Swami says that in earlier times aspirants searched for God, but today God searches for the aspirants. The book explains that Bhagwan Swaminarayan came to earth out of compassion and remains present through the Gunatit guru, so the finding has already happened. God has found his devotees and drawn them close.", "On days when you feel far away, lost or not good enough to reach God, this turns the picture around. You are not climbing an impossible mountain on your own. You are the one being sought. What remains is not to find him, but simply to recognise, a little more each day, that he is already near."], "quote": "today God searches for the spiritual aspirants", "src": "Royal Path of Brahmavidya Sadhana", "ch": "Ch. 1, \"Swaminarayan Sadhana\", pp. 14-15", "url": "", "take": "When you feel distant from God today, say quietly: 'He is looking for me too.'", "reflects": ["When have you
